[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tolokaforge-models"
version = "1.0.0"
description = "Model data and per-model policy subclasses for tolokaforge."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Renaud de la Gueronniere"},
    {name = "Tolokaforge Contributors"},
]
keywords = ["llm", "benchmark", "tool-use", "models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tolokaforge>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["tolokaforge_models"]

[tool.hatch.build.targets.wheel.force-include]
"tolokaforge_models/data/pricing.json" = "tolokaforge_models/data/pricing.json"
"tolokaforge_models/data/model_presets.yaml" = "tolokaforge_models/data/model_presets.yaml"
"tolokaforge_models/data/providers.yaml" = "tolokaforge_models/data/providers.yaml"
