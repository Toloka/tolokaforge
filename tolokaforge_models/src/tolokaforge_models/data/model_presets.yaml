# Model capability presets — declarative mapping from model/provider
# to capability policies.
#
# Merge order: default → matched model preset → provider override → config.capabilities
#
# Slot values are either a bare policy name (``content_policy: nova``) or a
# ``{name, params}`` mapping when the class takes construction kwargs
# (``message_assembly_policy: {name: nova, params: {empty_assistant_filler: ...}}``).
#
# Policy names map to implementations in tolokaforge.core.llm.*:
#   schema_sanitizer:        passthrough | strict | gemini | gemini_recursive
#   prompt_policy:            none | dict_map_hints | dict_map_hints_ref
#   content_policy:           openai | anthropic | nova
#   response_policy:          standard | unwrap_input | json_coerce
#                             | array_dict_map | scalar_array_dict_map
#                             | minimax_m3_tags
#   reasoning_codec:          none | anthropic | openai
#                             | openai_summary_replay | gemini
#   cache_policy:             none | anthropic_ephemeral
#   params_policy:            generation_params (default; ``params:`` on the
#                             preset are the ``GenerationParams`` kwargs)
#   message_assembly_policy:  null (default) | nova
#     ``nova`` substitutes ``empty_assistant_filler`` (default
#     ``"I'll help you with that."``) for empty assistant content on
#     tool-call turns — Bedrock rejects the empty shape. Every other
#     preset stays on ``null``: injecting the filler elsewhere creates
#     a few-shot pattern that Gemini echoes back as its own response
#     (2026-04-30 OTS regression).
#   assistant_text_policy:    passthrough (default; every shipped preset)
#     A subclass reshapes ``message.content`` before it lands in
#     ``GenerationResult.text`` — used out-of-tree to strip provider
#     markers (e.g. Cohere's ``<|START_TEXT|>…<|END_TEXT|>`` delimiters
#     under #929) without an engine release.

default:
  schema_sanitizer: passthrough
  prompt_policy: none
  content_policy: openai
  response_policy: standard
  params:
    supports_seed: true
    reasoning_via_extra_body: false

presets:
  # Cohere Command A+ 05-2026 (the gateway ``azure_ai`` route) — landed via
  # auto-resolve (Slack-requested integration, PR #1124). Declared BEFORE the
  # generic ``cohere_command_a_plus`` preset so first-match-wins routing picks
  # it up; its match globs name this dated route only, so no sibling
  # cohere-command-* route is affected.
  #
  # This entry is a strict SUPERSET of the shared preset below — each axis is a
  # subclass of the axis it replaces, and the ``tool_choice``/``auto`` drop rule
  # is carried over verbatim (without it litellm refuses the request on this
  # route and every tool probe fails at once). Three observed 0/15 failures on
  # the ``default`` observe baseline, each fixed and reprobed 5/5:
  #
  #   * ``schema_sanitizer: cohere_recursive`` (``CohereRecursiveSchema``) —
  #     ``strict`` raised "$ref resolution exceeded depth 16" IN-ENGINE on the
  #     recursive ``_TreeNode``, so the model never saw ``submit_tree``:
  #     ``recursive_ref_tool_call`` 0/15 on all four shapes. The subclass adds
  #     cycle-tolerant ``$ref`` inlining plus ``carry_scalar_dict_map_value``
  #     (which took ``dict_map__scalar_values``, ``dict_map__nested_in_object``
  #     and ``discriminated_union__union_in_dict_map`` from 0/15 to 5/5), and
  #     keeps ``strip_re2_incompatible_patterns`` — load-bearing here, since
  #     this route compiles lookaround patterns and returns HTTP 500
  #     ("regex_converter.cc:75: Lookahead is not supported yet").
  #   * ``response_policy: cohere_root_key_repair``
  #     (``CohereRootKeyRepairResponse``) — reverses the sanitiser's
  #     ``{key, value}`` carriage (as ``array_dict_map`` did), and adds a
  #     schema-gated depth-0 root-key rename: on a single-``object``-root tool
  #     this route sometimes emits the parameter key with the tool's own name
  #     glued on (``{"submit_treeroot": {...}}`` for ``submit_tree({"root": …})``)
  #     with a fully correct tree underneath.
  #   * ``reasoning_codec: openai_summary_replay``
  #     (``OpenAISummaryReplayReasoningCodec``) — ``openai`` extracts the flat
  #     reasoning summary but emits nothing on replay, so the outgoing assistant
  #     dict carried no ``reasoning_details``: ``unsigned_thinking_replay``
  #     0/15. The subclass keeps ``extract`` verbatim and rebuilds the unsigned
  #     OpenRouter envelope. It synthesises no signature, so
  #     THINKING_REPLAY_ROUNDTRIP remains a declared ceiling.
  cohere_command_a_plus_05_2026:
    match:
      - "azure_ai/cohere-command-a-plus-05-2026"
      - "*cohere-command-a-plus-05-2026*"
    schema_sanitizer: cohere_recursive
    response_policy: cohere_root_key_repair
    reasoning_codec: openai_summary_replay
    params:
      param_value_rules:
        tool_choice:
          auto:
            action: drop
            evidence: >-
              2026-08-01, verified live: identical client, prompt and tools,
              WITHOUT tool_choice the model returns a correct tool call; WITH
              tool_choice='auto' the call never leaves litellm
              (UnsupportedParamsError on the azure_ai route). Cohere's Chat API
              has no AUTO: https://docs.cohere.com/reference/chat

  # Cohere Command A+ (reached through a LiteLLM gateway's ``azure_ai`` route).
  #
  # Cohere's Chat API accepts only REQUIRED and NONE for tool_choice — there is
  # no AUTO — and its documented behaviour when the parameter is OMITTED is
  # "the model is free to choose whether to use the specified tools or not".
  # That is what auto means, so dropping it reproduces the intended semantics
  # natively rather than working around anything.
  #
  # What surfaces the problem is litellm refusing the parameter first
  # (UnsupportedParamsError: azure_ai does not support parameters:
  # ['tool_choice']), which reads as "this model cannot call tools" when every
  # tool probe fails at once.
  cohere_command_a_plus:
    match:
      - "azure_ai/cohere-command-a-plus*"
      - "*cohere-command-a-plus*"
    schema_sanitizer: strict
    response_policy: array_dict_map
    reasoning_codec: openai
    params:
      param_value_rules:
        tool_choice:
          auto:
            action: drop
            evidence: >-
              2026-08-01, verified live: identical client, prompt and tools,
              WITHOUT tool_choice the model returns a correct tool call; WITH
              tool_choice='auto' the call never leaves litellm
              (UnsupportedParamsError on the azure_ai route). Cohere's Chat API
              has no AUTO: https://docs.cohere.com/reference/chat

  # Claude 4.8 (Opus + Sonnet) — same adaptive-thinker contract as 4.7:
  # ignores ``reasoning_effort``, requires the canonical litellm ``thinking=``
  # kwarg + explicit ``budget_tokens``. Listed FIRST so first-match-wins
  # routing picks the version-specific preset before the generic ``anthropic``.
  anthropic_claude_4_8:
    match:
      - "anthropic/claude-opus-4.8*"
      - "anthropic/claude-sonnet-4.8*"
      - "*claude-opus-4.8*"
      - "*claude-sonnet-4.8*"
    content_policy: anthropic
    reasoning_codec: anthropic
    cache_policy: anthropic_ephemeral
    params:
      supports_seed: false
      reasoning_via_thinking_kwarg: true
      drop_sampling_when_thinking: true
      reasoning_budget_default: 8000

  # Claude 4.7 (Opus + Sonnet) — Anthropic's adaptive thinker that ignores
  # ``reasoning_effort`` and requires the canonical litellm ``thinking=``
  # kwarg + explicit ``budget_tokens``. Listed BEFORE the generic
  # ``anthropic`` preset so first-match-wins routing picks it up.
  anthropic_claude_4_7:
    match:
      - "anthropic/claude-opus-4.7*"
      - "anthropic/claude-sonnet-4.7*"
      - "*claude-opus-4.7*"
      - "*claude-sonnet-4.7*"
    content_policy: anthropic
    reasoning_codec: anthropic
    cache_policy: anthropic_ephemeral
    params:
      supports_seed: false
      reasoning_via_thinking_kwarg: true
      drop_sampling_when_thinking: true
      reasoning_budget_default: 8000

  # Claude Opus 5 — landed via auto-resolve (Slack-requested integration,
  # PR #614). Declared BEFORE the generic ``anthropic`` preset so
  # first-match-wins routing picks it up. It is the generic ``anthropic``
  # preset (content/reasoning/cache = anthropic, supports_seed:false — the
  # signed thinking-block probes passed 15/15 natively, so the reasoning codec
  # must be preserved) PLUS one Opus-5-observed fix the shared preset does not
  # carry (scoped to THIS model's match globs so no sibling Anthropic route is
  # affected):
  #
  #   * ``response_policy: json_coerce`` (shipped ``JsonCoerceResponse``) — the
  #     observe (default) preset surfaced ONE preset-fixable failure:
  #     ``discriminated_union_two_turns[explicit_discriminator]`` 0/15, where
  #     the model emitted the ``item`` discriminated-union member as a
  #     JSON-encoded STRING (``'{"kind": "ticket", ...}'``) instead of a nested
  #     dict. The ``bare_union`` variant round-tripped natively (15/15), so this
  #     is a serialisation quirk, not a capability gap. ``JsonCoerceResponse``
  #     json.loads-decodes a top-level string arg whose first char is ``{``/``[``
  #     back to the native container (scalar strings like ``table`` untouched).
  #     Reprobe went 5/5 on the fix-target.
  anthropic_claude_opus_5:
    match:
      - "anthropic/claude-opus-5*"
      - "*claude-opus-5*"
    content_policy: anthropic
    reasoning_codec: anthropic
    cache_policy: anthropic_ephemeral
    response_policy: json_coerce
    params:
      supports_seed: false

  anthropic:
    match:
      - "anthropic/*"
      - "*claude*"
    content_policy: anthropic
    reasoning_codec: anthropic
    cache_policy: anthropic_ephemeral
    params:
      supports_seed: false

  openai_gpt5:
    match:
      - "openai/gpt-5*"
      - "*gpt-5*"
    schema_sanitizer: strict
    response_policy: array_dict_map
    reasoning_codec: openai

  xai_grok:
    match:
      - "x-ai/*"
      - "xai/*"
      - "grok*"
    schema_sanitizer: strict
    response_policy: array_dict_map
    reasoning_codec: openai

  # qwen/qwen3.8-max — model-specific overlay landed via auto-resolve
  # (Slack-requested integration, PR #845). Declared BEFORE the generic
  # ``qwen`` preset so first-match-wins routing picks it up for this one route
  # only; every other qwen/* route keeps the bundled ``qwen`` axes untouched.
  # It is the bundled ``qwen`` preset (passthrough schema + json_coerce
  # response + dict_map_hints prompt) with ONE axis swapped:
  #
  #   reasoning_codec: openai -> gemini
  #
  # Why: the sole preset-fixable observe failure was
  # ``test_unsigned_thinking_replay`` (0/15). The ``openai`` codec's
  # ``encode_for_replay`` is a no-op (returns ``{}``), so turn-1 reasoning
  # TEXT never round-trips into the turn-2 request payload. qwen3.8-max DOES
  # emit unsigned reasoning text (observe trajectories: 1310 ``summary_text``
  # blocks, all ``signature: null``) — the identical surface Gemini Pro
  # exposes over OpenRouter, which is exactly what ``GeminiReasoningCodec``
  # extracts and re-emits as ``reasoning_details`` on replay. No signatures
  # are invented (the codec tolerates ``signature: null`` and preserves None),
  # so no false capability is manufactured. Reprobe went 5/5 on the
  # fix-target. THINKING_REPLAY_ROUNDTRIP (needs signed blocks) and
  # PROMPT_CACHING (Anthropic cache_control) remain genuine ceilings — see
  # registry.py.
  qwen3_8_max_unsigned_reasoning_replay:
    match:
      - "qwen/qwen3.8-max"
      - "*qwen3.8-max"
    schema_sanitizer: passthrough
    response_policy: json_coerce
    prompt_policy: dict_map_hints
    reasoning_codec: gemini

  qwen:
    # Qwen 3.x emits dict-map arguments as either native dicts (matching the
    # task docs + DictMapHints) or stringified JSON. The pre-bugfix ``strict``
    # schema rewrite to array-of-objects was a no-op (Qwen never picked the
    # array shape) and contradicted the dict-format hint + task docs. Routing
    # through ``passthrough`` schema keeps hints/schema/docs aligned;
    # ``json_coerce`` recovers the stringified-JSON failure mode.
    match:
      - "qwen/*"
      - "qwen3*"
    schema_sanitizer: passthrough
    response_policy: json_coerce
    prompt_policy: dict_map_hints
    reasoning_codec: openai

  # deepseek/deepseek-v4-flash-0731 — model-specific overlay landed via
  # auto-resolve (Slack-requested integration, PR #846). Declared BEFORE the
  # shared ``openrouter_dict_stringify_recovery`` preset (whose ``*deepseek-v4*``
  # glob it would otherwise match) so first-match-wins routing picks it up. It is
  # a SUPERSET of that shared preset: it reproduces the three tool-calling axes
  # verbatim — ``schema_sanitizer: passthrough`` + ``response_policy: json_coerce``
  # + ``prompt_policy: dict_map_hints`` (all 28 tool-call / structural probes pass
  # 15/15 under the shared preset) so nothing tool-calling-side regresses — and
  # swaps ONLY the reasoning codec.
  #
  # The one observe fix-target was ``UNSIGNED_THINKING_REPLAY`` (0/15). The route
  # surfaces reasoning as an OpenAI ``reasoning_content`` summary and emits no
  # signatures on the wire (it DOES emit a ``reasoning_details`` envelope of its
  # own with ``format: "unknown"``, which the OpenAI extract discards — see the
  # codec docstring and the deepseek_v4 fixture). Under the
  # ``THINKING_EMITS_BLOCKS`` passes) but ``encode_for_replay`` is a no-op, so the
  # outgoing assistant dict carries no ``reasoning_details`` and the unsigned
  # replay contract fails. ``openai_summary_replay``
  # (``OpenAISummaryReplayReasoningCodec``) inherits the OpenAI extract unchanged
  # and re-emits that block text as an OpenRouter ``reasoning.text`` entry —
  # satisfying the contract without synthesising a signature. Signed replay
  # (``THINKING_REPLAY_ROUNDTRIP``) and explicit ``PROMPT_CACHING`` stay genuine
  # ceilings (see registry.py). Reprobe went 5/5 on the fix-target.
  #
  # SCOPE — what this preset does and does not buy (verified live 2026-08-04).
  # ``UNSIGNED_THINKING_REPLAY`` is a PAYLOAD-level contract: the test fires
  # turn 1 live and mocks turn 2, asserting only the outgoing request body. A
  # controlled A/B (same conversation with vs without the replay payload)
  # measured turn-2 ``prompt_tokens`` 523 vs 523 — delta 0 — with
  # ``reasoning_details`` confirmed on the wire. The DeepSeek V4 route accepts
  # the field and silently IGNORES it, so this preset buys contract conformance
  # and trajectory observability, NOT restored cross-turn reasoning continuity,
  # and it costs ~2.8 kB of upload per reasoning turn. Tool-calling behaviour —
  # the only axis the eval grades — is byte-identical to the shared preset. If
  # that upload ever matters more than the declared capability, deleting this
  # preset and letting the model fall through to
  # ``openrouter_dict_stringify_recovery`` is behaviourally safe; it only
  # requires flipping the cert's ``UNSIGNED_THINKING_REPLAY`` back to
  # ``known_unsupported`` (the sibling posture).
  deepseek_v4_flash_0731_resolve:
    match:
      - "deepseek/deepseek-v4-flash-0731"
      - "deepseek/deepseek-v4-flash-0731*"
    schema_sanitizer: passthrough
    response_policy: json_coerce
    prompt_policy: dict_map_hints
    reasoning_codec: openai_summary_replay

  # Open-weights / OpenAI-API-compatible routes whose tool-call adapters
  # stringify nested object / Dict[str, T] arguments — same failure mode
  # ``JsonCoerceResponse`` was built for on Qwen.
  #
  # Empirical evidence: mimo-v2.5-pro hit 20–25 retries on every
  # ``zendesk_create_item`` call on a logistics domain evaluation
  # when ``item`` is a discriminated union (TicketCreate | UserCreate |
  # OrganizationCreate | CommentCreate). The wire-shape was
  # ``{"item": "{\"subject\":...}"}`` — a JSON-encoded string instead of a
  # nested dict. ``JsonCoerceResponse`` (via ``coerce_json_strings``) decodes that
  # back to native shape before pydantic validation.
  # ``DictMapHints`` is also routed because the same models share Qwen's
  # ``Dict[str, T]`` blind spot (test_dict_map_tool_call).
  # Reasoning surface format on the OpenRouter wire is not yet codified in
  # a bespoke codec for these routes; ``openai`` codec is the safe baseline
  # — it surfaces ``reasoning_content`` summaries via OpenAI-canonical fields
  # without making structural assumptions.
  # z-ai/glm-5.1, tencent/hy3-preview and nvidia/nemotron-3-super join
  # this preset (arena lineup refresh 2026-06): each emits the
  # discriminated-union ``item`` as a JSON-encoded string that
  # JsonCoerceResponse decodes — glm/hy3 every call, nemotron
  # intermittently (native dict on some calls, stringified on others;
  # without json_coerce the stringified calls fail, so it needs this
  # preset to make the capability reliable). All three also surface a
  # reasoning_content summary the ``openai`` codec lands in the logs.
  # Live 2026-06-05.
  openrouter_dict_stringify_recovery:
    match:
      - "xiaomi/mimo*"
      - "*mimo-v2*"
      - "moonshotai/kimi-k2*"
      - "*kimi-k2*"
      - "deepseek/deepseek-v4*"
      - "*deepseek-v4*"
      - "z-ai/glm-5*"
      - "*glm-5*"
      - "tencent/hy3*"
      - "*hy3-preview*"
      - "nvidia/nemotron*"
      - "*nemotron-*"
    schema_sanitizer: passthrough
    response_policy: json_coerce
    prompt_policy: dict_map_hints
    reasoning_codec: openai

  # thinkingmachines/inkling — model-specific overlay landed via auto-resolve
  # (Slack-requested integration, PR #719). Exact-match globs only; no generic
  # glob matches ``thinkingmachines/*`` so no sibling route is affected. The
  # model round-trips every canonical tool-call shape natively (schema stays
  # ``passthrough``), so the ONE non-default lever is a dict-map prompt policy:
  #
  #   * ``prompt_policy: dict_map_hints_ref`` (``RefResolvingDictMapHints``) —
  #     the observe (default) baseline surfaced two dict-map *structural
  #     variants* that regressed because the shipped ``DictMapHints`` never
  #     fired on them: ``wide_map`` (value schema is a ``$ref`` → value_fields
  #     empty, hint skipped) 2/15, and ``nested_in_object`` (dict-map one level
  #     inside an ``object`` param, not detected) 5/15. On both variants the
  #     model intermittently answered in prose and omitted the tool call; the
  #     "MUST be included / DO NOT omit" nudge closes that lapse. The
  #     ref-resolving subclass adds exactly those two firing conditions (resolve
  #     a ``$ref`` value schema one hop; recurse one level into an ``object``
  #     param). Reprobe: ``wide_map`` 2/15 → 5/5 (fixed); ``nested_in_object``
  #     5/15 → 4/5 (lifted; the residual is a prose/no-tool-call consistency
  #     ceiling on that harder-worded variant, not a preset-fixable format
  #     artifact — see registry.py). ``DICT_MAP_TOOL_CALL`` itself is 15/15
  #     native and stays required.
  #   * ``reasoning_codec: openai`` — the model surfaces summary-only reasoning
  #     (provider_raw carries ``reasoning_tokens``, no signed thinking blocks).
  #     The OpenAI codec lands those summaries in the trajectory logs (same
  #     choice as the sibling ``openrouter_dict_stringify_recovery`` preset). It
  #     does NOT synthesize signed blocks, so THINKING_* stays known_unsupported
  #     (see registry.py) — declaring ``openai`` here does not inflate them.
  thinkingmachines_inkling:
    match:
      - "thinkingmachines/inkling"
      - "thinkingmachines/inkling*"
    schema_sanitizer: passthrough
    prompt_policy: dict_map_hints_ref
    reasoning_codec: openai

  # DeepSeek V3.2-Exp experimental V3.2 reasoning route.
  # Unlike the V4 line (openrouter_dict_stringify_recovery, above) it
  # round-trips dict-map and discriminated-union tool calls cleanly on
  # the standard response policy, so it needs neither json_coerce nor
  # dict_map_hints. The one non-default policy it needs is the OpenAI
  # reasoning codec, so its OpenRouter reasoning_content summary surfaces
  # in the trajectory logs like every other reasoning route here. The
  # codec's replay is a no-op on the OpenAI route, so this is
  # observability only; it does not change tool-calling or the
  # deterministic scoring. Live-certified 2026-06-03 (see registry.py).
  deepseek_v32:
    match:
      - "deepseek/deepseek-v3.2-exp*"
      - "*deepseek-v3.2-exp*"
    reasoning_codec: openai

  aws_nova:
    match:
      - "nova*"
    match_provider:
      - "nova"
    content_policy: nova
    response_policy: unwrap_input
    message_assembly_policy: nova

  # Amazon Nova via OpenRouter arrives org-prefixed as ``amazon/nova-*``
  # (e.g. ``amazon/nova-2-lite-v1``) with provider ``openrouter``, which
  # matches NEITHER ``aws_nova``'s ``nova*`` name glob NOR its
  # ``match_provider: [nova]``, so it would fall through to ``default``
  # (``message_assembly_policy: null`` — no filler). Bedrock-behind-OpenRouter
  # then 400s on blank-content assistant tool turns ("The text field in the
  # ContentBlock ... is blank"), crashing multi-turn domains
  # (ots_08_travel_internal scored 0%). Turn the filler ON via
  # ``message_assembly_policy: nova`` while KEEPING ``response_policy:
  # standard``: the OpenRouter route emits clean native-dict tool args that
  # round-trip under ``standard``; ``unwrap_input`` (used by direct
  # ``aws_nova``) is not a no-op on them. Declared AFTER ``aws_nova`` so the
  # direct-Nova path keeps winning first-match.
  aws_nova_openrouter:
    match:
      - "*amazon/nova*"
    content_policy: nova
    response_policy: standard
    message_assembly_policy: nova

  # google/gemini-3.5-flash — model-specific overlay landed via
  # auto-resolve (Slack-requested integration, PR #560). Declared BEFORE the
  # generic ``gemini`` preset so first-match-wins routing picks it up; it is
  # the ``gemini`` preset PLUS two Flash-observed schema-loss fixes that the
  # shared preset does not carry (scoped to THIS model's match globs so no
  # sibling Gemini route is affected):
  #
  #   1. ``schema_sanitizer: gemini_recursive`` — ``GeminiSchema`` fully
  #      inlines a recursive Pydantic ``$ref`` (``TreeNode.children:
  #      list[TreeNode]``) and raises "$ref resolution exceeded depth 16"
  #      IN-ENGINE before the request is sent, failing all four
  #      ``recursive_ref`` shapes 0/15. ``GeminiRecursiveSchema`` inlines every
  #      non-cyclic ref exactly like ``gemini`` but breaks a genuine
  #      self-reference with a permissive open object, so the wire schema is
  #      finite and the model emits the tree. It also carries a synthetic
  #      ``value`` field for scalar-valued dict-maps (``Dict[str, int]``).
  #   2. ``response_policy: scalar_array_dict_map`` — reverses the array-shaped
  #      dict-map back to a native dict for BOTH the scalar-value case
  #      (``{k: {"value": N}}`` → ``{k: N}``, closing
  #      ``dict_map__scalar_values`` 0/15) and a dict-map nested one level
  #      inside an object param (``order.lines``, closing
  #      ``dict_map__nested_in_object`` 0/15 — the root-only reverse pivot in
  #      ``array_dict_map`` never reached it).
  #
  # ``reasoning_codec: gemini`` matches the shared preset (decodes the Flash
  # ``reasoning.encrypted`` envelope). Reprobe went 5/5 on every fix-target.
  gemini_35_flash_recursive:
    match:
      - "google/gemini-3.5-flash"
      - "openrouter/google/gemini-3.5-flash"
    reasoning_codec: gemini
    schema_sanitizer: gemini_recursive
    response_policy: scalar_array_dict_map

  # Gemini 3.6 Flash - same two Flash-observed schema-loss fixes as its 3.5
  # sibling above, routed through the SAME ``gemini_recursive`` +
  # ``scalar_array_dict_map`` classes: the 2026-07-22 observe signature was
  # identical (recursive_ref crashed 0/15 in-engine; dict_map
  # scalar_values/nested_in_object variants 0/15). Consolidated into PR #560
  # from the parallel PR #559 run, whose standalone re-implementation was
  # dropped in favor of these inheritance-based classes. Exact match globs
  # only, listed BEFORE the generic ``gemini`` glob (first-match-wins).
  gemini_36_flash_recursive:
    match:
      - "google/gemini-3.6-flash"
      - "openrouter/google/gemini-3.6-flash"
    reasoning_codec: gemini
    schema_sanitizer: gemini_recursive
    response_policy: scalar_array_dict_map

  # Google Gemini family (3.x preview + 3.x GA + 2.5 backstop).
  # ``GeminiReasoningCodec`` decodes Gemini's OpenRouter
  # ``provider_specific_fields.reasoning_details`` envelope: handles
  # both ``reasoning.text`` (Pro lineage, readable thinking) and
  # ``reasoning.encrypted`` (Flash lineage, opaque payload). The codec
  # preserves bytes verbatim so subsequent turns can replay
  # reasoning_details and keep the model's reasoning context intact
  # across the trial.
  gemini:
    match:
      - "google/gemini-*"
      - "openrouter/google/gemini-*"
      - "*gemini-3*"
      - "*gemini-2.5*"
    reasoning_codec: gemini
    # Gemini's tool spec is a JSON-Schema subset (no $defs/$ref, no
    # oneOf/discriminator, dict-maps via additionalProperties not
    # robust). ``GeminiSchema`` does StrictSchema's $ref-inlining +
    # dict-map-to-array transform AND additionally flattens
    # ``oneOf`` discriminated unions into a single object schema
    # unioning every branch's properties. Live-verified 2026-05-20
    # against gemini-3-flash-preview, gemini-3.5-flash,
    # gemini-3.1-pro-preview: registered field names round-trip
    # correctly under this routing. See gotcha #21 in AGENTS.md
    # for the failure surface the routing closes.
    schema_sanitizer: gemini
    response_policy: array_dict_map

  # ---- Arena lineup refresh (2026-06) ----------------------------------
  # GPT-OSS 120B (OpenAI open-weights via OpenRouter) — NOT the GPT-5 API
  # line, so it does not match ``openai_gpt5``. Only non-default policy is
  # the ``openai`` reasoning codec so its reasoning_content summary lands
  # in the trajectory logs (observability only). It substitutes synonyms
  # for registered field names (``title`` for ``subject``, ``quantity``
  # for ``qty``) and this persists even under the Gemini schema
  # sanitizer's oneOf-flatten + dict-map-to-array (verified live
  # 2026-06-05), so that is a genuine model gap, NOT a schema-construct
  # one: DICT_MAP_TOOL_CALL + DISCRIMINATED_UNION_TOOL_CALL are declared
  # ``known_unsupported`` in registry.py rather than papered over with a
  # sanitizer that gives no lift but risks regressing the calls that pass.
  gpt_oss:
    match:
      - "openai/gpt-oss*"
      - "*gpt-oss*"
    reasoning_codec: openai

  # Gemma 4 (Google open-weights via OpenRouter) — NOT the Gemini API line
  # (no reasoning_details envelope), so it borrows the Gemini *schema*
  # sanitizer (oneOf-flatten + $ref-inline + dict-map-to-array) WITHOUT the
  # gemini reasoning codec. Gemma surfaces no structured reasoning, so no
  # reasoning_codec is set. Live 2026-06-05.
  gemma:
    match:
      - "google/gemma*"
      - "*gemma-*"
    schema_sanitizer: gemini
    response_policy: array_dict_map

  # MiniMax-M3 (MiniMax via OpenRouter): reasoning model on the M-series
  # 1M-context line. The ``openai`` reasoning codec surfaces the
  # reasoning_content summary in the trajectory logs (observability only;
  # replay is a no-op on the OpenAI route).
  #
  # ``response_policy: minimax_m3_tags`` recovers a provider-specific
  # corruption: M3's XML -> JSON tool-call conversion mangles the ``tags``
  # array on every emission (2505/2505 airlines occurrences). Two dominant
  # shapes — the XML repeated-element ``{"item": X}`` artefact (76 %) and a
  # JSON-encoded / empty string (23 %) — are recovered by the composite
  # ``MinimaxM3TagRecoveryResponse`` (JsonRecursiveCoerce then
  # ItemRecursiveUnwrap), scoped to the declared-array tags sites
  # ``updates.tags`` / ``item.tags`` only. The scoping is load-bearing: a
  # schema-agnostic empty-string -> [] is net-harmful (it corrupts scalar
  # fields on M2.7), so the recovery is tied to the tags-site allowlist and
  # cannot fire elsewhere. M2.7 emits native ``tags`` lists (0 corrupt) and is
  # NOT in this preset, so it is unaffected. See gotcha #25 in AGENTS.md.
  #
  # Separately, M3 intermittently mis-shapes typed Dict[str, T] /
  # discriminated unions (turn-2 prose instead of the union call): a genuine
  # model gap declared known_unsupported in registry.py, distinct from the
  # tags-conversion artefact the response policy fixes. Live 2026-06-08.
  minimax:
    match:
      - "minimax/minimax-m3*"
      - "*minimax-m3*"
    reasoning_codec: openai
    response_policy: minimax_m3_tags

providers:
  openrouter:
    params:
      reasoning_via_extra_body: true

  # Direct Gemini via litellm ``gemini/*`` provider.
  # As of litellm v1.83.14 (2026-05-21), passing ``reasoning_effort='medium'``
  # alongside tool calls produces empty responses for Gemini 3.1 Pro
  # (BerriAI/litellm#19403-class symptom — finish_reason=stop, zero
  # completion tokens, no tool_calls emitted). ``low`` and ``high`` work.
  # We surface this loud per AGENTS.md rule #1 rather than silently mapping
  # to ``high`` — the caller decides how to react (lower/raise effort,
  # switch to OpenRouter transport, wait for upstream fix).
  # The OpenRouter route is unaffected because it sends
  # ``extra_body.reasoning.effort=medium`` which OpenRouter translates
  # directly into Google's ``thinking_level=medium``.
  gemini:
    params:
      param_value_rules:
        reasoning_effort:
          medium:
            action: reject
            evidence: >-
              2026-05-21, litellm 1.83.14: reasoning_effort='medium' alongside
              tool calls returns an empty response on the direct gemini route
              (finish_reason=stop, zero completion tokens, no tool_calls) for
              Gemini 3.1 Pro. BerriAI/litellm#19403-class. low and high work;
              the OpenRouter route is unaffected because it sends
              extra_body.reasoning.effort
