combine:
  method: weighted
  weights:
    state_checks: 0.7
    transcript_rules: 0.3
  pass_threshold: 0.5
state_checks:
  jsonpaths:
    - path_glob: "/env/fs/agent-visible/submissions/*"
      contains_ci: "baseline"
      description: "Submission records the seeded widget name — proof the reset recipe overwrote init.sql's factory_default with baseline"
transcript_rules:
  max_turns: 8
  required_actions:
    - action_id: "query_api"
      requestor: assistant
      name: bash
      arguments: {}
      compare_args: []
    - action_id: "write_submission"
      requestor: assistant
      name: write_file
      arguments: {}
      compare_args: []
