# Per-invocation configuration for this run. Every field here is
# scoped to a single `tolokaforge run` — a different invocation can
# use a different run_config.yaml against the same project.yaml
# without editing the project.
#
# Fields declared here override same-named fields in project.yaml.
# Fields NOT declared here inherit from project.yaml (models,
# workers, budget, timeouts, artifact path, queue backend, etc.).
# See docs/architecture/PROJECTS.md § "Relationship to
# run_config.yaml" for the full field-ownership + precedence rules.

# ── Orchestrator run knobs (per-invocation only) ────────────────
# `repeats` and `max_turns` here are run-wide caps applied on top
# of any task-level max_turns override.
orchestrator:
  repeats: 1
  max_turns: 20
  # workers, runtime, queue_backend, timeouts, stuck_heuristics,
  # max_budget_usd, max_requests_per_second, max_attempt_retries,
  # typesense — all inherit from project.compute. Uncomment below
  # to override for this invocation:
  # workers: 8
  # runtime: per_trial

# ── Evaluation ──────────────────────────────────────────────────
# `task_packs` names which packs this run pulls in — always per-
# invocation. `tasks_glob` and `output_dir` inherit from project
# unless overridden here.
evaluation:
  task_packs:
    - "examples/native/example-microservices-pack"
  # tasks_glob defaults to project.tasks.discovery.glob:
  # tasks_glob: "tasks/**/task.yaml"
  # output_dir defaults to project.storage.artifacts.path:
  # output_dir: "results/example_microservices_pack"

# ── Models overrides (optional) ─────────────────────────────────
# project.yaml declares the default agent/user/judge models. This
# run inherits those defaults; uncomment below to override any of
# them for this invocation.
# models:
#   agent:
#     provider: "openrouter"
#     name: "anthropic/claude-opus-4-8"
#     temperature: 0.0
