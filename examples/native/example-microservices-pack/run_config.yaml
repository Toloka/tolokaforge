# Standard shape — no changes needed for the extension.
# The loader would discover tasks under tasks/**/task.yaml as today.

models:
  agent:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.0
    max_tokens: 4096
  user:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.2

orchestrator:
  workers: 1
  repeats: 1
  max_turns: 20
  queue_backend: sqlite
  runtime: per_trial

evaluation:
  task_packs:
    - "examples/native/example-microservices-pack"
  tasks_glob: "tasks/**/task.yaml"
  output_dir: "results/example_microservices_pack"
