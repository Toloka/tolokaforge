# Per-invocation configuration for this run. Every field here is
# scoped to a single `tolokaforge run` — a different invocation can
# use a different run config against the same project.yaml without
# editing the project. Ship additional profiles as
# run_config/ci.yaml, run_config/nightly.yaml, etc.
#
# See docs/architecture/PROJECTS.md § "Relationship to the run
# config" for the full field-ownership rules, and § "Deprecations
# and migrations" for the evaluation.projects field notes.

# ── Models — the models being evaluated. ────────────────────────
models:
  agent:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.0
    max_tokens: 4096
  user:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.2
  judge:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.0

# ── Compute — provider, parallelism, budget, retries, runtime. ──
compute:
  provider: "local-docker"
  workers: 1
  max_budget_usd: 20.0
  max_requests_per_second: 10.0
  max_attempt_retries: 3
  runtime_mode: "per_trial"
  # Provider-specific sub-sections live under compute.<provider>.
  # Only the block matching provider: is meaningful.
  # kubernetes:
  #   cluster: "prod-cluster"
  #   namespace: "toloka"
  #   resource_class: "gpu-large"

# ── Storage — where this run's artifacts, logs, and queue go. ───
storage:
  artifacts:
    type: "local"
    path: "./results"
  logs:
    type: "local"
    path: "./logs"
  queue:
    backend: "sqlite"
    # postgres_dsn: "postgresql://..."

# ── Observability — tracing / metrics / logging exporters. ──────
observability:
  tracing:
    exporter: "none"                # or "otlp"
    # endpoint: "http://collector:4317"
  metrics:
    exporter: "none"                # or "prometheus"
    # endpoint: "http://prom:9090"
  logging:
    level: "INFO"
    exporter: "stdout"              # or "otlp"

# ── Orchestrator run knobs ──────────────────────────────────────
orchestrator:
  repeats: 1
  max_turns: 20                     # run-wide ceiling
  auto_start_services: true
  shuffle_trials: false
  # schedule:
  #   cron: "0 6 * * *"

# ── Evaluation ──────────────────────────────────────────────────
# `evaluation.projects` is optional — when omitted, the loader uses
# the enclosing project (this project). Uncomment below only for
# the rare multi-project run.
evaluation:
  # projects:
  #   - "."                         # this project
  #   - "../other-project"          # additional project
  # tasks_glob: "tasks/**/task.yaml"
  output_dir: "results/example_microservices_pack"

# Legacy: `evaluation.task_packs` is still accepted as an alias
# for `evaluation.projects` but emits a DeprecationWarning at
# config load. See PROJECTS.md § "Deprecations and migrations".
