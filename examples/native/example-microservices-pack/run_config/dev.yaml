# Per-invocation configuration for this run. Every field here is
# scoped to a single `tolokaforge run` — a different invocation can
# use a different run config against the same project.yaml without
# editing the project. Ship additional profiles as
# run_config/ci.yaml, run_config/nightly.yaml, etc.
#
# See docs/architecture/PROJECTS.md § "Relationship to the run
# config" for the full field-ownership + precedence rules, and
# § "Deprecations and migrations" for the evaluation.projects
# field notes.

# ── Models — always declared on the run config, never on the
# project. The model being evaluated is the invocation's variable.
models:
  agent:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.0
    max_tokens: 4096
  user:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.2
  judge:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.0

# ── Orchestrator run knobs ──────────────────────────────────────
# `repeats` and `max_turns` are run-wide caps applied on top of
# any task-level max_turns override.
orchestrator:
  repeats: 1
  max_turns: 20
  # workers, runtime, queue_backend, timeouts, stuck_heuristics,
  # max_budget_usd, max_requests_per_second, max_attempt_retries
  # inherit from project.compute. Uncomment below to override for
  # this invocation:
  # workers: 8
  # runtime: per_trial

# ── Evaluation ──────────────────────────────────────────────────
# `evaluation.projects` is optional — when omitted, the loader uses
# the enclosing project (this project). `tasks_glob` and
# `output_dir` inherit from the project unless overridden here.
evaluation:
  # projects:                       # optional; defaults to enclosing project
  #   - "."                         # this project
  #   - "../other-project"          # additional project (multi-project run)
  # tasks_glob: "tasks/**/task.yaml"
  # output_dir: "results/example_microservices_pack"

# Legacy: `evaluation.task_packs` is still accepted as an alias
# for `evaluation.projects` but emits a DeprecationWarning at
# config load. See PROJECTS.md § "Deprecations and migrations".
