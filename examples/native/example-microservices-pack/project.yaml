# Project spec — the top-level abstraction for this pack.
# See docs/architecture/PROJECTS.md for the full model.
#
# The Project holds the eval spec — what the pack tests. It does
# NOT own compute, storage, observability, orchestrator, or models
# settings; those all live on the run config (run_config/*.yaml).
# Every top-level section lives in exactly one file.

name: "microservices-eval"
version: 1
description: >
  Evaluation suite for microservices refactoring tasks. Nine tasks
  share a base 4-service stack (runner + db-service + postgres +
  backend-api). One task overrides a single input for a postgres
  version bump; one ships its own compose file for isolation.

# ── Task inventory ──────────────────────────────────────────────
tasks:
  discovery:
    glob: "tasks/**/task.yaml"

# ── Default environment ─────────────────────────────────────────
# Every task inherits this unless it declares its own
# `environment_manifest`. Task-level environment_manifest deep-
# merges on top per-task.
default_environment:
  compose_file: "./shared/environment.compose.yaml"
  runner_service: "runner"
  inputs:
    postgres_version: "16"
  isolation: "per_trial"
  network_policy: "LOCALHOST_ONLY"
  security_context_defaults:
    user: "toloka"
    group: "toloka"

# ── Task-level defaults ─────────────────────────────────────────
# Applied to every task; task fields override on deep-typed merge.
# The primary mechanism for sharing task-level config across the
# project. Includes task-shape properties (timeouts,
# stuck_heuristics, continue_prompt) that describe how the pack's
# tasks are shaped, not how a particular invocation executes.
task_defaults:
  adapter_type: "native"
  max_turns: 20
  system_prompt: "./shared/system_prompt.md"
  user_simulator:
    mode: "llm"
    persona: "curious engineer"
  policies:
    max_tool_calls_per_turn: 10
  metadata: {}
  adapter_settings: {}
  tools: {}
  grading_defaults:
    combine:
      method: "weighted_average"
      pass_threshold: 0.7
      weights:
        state_checks: 0.5
        llm_judge: 0.5

  # Task-shape properties — describe the pack's tasks, not a
  # particular invocation. Timeouts reflect how long tasks
  # reasonably take; stuck heuristics describe how the agent
  # typically gets stuck; continue_prompt is the nudge string.
  timeouts:
    trial_seconds: 600
    tool_call_seconds: 60
  stuck_heuristics:
    enabled: true
    max_repeated_tool_calls: 5
    max_idle_turns: 3
  continue_prompt: "Continue."

# That's the entire Project schema. No compute, storage,
# observability, orchestrator, or models sections here — all of
# those live on run configs under run_config/*.yaml.
