# Project spec — the top-level abstraction for this pack.
# See docs/architecture/PROJECTS.md for the full model.
#
# The Project holds identity, task discovery, and the shared bases
# for tasks (task_defaults) and runs (run_defaults). Per-item
# deltas live in tasks/<name>/task.yaml and run_configs/<name>.yaml.

name: "microservices-eval"
version: 1
description: >
  Evaluation suite for microservices refactoring tasks. Seven tasks
  share a base 4-service stack (runner + db-service + postgres +
  backend-api). One task overrides a single input for a postgres
  version bump; one ships its own compose file for isolation.

# ── Task inventory ──────────────────────────────────────────────
tasks:
  discovery:
    glob: "tasks/**/task.yaml"

# ── Default environment ─────────────────────────────────────────
# Every task inherits this unless it declares its own
# `environment_manifest`. Task-level environment_manifest deep-
# merges on top per-task.
default_environment:
  compose_file: "./shared/environment.compose.yaml"
  runner_service: "runner"
  inputs:
    postgres_version: "16"
  # isolation omitted → defaults to shared_ok. Per-service
  # tolokaforge.isolation labels in the compose file drive
  # between-trial behaviour.
  network_policy: "LOCALHOST_ONLY"
  security_context_defaults:
    user: "toloka"
    group: "toloka"

# ── Task defaults — base for every task ─────────────────────────
# Applied to every task; task.yaml fields deep-merge on top.
# Holds task-shape properties (timeouts, stuck_heuristics,
# continue_prompt) that describe how the pack's tasks are shaped,
# not how a particular invocation executes.
task_defaults:
  adapter_type: "native"
  max_turns: 20
  system_prompt: "./shared/system_prompt.md"
  user_simulator:
    mode: "llm"
    persona: "curious engineer"
  policies:
    max_tool_calls_per_turn: 10
  metadata: {}
  adapter_settings: {}
  tools: {}
  grading_defaults:
    combine:
      method: "weighted_average"
      pass_threshold: 0.7
      weights:
        state_checks: 0.5
        llm_judge: 0.5
  timeouts:
    trial_seconds: 600
    tool_call_seconds: 60
  stuck_heuristics:
    enabled: true
    max_repeated_tool_calls: 5
    max_idle_turns: 3
  continue_prompt: "Continue."

# ── Run defaults — base for every run config ────────────────────
# Applied to every run under run_configs/; a run_configs/<name>.yaml
# file's fields deep-merge on top. This is where compute, storage,
# observability, and orchestrator run knobs shared across most
# invocations live. `models` typically varies per invocation and
# lives in run_configs/*.yaml, but shared model settings (e.g. a
# uniform temperature) can be placed here.
run_defaults:
  compute:
    provider: "local-docker"
    workers: 1
    max_budget_usd: 20.0
    max_requests_per_second: 10.0
    max_attempt_retries: 3
  storage:
    artifacts:
      type: "local"
      path: "./results"
    logs:
      type: "local"
      path: "./logs"
    queue:
      backend: "sqlite"
  observability:
    tracing:
      exporter: "none"
    metrics:
      exporter: "none"
    logging:
      level: "INFO"
      exporter: "stdout"
  orchestrator:
    repeats: 1
    max_turns: 20
    auto_start_services: true
    shuffle_trials: false
