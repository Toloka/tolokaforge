# Project spec — the top-level abstraction for this pack.
# See docs/architecture/PROJECTS.md for the full model.

# ── Identity ────────────────────────────────────────────────────
name: "microservices-eval"
version: 1
description: >
  Evaluation suite for microservices refactoring tasks. Nine tasks
  share a base 4-service stack (runner + db-service + postgres +
  backend-api). Tasks demonstrate full inheritance, partial input
  override, full compose override, non-env task overrides, and
  category-tier sharing via _shared/domain.yaml.

# ── Task inventory ──────────────────────────────────────────────
tasks:
  discovery:
    glob: "tasks/**/task.yaml"

# ── Default environment ─────────────────────────────────────────
# Every task inherits this unless it declares its own
# environment_manifest. Task-level environment_manifest deep-merges
# on top per-task.
default_environment:
  compose_file: "./shared/environment.compose.yaml"
  runner_service: "runner"
  inputs:
    postgres_version: "16"
  isolation: "per_trial"
  network_policy: "LOCALHOST_ONLY"
  security_context_defaults:
    user: "toloka"
    group: "toloka"

# ── Task-level defaults ─────────────────────────────────────────
# Every task inherits these unless it (or its category domain.yaml)
# overrides. Deep-typed merge: task fields win over category fields,
# category fields win over project defaults.
task_defaults:
  adapter_type: "native"
  max_turns: 20
  system_prompt: "./shared/system_prompt.md"
  user_simulator:
    mode: "llm"
    persona: "curious engineer"
  policies:
    max_tool_calls_per_turn: 10
  metadata: {}
  adapter_settings: {}
  tools: {}
  grading_defaults:
    combine:
      method: "weighted_average"
      pass_threshold: 0.7
      weights:
        state_checks: 0.5
        llm_judge: 0.5

# Note: `models` (agent, user, judge) do NOT live on the Project.
# The model being evaluated is the invocation's variable and lives
# on the run config. See run_config/dev.yaml, and PROJECTS.md
# "Relationship to the run config" for the boundary rules.

# ── Compute ─────────────────────────────────────────────────────
# Provider selection, resource limits, backend mode, timeouts,
# stuck-heuristics, budget, TypeSense.
compute:
  provider: "local-docker"
  workers: 4
  max_budget_usd: 100.0
  max_requests_per_second: 10.0
  max_attempt_retries: 3
  runtime_mode: "per_trial"
  timeouts:
    trial_seconds: 600
    tool_call_seconds: 60
  stuck_heuristics:
    enabled: true
    max_repeated_tool_calls: 5
    max_idle_turns: 3
  typesense:
    enabled: false
    mode: "disabled"
  # Provider-specific sub-sections live under `compute.<provider>`.
  # kubernetes:
  #   cluster: "prod-cluster"
  #   namespace: "toloka"
  #   resource_class: "gpu-large"
  #   service_account: "toloka-runner"

# ── Storage ─────────────────────────────────────────────────────
storage:
  artifacts:
    type: "local"
    path: "./results"
  logs:
    type: "local"
    path: "./logs"
  queue:
    backend: "sqlite"
    # postgres_dsn: "postgresql://..."

# ── Observability ───────────────────────────────────────────────
observability:
  tracing:
    exporter: "none"
    # endpoint: "http://collector:4317"
  metrics:
    exporter: "none"
    # endpoint: "http://prom:9090"
  logging:
    level: "INFO"
    exporter: "stdout"

# ── Orchestration ───────────────────────────────────────────────
orchestration:
  auto_start_services: true
  continue_prompt: "Continue."
  shuffle_trials: false
  # schedule:
  #   cron: "0 6 * * *"
