# Project spec — the top-level abstraction for this project.
# See docs/PROJECTS.md for the full model.
#
# The Project holds identity, task discovery, and the shared bases
# for tasks (task_defaults) and runs (run_defaults). Per-item
# deltas live in tasks/<name>/task.yaml and run_configs/<name>.yaml.

name: "microservices-eval"
version: 1
description: >
  Evaluation suite for microservices refactoring tasks. Four of
  the five tasks share a base 4-service stack (runner +
  db-service + postgres + backend-api); of those, one overrides a
  single input for a postgres version bump. The fifth ships its
  own compose file for isolation.

# ── Task inventory ──────────────────────────────────────────────
tasks:
  discovery:
    glob: "tasks/**/task.yaml"

# ── Shared assets ───────────────────────────────────────────────
# Named baselines tasks and service recipes reference by name.
assets:
  seeds:
    app_baseline:
      path: "./shared/seeds/app_baseline.sql"
      kind: "sql_dump"             # bound to a service by the reset recipe below
      digest: "sha256:ed1e9ab5ccf4f940d9860885b3b79458acecc562eb0b3e56b811d03c876504bd"

# ── Default environment ─────────────────────────────────────────
# Every task inherits this unless it declares its own
# `environment_manifest`. Task-level environment_manifest deep-
# merges on top per-task.
default_environment:
  # `stack` = the substrate slot: the compose pointer plus
  # everything scoped to that specific file. Replaces atomically.
  stack:
    compose_file: "./shared/environment.compose.yaml"
    runner_service: "runner"
    inputs:
      postgres_version: "16"
  # isolation omitted → defaults to per_trial (ADR-0009): services
  # without an entry below are ephemeral between trials.
  services:
    # Per-service semantics live HERE, in the manifest — the compose
    # file only defines what the services are.
    postgres:
      isolation: "reset"
      reset: { seed: "app_baseline" }   # restore to the named seed between trials
    db-service:
      isolation: "shared"
    backend-api:
      isolation: "shared"
    # runner: no entry → ephemeral (per_trial default)
  network_policy: "no_internet"
  security_context_defaults:
    run_as_user: 1000
    run_as_group: 1000

# ── Task defaults — base for every task ─────────────────────────
# Applied to every task; task.yaml fields deep-merge on top.
# Holds task-shape properties (timeouts, stuck_heuristics) that
# describe how this project's tasks are shaped, not how a
# particular invocation executes.
task_defaults:
  adapter_type: "native"
  max_turns: 20
  system_prompt: "./shared/system_prompt.md"
  actors:
    user:                          # the conventional counterpart actor
      mode: "llm"
      persona: "curious engineer"
      # No backstory here → every task inherits the same user actor.
  policies:
    max_tool_calls_per_turn: 10
  metadata: {}
  adapter_settings: {}
  tools: {}
  grading_defaults:
    combine:
      method: "weighted"           # combiner methods: all | weighted | any
      pass_threshold: 0.8
      weights:
        llm_judge: 1.0             # all five tasks are judge-graded
  timeouts:
    trial_seconds: 600
    tool_call_seconds: 60
  stuck_heuristics:
    enabled: true
    max_repeated_tool_calls: 5

# ── Run defaults — base for every run config ────────────────────
# Applied to every run under run_configs/; a run_configs/<name>.yaml
# file's fields deep-merge on top. This is where compute, storage,
# observability, and orchestrator run knobs shared across most
# invocations live. `models` typically varies per invocation and
# lives in run_configs/*.yaml, but shared model settings (e.g. a
# uniform temperature) can be placed here.
run_defaults:
  compute:
    provider: "local-docker"
    workers: 1
    max_budget_usd: 20.0
    max_requests_per_second: 10.0
    max_attempt_retries: 3
  storage:
    artifacts:
      type: "local"
      path: "./results"
    logs:
      type: "local"
      path: "./logs"
    queue:
      backend: "sqlite"
  observability:
    tracing:
      exporter: "none"
    metrics:
      exporter: "none"
    logging:
      level: "INFO"
      exporter: "stdout"
  orchestrator:
    repeats: 1
    # No max_turns here: the run-level cap is optional and this
    # project doesn't need one — task_defaults.max_turns governs.
    auto_start_services: true
    shuffle_trials: false
