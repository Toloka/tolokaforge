# Category-level shared config. Any task under this category that
# declares `domain: ../../_shared/domain.yaml` in its task.yaml
# deep-merges these fields onto its own — task fields win on
# conflict.
#
# Currently category-mergeable fields:
# - category
# - tools
# - user_simulator
# - system_prompt
#
# Fields not listed above stay task-scoped even when this file
# declares them. Relative paths in this file (system_prompt,
# mcp_server) are resolved from the domain-file directory, so a
# category can bundle its shared assets alongside domain.yaml.

category: "customer_support"

# Shared LLM system instruction for every task in this category.
system_prompt: "./system_prompt.md"

# Shared user-simulator overrides for every task in this category.
# The `mode` and `temperature` come from project.task_defaults;
# only fields declared here override.
user_simulator:
  persona: "frustrated support customer"
  backstory: >
    You are contacting the support team with a real issue about your
    account. You are direct, sometimes short-tempered, and expect
    the agent to fix things without lengthy explanations.

# Shared tool set for every task in this category.
# The Python file at ./mcp_server.py implements the MCP server the
# native adapter loads at runtime.
tools:
  agent:
    enabled: ["read_ticket", "update_ticket", "search_kb", "escalate"]
    mcp_server: "./mcp_server.py"
