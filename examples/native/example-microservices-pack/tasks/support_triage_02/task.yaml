# Task: escalation with an unusually polite persona.
# Same category tier as support_triage_01 — inherits from
# _shared/domain.yaml. But this task's scenario is a formal
# enterprise customer, not the domain's default "frustrated
# support customer" persona. The task overrides user_simulator.persona
# at task level — deep-typed merge keeps everything else in
# user_simulator (mode, backstory) inherited from the domain.
#
# This demonstrates the three-tier merge with a task-level
# override of a nested typed field:
#   project.task_defaults.user_simulator → category domain.yaml's
#   user_simulator → task.yaml's user_simulator.
task_id: "support_triage_02"
description: >
  An enterprise customer reports that their scheduled data export
  didn't run this morning. Determine whether the failure is on their
  side (misconfigured schedule) or ours (job runner incident) and
  respond appropriately.

domain: "../../_shared/domain.yaml"

user_simulator:
  persona: "polite enterprise customer, VP of engineering"
  # `mode` and `backstory` inherit from the domain's user_simulator.
