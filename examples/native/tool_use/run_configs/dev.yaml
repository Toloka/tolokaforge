# Tool-use example — two public tool-use tasks driving the calculator
# and helper tools. Requires a real LLM provider key in .env. Run via
#   scripts/with_env.sh uv run tolokaforge run --config examples/native/tool_use/run_configs/dev.yaml
models:
  agent:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.0
    max_tokens: 4096
  user:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4-6"
    temperature: 0.2

orchestrator:
  workers: 1
  repeats: 1
  max_turns: 8
  queue_backend: sqlite

evaluation:
  projects:
    - "examples/native/tool_use/dataset"
  tasks_glob: "**/task.yaml"
  output_dir: "results/tool_use_example"
