# BYOH concurrency example. Requires OPENAI_API_KEY through SecretManager.
models: {}

agent_harness:
  type: codex
  version: 0.118.0
  flags:
    sandbox_mode: workspace-write
    approval_policy: never
  user_simulator_policy: first_message_only

orchestrator:
  workers: 2
  repeats: 2
  max_turns: 8
  queue_backend: sqlite

evaluation:
  task_packs:
    - "examples/native/tool_use/dataset"
  tasks_glob: "**/task.yaml"
  output_dir: "results/tool_use_byoh_codex"

