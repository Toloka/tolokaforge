# The native coding-harness pack under kimi-code, on the shipped entry's
# default path.
#
# The host needs ``OPENROUTER_API_KEY``, and the CLI sends its requests to
# OpenRouter's v1 endpoint. The entry's request middleware pins every
# ``/chat/completions`` call to first-party ``moonshotai`` serving, so the
# trial does not drift onto a quantized third-party provider. The shipped
# entry declares a ``credential_gateway``, but no runtime in this repo starts
# that sidecar, so the real key sits in the trial container's environment.

models:
  agent:
    provider: "openrouter"
    name: "moonshotai/kimi-k3"
    harness: "kimi-code"
    temperature: 0.0
    max_tokens: 4096

  user:
    provider: "openrouter"
    name: "openrouter/anthropic/claude-sonnet-4.6"
compute:
  workers: 1

storage:
  queue:
    backend: sqlite

orchestrator:
  repeats: 1
  strict_task_load: true
  timeouts:
    episode_s: 900
    turn_s: 240

evaluation:
  projects:
    - "examples/native/coding_harness"
  tasks_glob: "task.yaml"
  output_dir: "results/native-coding-harness-kimi"
  harness_adapter:
    type: "native"
