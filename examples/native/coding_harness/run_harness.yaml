# Native-adapter run config exercising `models.agent.coding_harness` end-to-end.
#
# This is the exemplar of the adapter-agnostic shape the coding-harness lift
# introduces: any task on any adapter declares the CLI right next to the
# model, and the orchestrator's selected CodingHarnessDriver (see
# tolokaforge.core.drivers.coding_harness) replaces the engine's turn loop
# with one invocation of that CLI inside the trial container.
#
# The native adapter stages this task's compose file
# (`NativeAdapter.stage_task`) so the driver has a per-trial container to
# layer the CLI install onto; the adapter itself carries no harness-mode
# state.

models:
  agent:
    provider: "openrouter"
    name: "openrouter/anthropic/claude-sonnet-4-6"
    coding_harness: "claude-code"
    temperature: 0.0
    max_tokens: 4096

compute:
  workers: 1

storage:
  queue:
    backend: sqlite

orchestrator:
  repeats: 1
  strict_task_load: true
  timeouts:
    # The harness runs to completion inside one `docker exec`; the trial has
    # no LLM turn loop to time-slice, so this budget must cover the whole
    # invocation.
    episode_s: 900
    turn_s: 240

evaluation:
  projects:
    - "examples/native/coding_harness"
  tasks_glob: "task.yaml"
  output_dir: "results/native-coding-harness"
  harness_adapter:
    type: "native"
