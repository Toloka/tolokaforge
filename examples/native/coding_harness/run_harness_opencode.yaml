# Same native pack + task as run_harness.yaml — different vendor CLI.
# opencode + anthropic/claude-sonnet-4-6 via the OpenRouter credential shield.

models:
  agent:
    provider: "openrouter"
    # Dash spelling on purpose: this is opencode's own ``anthropic``
    # provider-block catalog slug, and opencode rejects the dotted form
    # with ``ProviderModelNotFoundError``. The pricing table's dash row
    # carries no cache rates, so the run's local cost estimate bills cache
    # reads at the input rate — the orchestrator warns at load_tasks, and
    # ``observability.pricing_overlay_path`` is the way to correct it.
    name: "anthropic/claude-sonnet-4-6"
    harness: "opencode"
    temperature: 0.0
    max_tokens: 4096

  user:
    provider: "openrouter"
    name: "openrouter/anthropic/claude-sonnet-4.6"
    temperature: 0.0
compute:
  workers: 1

storage:
  queue:
    backend: sqlite

orchestrator:
  repeats: 1
  strict_task_load: true
  timeouts:
    episode_s: 900
    turn_s: 240

evaluation:
  projects:
    - "examples/native/coding_harness"
  tasks_glob: "task.yaml"
  output_dir: "results/native-coding-harness-opencode"
  harness_adapter:
    type: "native"
