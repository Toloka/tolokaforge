# The native coding-harness pack under gemini-cli, on the shipped entry's
# default path.
#
# The host needs a real ``GEMINI_API_KEY`` (Google AI Studio or a Vertex SA),
# and the CLI sends its requests to Google's Generative Language API. The
# shipped entry declares a ``credential_gateway``, but no runtime in this repo
# starts that sidecar, so the real key sits in the trial container's
# environment.
#
# A LiteLLM gateway is reached through a ``harness_presets_file`` overlay that
# whole-replaces the entry; keep ``models.agent.harness: gemini-cli`` and add:
#
#   evaluation:
#     harness_adapter:
#       params:
#         harness_presets_file: examples/terminal_bench/gemini_litellm_overlay.yaml
#
# ``gemini_openrouter_overlay.yaml`` is the sibling for a LiteLLM that answers
# from OpenRouter.

models:
  agent:
    provider: "openrouter"
    name: "google/gemini-2.5-flash"
    harness: "gemini-cli"
    temperature: 0.0
    max_tokens: 4096

  user:
    provider: "openrouter"
    name: "openrouter/anthropic/claude-sonnet-4.6"
compute:
  workers: 1

storage:
  queue:
    backend: sqlite

orchestrator:
  repeats: 1
  strict_task_load: true
  timeouts:
    episode_s: 900
    turn_s: 240

evaluation:
  projects:
    - "examples/native/coding_harness"
  tasks_glob: "task.yaml"
  output_dir: "results/native-coding-harness-gemini"
  harness_adapter:
    type: "native"
