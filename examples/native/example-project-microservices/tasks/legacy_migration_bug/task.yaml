# Task: fix a bug in a legacy service that uses MySQL, not postgres.
#
# RECIPE PATTERN: **Full escape hatch.** This task's environment
# genuinely doesn't fit the project — the legacy service predates the
# microservices stack and uses MySQL + PHP. Rather than force the
# recipe grammar to accommodate two DB engines, the task declares its
# own `environment_manifest` block in task.yaml. The loader sees the
# task-level manifest and BYPASSES the project inheritance entirely
# for this task.
#
# This is the backward-compat path — any task under a project can opt
# out by declaring its own environment_manifest, exactly as today.

task_id: "legacy_migration_bug"
name: "Fix stale-session bug in the legacy dashboard"
category: "microservices"
description: >
  The legacy PHP dashboard (external to the microservices stack) has
  a stale-session bug — logged-in users get logged out after 60s.
  Root-cause and fix. Test via curl against the legacy service on
  port 8000.
max_turns: 20

initial_user_message: |
  The legacy dashboard runs at http://legacy-dashboard:8000. Login
  as `demo / demo`, then wait ~90 seconds and observe the session
  invalidation. Fix so sessions live for the configured 30 minutes.

adapter_type: "native"

# ── Escape hatch ────────────────────────────────────────────────
# By declaring environment_manifest.compose_file here at task level,
# the loader ignores ../../project.yaml for THIS task. The task ships
# a full self-contained compose.
environment_manifest:
  compose_file: "./environment.compose.yaml"
  runner_service: "runner"
  isolation: "per_trial"

initial_state:
  filesystem: {}

tools:
  agent:
    enabled: ["bash", "write_file", "read_file"]
  user:
    enabled: []

user_simulator:
  mode: llm
  persona: cooperative
  backstory: >
    You are the legacy-team engineer. End with ###STOP### once the
    session lasts the configured 30 minutes without invalidation.

grading: "grading.yaml"
