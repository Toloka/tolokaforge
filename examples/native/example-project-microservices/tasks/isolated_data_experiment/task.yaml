# Task: A/B experiment that adds test rows to an isolated DB.
#
# RECIPE PATTERN: **Full service replacement.** This task needs a
# postgres instance the other tasks cannot see — it inserts synthetic
# customer data + measures how the backend responds under a specific
# data shape. If it used the shared app-db, the synthetic rows would
# contaminate other tasks' grading.
#
# The recipe (see recipe.yaml) replaces `app-db` with a task-owned
# postgres. The rest of the project stack — runner, db-service,
# backend-api, frontend, queue — stays shared. Backend-api's
# DATABASE_URL gets rebound at recipe-apply time to the task's DB.

task_id: "isolated_data_experiment"
name: "A/B experiment — synthetic customer cohort"
category: "microservices"
description: >
  Seed the DB with 100 synthetic customers matching a specific
  demographic distribution. Query backend-api's `/api/segments` and
  verify it correctly classifies the cohort. Do not affect other
  tasks' data.
max_turns: 20

initial_user_message: |
  Load `/repo/experiments/cohort-A.sql` into the DB, then hit
  http://backend-api:8080/api/segments and confirm the response
  bucketizes the 100 customers into the expected segments (verify
  against `/repo/experiments/cohort-A.expected.json`).

adapter_type: "native"

initial_state:
  filesystem: {}

tools:
  agent:
    enabled: ["bash", "write_file", "read_file"]
  user:
    enabled: []

user_simulator:
  mode: llm
  persona: cooperative
  backstory: >
    You are the data scientist running the experiment. End with
    ###STOP### once the segments response matches the expected file.

grading: "grading.yaml"
