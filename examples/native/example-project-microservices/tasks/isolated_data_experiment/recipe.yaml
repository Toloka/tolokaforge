# Task recipe — full service replacement for app-db.
#
# The project's app-db is `shared` (read-only for the rest of the
# tasks). This experiment mutates the DB with synthetic data that
# must not leak into other tasks. The cleanest expression is: give
# this task its own postgres, ephemeral per trial.
#
# NOTE the design principle from PROJECT_MANIFEST_EXTENSION_PROPOSAL.md
# §3: isolation-via-replacement > isolation-via-patch. We don't try
# to override individual fields on the project's app-db — we replace
# the whole service definition. Reader sees exactly what runs.

services:
  # Full replacement — the entire service spec is redeclared here,
  # overriding the project's `services.app-db` block.
  app-db:
    image: "postgres:16"
    isolation: ephemeral        # fresh container per trial
    environment:
      POSTGRES_USER: "experiment"
      POSTGRES_PASSWORD: "seed"
      POSTGRES_DB: "experiment_db"
    volumes:
      # Task-local seed data; independent from the project's db-init.
      - "./seed/:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment -d experiment_db"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

# When backend-api runs, its DATABASE_URL in the merged compose is
# rewritten to point at THIS task-local app-db, not the project's.
# The rewrite is automatic — the recipe replaces the service by
# name, and the loader re-resolves DNS bindings.
