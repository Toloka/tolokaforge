# Grader — checks the migration ran and existing rows survived.

state:
  assertions:
    - path: "$.db.schema.tickets.columns[?(@.name=='priority')].type"
      op: eq
      value: "integer"
    - path: "$.db.tables.tickets[0].priority"
      op: exists
    - path: "$.db.tables.tickets.row_count"
      op: gte
      value: 1
