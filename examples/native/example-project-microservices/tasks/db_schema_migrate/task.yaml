# Task: run a DB migration that adds a column to the orders table.
#
# RECIPE PATTERN: **Isolation modifier.** The task mutates the DB
# schema — if two trials of this task share the same `app-db`, the
# second trial will fail because the migration already ran. The
# recipe (see recipe.yaml) flips `app-db` from `shared` to `reset`
# so the runtime uses the postgres template-DB clone primitive
# between trials.
#
# Everything else in the project stays shared.

task_id: "db_schema_migrate"
name: "Add order_priority column to tickets"
category: "microservices"
description: >
  Add a new column `priority: int` (default 3, range 1-5) to the
  `tickets` table via a migration. Update the API to accept the new
  field on POST. Do NOT lose existing rows.
max_turns: 16

initial_user_message: |
  We need `priority` on tickets — an integer 1-5, default 3. Write
  a migration (alembic file under `/repo/backend/migrations/`),
  apply it against app-db, then update POST /api/tickets to accept
  the field. Existing rows should keep their data and get priority 3.

adapter_type: "native"

initial_state:
  filesystem: {}

tools:
  agent:
    enabled: ["bash", "write_file", "read_file"]
  user:
    enabled: []

user_simulator:
  mode: llm
  persona: cooperative
  backstory: >
    You are the DBA who requested the schema change. Confirm the
    migration ran and the column exists via a bash `psql` check.
    End with ###STOP### when verified.

grading: "grading.yaml"
