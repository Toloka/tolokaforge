# Grader — verifies the alert is defined + fires on a synthetic spike.

state:
  assertions:
    - path: "$.grafana.alerts[?(@.name=='backend-api p95 latency')].for"
      op: eq
      value: "5m"
    - path: "$.grafana.alerts[?(@.name=='backend-api p95 latency')].state"
      op: in
      value: ["firing", "pending"]
