# Base environment for the project — 6 services shared across every
# task under this project unless a task recipe overrides them.
#
# NOTE: spec-only illustration. The current loader treats compose
# files as static; the ${...} substitutions here are bound at load
# time from the project inputs. See ../project.yaml for the input
# declarations.

services:
  # ── Engine services (would come from :local alias in a real run) ──
  runner:
    image: "tolokaforge-runner:local"
    environment:
      DB_SERVICE_URL: "http://db-service:8000"
    ports:
      - "50051"
    depends_on:
      db-service:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  db-service:
    image: "tolokaforge-db-service:local"
    ports:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # ── Task-specific application services ──
  app-db:
    # ${postgres_version} is bound from project.yaml inputs at load time.
    image: "postgres:${postgres_version}"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "example"
      POSTGRES_DB: "app"
    volumes:
      - "./environment/db-init/:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend-api:
    image: "myrepo/example-backend:v1.4.0"       # pinned; never `latest`
    environment:
      DATABASE_URL: "postgresql://postgres:example@app-db/app"
      REDIS_URL: "redis://queue:6379/0"
    ports:
      - "8080"
    depends_on:
      app-db:
        condition: service_healthy
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  frontend:
    image: "nginx:1.27-alpine"
    ports:
      - "80"
    volumes:
      - "./environment/frontend-dist/:/usr/share/nginx/html:ro"
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/index.html"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  queue:
    image: "redis:7.4-alpine"
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
