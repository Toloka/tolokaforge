# What this pack's lot correlation is a candidate to replace, declared machine-readably
# so `tolokaforge validate` checks the claim against the rubric that still holds it and
# `tolokaforge reconcile` decides it against recorded judge verdicts. Nothing about grading
# reads this file, and a candidate retires nothing: `names_lot` still scores and still vetoes.
#
# The evidence is in and it REFUSES this candidacy. Over
# `tests/data/migration_corpora/lot_ops_names_lot/` — ten trials across two agent models —
# the judge found `names_lot` met on every one and the correlation below failed on every one,
# because no trial ever read the lot: the user's message supplies `lot_id 7` and the guidance
# asks only for the reason-code catalog, so a compliant agent has no reason to GET it. That is
# a strict disagreement, which no mode tolerates. The declaration stays because a candidate
# converts nothing and gates nothing — this is the claim under test, and the corpus is what a
# decision about it now has to answer to. See docs/RUBRIC_MIGRATION.md § The committed corpora.
#
# Two things a retirement here would have to answer for, and this pack answers neither yet.
# `names_lot` is `required: true` — a trial-level veto carrying no score share — so a
# constraint replacing it has to hold whichever route the agent took and has to fail the
# trial, and the correlation named below is scored: the veto rule refuses the conversion
# at load until that changes. And the criterion accepts either `LOT-1007` or `lot 7`, where
# a binding is one exact value, so what the correlation reaches is the report's grounding in
# the lot the agent worked on rather than how the report words it.
#
# `the_reason_code_posted_was_read_from_the_catalog` is deliberately NOT in `by`, though it is
# the pack's other correlation. `by` is a conjunction — every constraint it names must pass for
# the recomputed label to be met — and the reason code is a different proposition from the lot:
# a trial that grounded the lot correctly and got the reason code wrong would count as
# counter-evidence against a claim about the lot. It remains a candidate for nothing currently
# declared, which is the honest state: no rubric criterion in this pack is about the code.
migrations:
  - criterion: names_lot
    mode: candidate
    by:
      - the_lot_was_read_before_the_action_was_opened
    was:
      kind: binary
      required: true
      weight: 1.0
      description: >
        The report identifies the affected lot (LOT-1007 or lot 7).
