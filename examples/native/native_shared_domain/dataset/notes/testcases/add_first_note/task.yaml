task_id: "notes_add_first_note"
name: "Notes — save the first reminder"
description: >
  Agent must save the user's reminder as a new note via ``add_note``.
domain: ../../_shared/domain.yaml
max_turns: 6

initial_user_message: >
  Please save a note titled "Stand-up" with the body
  "Daily stand-up moved to 10:30 starting Monday."

initial_state:
  json_db: "initial_state.json"

user_simulator:
  backstory: >
    You asked the assistant to save a meeting-time reminder. Once it confirms
    the note is saved, thank it briefly and stop the conversation.

grading: "grading.yaml"
