# Transcript-only rubric: this example leans on
# transcript_rules.required_actions to verify the agent called the right tool.
# Grading can also read the MCP server's state — the runner syncs the DB mirror
# from the server before every grading read — so a real task would add
# state_checks.jsonpaths or state_checks.hash + golden_actions.
combine:
  method: weighted
  weights:
    transcript_rules: 1.0
  pass_threshold: 0.75

transcript_rules:
  max_turns: 6
  required_actions:
    - action_id: "save_note"
      requestor: assistant
      name: add_note
      arguments: {}
      compare_args: []
  communicate_info:
    - info: "Stand-up"
      required: true
