# What this pack's two grounded-claim checks are candidates to replace, declared
# machine-readably so `tolokaforge validate` checks the claim against the rubric that still
# holds it and `tolokaforge reconcile` can decide it once recorded judge verdicts for this
# pack exist (#793). Nothing about grading reads this file, and a candidate retires nothing:
# `explains_mechanism` still carries its full weight.
#
# Two things a retirement here would have to answer for, and this pack answers neither yet.
# `explains_mechanism` is `kind: graded`, so its weight sits in the judge component's
# denominator and dropping it raises the component on a trial that scored it badly —
# measured at `+0.667` on a trial that scored it `0.0` — which the freed-share rule refuses
# at load unless the entry declares the post-migration weight map the freed share lands in.
# And the two checks reach only the half of the criterion asking the note to be grounded in
# the divergence the agent observed, not the causal account of why the write leaves the
# cache stale, which no exact or textual check expresses.
migrations:
  - criterion: explains_mechanism
    mode: candidate
    by:
      - the_note_quotes_the_value_the_served_read_returned
      - the_note_quotes_the_value_the_cache_held
    was:
      kind: graded
      required: false
      weight: 1.0
      description: >
        Explains that the write updates the database but does not invalidate the cached
        order key, so cache-first reads serve the stale value.
