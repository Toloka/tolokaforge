# Three-way weighted grading for cache_debug.
#
#   llm_judge    (0.5) — the primary signal, and deliberately the dominant one.
#     The diagnosis is a natural-language note; the judge scores whether it
#     identifies the stale-cache / missing-invalidation bug, explains the
#     mechanism, and avoids a false fix. The two routes below are not equally
#     probative — the cache inspector shows the stale value itself, while the
#     served-vs-source comparison shows only that the read path serves something
#     the database disagrees with — so the deterministic components must not be
#     able to carry a weak diagnosis. At 0.25 each they sum to 0.5, below the
#     threshold: no trial passes on process alone.
#   state_checks (0.25) — a deterministic floor: the written note names the
#     cache-invalidation concept (substring `invalidat`).
#   trace_checks (0.25) — the diagnostic process: one of the two comparisons the
#     rubric reference names, walked before the note was written, and no status
#     update written on a diagnose-only task.
#
# A correct diagnosis is not sunk by the route it took: judge 0.5 + note 0.25
# already exceeds the 0.6 threshold whichever comparison the agent chose.
combine:
  method: weighted
  weights: { state_checks: 0.25, trace_checks: 0.25, llm_judge: 0.5 }
  pass_threshold: 0.6
state_checks:
  jsonpaths:
    - path_glob: "/env/fs/agent-visible/submissions/*"
      contains_ci: "invalidat"
      description: "root-cause note names cache invalidation"
# Two genuinely alternative diagnostic routes, each scored as a whole. The rubric
# reference names both comparisons as locating the bug, and the task's guidance
# asks the agent to compare the layers without preferring a pair, so an agent that
# completes either route has derived the divergence and scores the same.
#
# An agent that starts down both and completes neither — the served read plus a
# key listing, say — has observed no divergence at all, and scores the better of
# two incomplete routes rather than the sum of two halves.
#
# Each route asks two independent questions: were both sides of the comparison
# read, and did the reads that happened happen before the note. The second carries
# `on_missing: pass` so a read that never happened is charged once, to the first
# question, rather than twice.
#
# The gate is SHARED rather than written inside a route: "do not mutate the order
# on a diagnose-only task" holds whatever route the agent took, and a gate inside a
# path is consulted only when that path wins.
trace_checks:
  constraints:
    - id: no_status_was_written
      description: "no status update is posted: the task is to diagnose the staleness, not to paper over it"
      severity: gate
      require:
        absent:
          match:
            kind: tool_call
            tool: { equals: http_request }
            args:
              url: { equals: "http://orders-api:8000/orders/4021" }
              method: { equals: "POST" }
    - id: the_note_was_written
      description: "a root-cause note is written, whichever route located the bug"
      require:
        present:
          match:
            kind: tool_call
            tool: { equals: write_file }
  alternatives:
    - id: divergence_between_the_api_layers
      description: "the bug is located by comparing the customer-facing read against the source of truth"
      constraints:
        - id: both_api_layer_reads_happened
          description: "the agent read order 4021 both as customers see it and as the source of truth records it"
          require:
            all_of:
              - present:
                  match:
                    kind: tool_call
                    tool: { equals: http_request }
                    args:
                      url: { equals: "http://orders-api:8000/orders/4021" }
                      method: { equals: "GET" }
              - present:
                  match:
                    kind: tool_call
                    tool: { equals: http_request }
                    args:
                      url: { equals: "http://orders-api:8000/orders/4021/source" }
                      method: { equals: "GET" }
        - id: both_api_layer_reads_precede_the_note
          description: "each read that happened happened before the note, so the diagnosis follows from the divergence rather than preceding it"
          on_missing: pass
          require:
            all_of:
              - before:
                  left:
                    quantifier: first
                    match:
                      kind: tool_call
                      tool: { equals: http_request }
                      args:
                        url: { equals: "http://orders-api:8000/orders/4021" }
                        method: { equals: "GET" }
                  right:
                    quantifier: first
                    match:
                      kind: tool_call
                      tool: { equals: write_file }
              - before:
                  left:
                    quantifier: first
                    match:
                      kind: tool_call
                      tool: { equals: http_request }
                      args:
                        url: { equals: "http://orders-api:8000/orders/4021/source" }
                        method: { equals: "GET" }
                  right:
                    quantifier: first
                    match:
                      kind: tool_call
                      tool: { equals: write_file }
    - id: divergence_against_the_cache
      description: "the bug is located by reading the cached value and comparing it against either orders-api read"
      constraints:
        - id: the_cached_value_and_an_api_read_happened
          description: "the agent read the cached order:4021 entry and read the order over the orders API too"
          require:
            all_of:
              - present:
                  match:
                    kind: tool_call
                    tool: { equals: http_request }
                    args:
                      url: { equals: "http://cache-admin:8000/cache/order:4021" }
                      method: { equals: "GET" }
              - any_of:
                  - present:
                      match:
                        kind: tool_call
                        tool: { equals: http_request }
                        args:
                          url: { equals: "http://orders-api:8000/orders/4021" }
                          method: { equals: "GET" }
                  - present:
                      match:
                        kind: tool_call
                        tool: { equals: http_request }
                        args:
                          url: { equals: "http://orders-api:8000/orders/4021/source" }
                          method: { equals: "GET" }
        - id: the_cache_comparison_precedes_the_note
          description: "each side of the comparison that was read was read before the note, so the diagnosis follows from the divergence"
          on_missing: pass
          require:
            all_of:
              - before:
                  left:
                    quantifier: first
                    match:
                      kind: tool_call
                      tool: { equals: http_request }
                      args:
                        url: { equals: "http://cache-admin:8000/cache/order:4021" }
                        method: { equals: "GET" }
                  right:
                    quantifier: first
                    match:
                      kind: tool_call
                      tool: { equals: write_file }
              - any_of:
                  - before:
                      left:
                        quantifier: first
                        match:
                          kind: tool_call
                          tool: { equals: http_request }
                          args:
                            url: { equals: "http://orders-api:8000/orders/4021" }
                            method: { equals: "GET" }
                      right:
                        quantifier: first
                        match:
                          kind: tool_call
                          tool: { equals: write_file }
                  - before:
                      left:
                        quantifier: first
                        match:
                          kind: tool_call
                          tool: { equals: http_request }
                          args:
                            url: { equals: "http://orders-api:8000/orders/4021/source" }
                            method: { equals: "GET" }
                      right:
                        quantifier: first
                        match:
                          kind: tool_call
                          tool: { equals: write_file }
llm_judge:
  rubric:
    reference: |
      The root cause is a cache-invalidation bug. The orders API is cache-first:
      GET /orders/4021 returns the cached value when the key order:4021 exists.
      A status update writes postgres but never invalidates (deletes/refreshes)
      the cached order:4021 key, so the cache holds a stale value ("processing")
      while postgres holds the fresh truth ("shipped"), and the customer-facing
      read keeps serving the stale cached value. GET /orders/4021/source reads
      postgres directly and shows the fresh value; the cache inspector shows the
      stale cached value — the divergence between the two locates the bug. A good
      note names the stale cache / missing invalidation and explains this
      mechanism, and does not attribute the fault to an unrelated cause.
    criteria:
      - { id: identifies_bug, description: "Names the root cause as a stale cache / missing cache invalidation, not a database or generic bug.", kind: binary, required: true, weight: 1.0 }
      - { id: explains_mechanism, description: "Explains that the write updates the database but does not invalidate the cached order key, so cache-first reads serve the stale value.", kind: graded, weight: 1.0 }
      - { id: no_false_fix, description: "Does not attribute the fault to an unrelated cause (e.g. a database write failure, a network issue, or bad seed data).", kind: graded, weight: 0.5 }
