# Project spec for the comparison-view reference pack.
#
# One task graded by a golden replay whose state hash reads both sides through a
# `state_checks.comparison_view`: the records that do not count are dropped and the
# generated document ids are re-keyed by content, together with the corrections
# citing them. No Docker substrate: an in-process MCP server backs the tools and
# the state lives in `initial_state.json_db`.

name: "comparison-view-documents"
version: 1
description: >
  Comparison-view reference: file a client's invoice and a correction against it.
  A trajectory that also drafts and supersedes a document, places and releases a
  hold, or looks records up grades like the golden path; one whose correction
  cites the wrong document does not.

tasks:
  discovery:
    glob: "dataset/tasks/**/task.yaml"

# ── Task defaults — base for every task ─────────────────────────
task_defaults:
  adapter_type: "native"
  max_turns: 10
  actors:
    user:
      mode: "llm"
      persona: "cooperative"
