# Comparison-view reference pack — file an invoice and a correction against it.
# Requires a real LLM provider key in .env. Run via
#   scripts/with_env.sh uv run tolokaforge run --config examples/native/comparison_view/run_config.yaml
models:
  agent:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4.6"
    temperature: 0.0
    max_tokens: 4096
  user:
    provider: "openrouter"
    name: "anthropic/claude-sonnet-4.6"

orchestrator:
  workers: 1
  repeats: 1
  max_turns: 10
  queue_backend: sqlite

evaluation:
  projects:
    - "examples/native/comparison_view/dataset"
  tasks_glob: "**/task.yaml"
  output_dir: "results/comparison_view_example"
