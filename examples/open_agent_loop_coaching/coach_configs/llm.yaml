# LLM coach — an analyzer LLM decides when the agent is stuck, and a
# separate LLM drafts a specific hint. Per-trial cost is capped by
# `budget_usd`; hitting it silently falls back to a no-suggestion path.
participant_id: "workflow-reviewer-llm"
role: "participant"

detector:
  type: "llm"
  params:
    window_events: 20
    fire_only_on_assistant: true

intervener:
  type: "llm_suggest"
  params:
    window_events: 20
    max_words: 60

cooldown_turns: 1
budget_usd: 0.20
