# Run a Harbor leg and a Terminal-Bench leg in one run (multi-harness dispatch).
#
# The `harnesses:` block dispatches one adapter per entry: each leg pulls its
# own tasks through its own adapter and is graded by that adapter's contract.
# Here a Harbor task and a Terminal-Bench task run side by side under the engine
# loop — the cross-adapter dispatch, with each leg keeping its own task pack and
# params. `harnesses` is mutually exclusive with `evaluation.harness_adapter`.

models:
  agent:
    provider: "anthropic"
    name: "claude-sonnet-4.6"
    temperature: 0.0
    max_tokens: 4096
  user:
    provider: "anthropic"
    name: "claude-sonnet-4.6"

compute:
  workers: 1

storage:
  queue:
    backend: sqlite

orchestrator:
  repeats: 1
  max_turns: 40
  strict_task_load: true

evaluation:
  output_dir: "results/harbor/multi"

harnesses:
  entries:
    - name: "harbor"
      adapter: "harbor"
      task_ids: ["write-release-note"]
      params:
        harbor_tasks_dir: "examples/harbor"
        task_ids: ["write-release-note"]
    - name: "terminal_bench"
      adapter: "terminal_bench"
      task_ids: ["fix-billing-holds"]
      params:
        terminal_bench_dir: "examples/terminal_bench"
        task_ids: ["fix-billing-holds"]
