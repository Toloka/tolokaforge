# Run one Harbor (Terminal-Bench 2.0) task on tolokaforge's runner.
#
# Harbor tasks are Terminal-Bench 2.0 tasks (task.toml + environment/ +
# tests/test.sh writing /logs/verifier/reward.txt). This config runs the
# vendored write-release-note task under the engine loop and grades the pack's
# own reward via test_execution. Dataset download is a manual pre-step; point
# harbor_tasks_dir at a directory of task folders you have on disk.

models:
  agent:
    provider: "anthropic"
    name: "claude-sonnet-4.6"
    temperature: 0.0
    max_tokens: 4096
  user:
    provider: "anthropic"
    name: "claude-sonnet-4.6"

orchestrator:
  workers: 1
  repeats: 1
  max_turns: 40
  queue_backend: sqlite
  # A Harbor task's environment is synthesised from its task files; a failed
  # task load is a config error the operator must see, not a task silently
  # dropped from the run.
  strict_task_load: true

evaluation:
  task_packs:
    - "examples/harbor"
  tasks_glob: "write-release-note/task.toml"
  output_dir: "results/harbor/write-release-note"
  harness_adapter:
    type: "harbor"
    params:
      harbor_tasks_dir: "examples/harbor"
      task_ids: ["write-release-note"]
