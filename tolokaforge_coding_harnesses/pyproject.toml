[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tolokaforge-coding-harnesses"
version = "0.1.0"
description = "Coding-harness CLI registry, installer and middleware proxy for tolokaforge harness trials."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Renaud de la Gueronniere"},
    {name = "Tolokaforge Contributors"},
]
keywords = ["llm", "benchmark", "coding-agent", "terminal-bench"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No ``tolokaforge`` entry, and none is coming: nothing in this package imports
# the engine, which is what lets any runtime — the terminal-bench adapter, a
# second adapter, a runner-side consumer — read the same registry data without
# inheriting an engine version pin. ``tests/unit/test_package_boundary.py``
# holds that line. The three entries below are what the registry loader, the
# ``config_files`` renderer and the spec models actually import.
dependencies = [
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tolokaforge_coding_harnesses"]
