# Pre-commit hooks for code quality
# Install: uv sync --dev && uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

# Exclude contrib/ (external libraries), tests/data/projects/ (LFS files), and
# examples/terminal_bench/ (upstream task code with intentional bugs) from all hooks
exclude: ^(contrib/|tests/data/projects/|examples/terminal_bench/)

repos:
  # Ruff (linting only, not formatting) and black run from the uv.lock dev
  # environment: a hook repo would have pre-commit pip-install them and their
  # dependencies from live PyPI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude --fix --config pyproject.toml
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: black
        name: black
        entry: uv run black --config pyproject.toml
        language: system
        types_or: [python, pyi]
        require_serial: true

  # actionlint - GitHub Actions workflow linter. The only automated pre-merge
  # gate on workflow YAML/expression correctness (publish-images.yml's real push
  # path first fires post-merge on a tag).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # import-linter — plug-in seam boundary enforcement (ADR-0038). Runs
  # against the whole tolokaforge package (not per-file) so it needs
  # pass_filenames=false + always_run=true. Uses the same import-linter
  # version pinned in [dependency-groups].dev via the local uv env.
  - repo: local
    hooks:
      - id: import-linter
        name: Import-boundary contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      # Image and CI installs run under tolokaforge/docker/image-constraints.txt,
      # the lock exported as pip constraints; this hook is its only generator.
      # tests/canonical/test_image_constraints_match_lock.py checks it against uv.lock.
      - id: image-constraints
        name: Export uv.lock to image constraints
        entry: uv --quiet export --format requirements.txt --frozen --all-packages --all-extras --all-groups --no-emit-workspace --no-hashes --no-annotate -o tolokaforge/docker/image-constraints.txt
        language: system
        files: ^uv\.lock$
        pass_filenames: false
