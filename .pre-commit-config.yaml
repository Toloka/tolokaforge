# Pre-commit hooks for code quality
# Install: uv sync --dev && uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

# Exclude contrib/ (external libraries), tests/data/projects/ (LFS files), and
# examples/terminal_bench/ (upstream task code with intentional bugs) from all hooks
exclude: ^(contrib/|tests/data/projects/|examples/terminal_bench/)

repos:
  # Ruff - Fast Python linter (linting only, not formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4  # Must match pyproject.toml [project.optional-dependencies.dev]
    hooks:
      - id: ruff
        args: [--fix, --config, pyproject.toml]

  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 26.3.1  # Must match pyproject.toml [project.optional-dependencies.dev]
    hooks:
      - id: black
        args: [--config, pyproject.toml]

  # actionlint - GitHub Actions workflow linter. The only automated pre-merge
  # gate on workflow YAML/expression correctness (publish-images.yml's real push
  # path first fires post-merge on a tag).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # import-linter — plug-in seam boundary enforcement (ADR-0038). Runs
  # against the whole tolokaforge package (not per-file) so it needs
  # pass_filenames=false + always_run=true. Uses the same import-linter
  # version pinned in [dependency-groups].dev via the local uv env.
  - repo: local
    hooks:
      - id: import-linter
        name: Import-boundary contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      # No JFrog URLs in a committed uv.lock — Toloka Macs whose personal
      # `~/.config/uv/uv.toml` points at the internal JFrog mirror can
      # accidentally regenerate a lock full of `toloka.jfrog.io` URLs and
      # commit them into this public repo (would break external contributors
      # / arena runners / CI). See the hook script for the rationale + the
      # regenerate-in-a-clean-env recovery command.
      - id: no-jfrog-in-lock
        name: No JFrog URLs in a committed uv.lock
        entry: scripts/pre-commit-check-no-jfrog-in-lock.sh
        language: system
        files: (^|/)uv\.lock$
