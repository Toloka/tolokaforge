# Pre-commit hooks for code quality
# Install: uv sync --dev && uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

# Exclude contrib/ (external libraries), tests/data/projects/ (LFS files), and
# examples/terminal_bench/ (upstream task code with intentional bugs) from all hooks
exclude: ^(contrib/|tests/data/projects/|examples/terminal_bench/)

repos:
  # Ruff - Fast Python linter (linting only, not formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4  # Must match pyproject.toml [project.optional-dependencies.dev]
    hooks:
      - id: ruff
        args: [--fix, --config, pyproject.toml]

  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 25.11.0  # Must match pyproject.toml [project.optional-dependencies.dev]
    hooks:
      - id: black
        args: [--config, pyproject.toml]

  # actionlint - GitHub Actions workflow linter. The only automated pre-merge
  # gate on workflow YAML/expression correctness (publish-images.yml's real push
  # path first fires post-merge on a tag).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
