name: Release Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned (not "latest") so CI resolves the lockfile with the SAME uv that
          # generated it. With `uv sync --locked`, a "latest" uv that ever changes
          # lock resolution/format would fail CI repo-wide on its release day, for
          # nobody's change. Bump this deliberately alongside a relock. Must stay
          # within [tool.uv] required-version in pyproject.toml.
          version: "0.9.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python (pinned in .python-version)
        run: uv python install "$(cat .python-version)"


      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Install Playwright browsers
        run: |
          uv run python -m playwright install chromium

      - name: Create .env file
        run: |
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_TESTING_TOKEN }}" > .env

      - name: Lint
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure

      - name: Validate public example suites
        run: |
          uv run tolokaforge validate --tasks "examples/native/*/dataset/**/task.yaml"


      - name: Docker task-pack mount smoke
        run: |
          scripts/tests/task_pack_docker_smoke.sh

      - name: Run unit + canonical tests
        run: |
          uv run pytest -m "unit or canonical" -v --tb=short

      - name: Build Docker images for integration tests
        run: |
          uv run tolokaforge docker build

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ -v --tb=short
