name: Model auto-integration (resolve)

# Second stage of the model auto-integration pipeline. After a CLEAN observe run
# (the observe workflow adds the `automation:resolve` label), a DETERMINISTIC loop
# drives the fix: each iteration a SHORT Claude Code agent (Opus) reads the findings
# and composes/refines the candidate's policy (a reusable-axis preset overlay, or a
# new small adapter class it writes into the engine), then the WORKFLOW runs the
# reprobe and checks the fix-targets. The agent only reasons + writes files; the
# workflow owns reprobe, the loop, and the commit. On convergence a final Opus agent
# folds the policy into the bundled preset + writes the cert, and the workflow commits
# to THIS PR branch and reports. It NEVER merges.
#
# Auth split: the AGENT (Claude) runs on ANTHROPIC_API_KEY; the CANDIDATE model that
# reprobe drives runs on ARENA_AUTOMATION_OPENROUTER_API_KEY (.env).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: resolve-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event.label.name == 'automation:resolve'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      MAX_ITER: ${{ vars.RESOLVE_MAX_ITER || '3' }}
      AGENT_MODEL: ${{ vars.RESOLVE_AGENT_MODEL || 'claude-opus-4-8' }}
      # Per-iteration agent turn budget. A code-CREATE fix (writing a new adapter class) is
      # turn-hungry, so this has headroom; an agent that still exhausts it degrades to the
      # no-overlay path (needs-human), it does not hard-fail the run.
      RESOLVE_MAX_TURNS: ${{ vars.RESOLVE_MAX_TURNS || '80' }}
      # Reprobe repeat counts (repo Actions variables; workflow-level config).
      # CAPABILITY_K drives the cheap per-iteration capability reprobe (kept low for a
      # fast inner loop). WIRE_K is reserved for the final wire-verification pass on the
      # fixable wire tasks (not yet wired; the inner loop is --skip-wire).
      RESOLVE_CAPABILITY_K: ${{ vars.RESOLVE_CAPABILITY_K || '5' }}
      RESOLVE_WIRE_K: ${{ vars.RESOLVE_WIRE_K || '10' }}
      # Flat (probe x rep) reprobe width. The candidate key does not rotate, so this is
      # bounded by the OpenRouter rate limit (~10-16 safe); higher risks 429s that erase
      # the gain. Must be >= RESOLVE_CAPABILITY_K to fully overlap one probe's reps.
      RESOLVE_CAP_PARALLEL: ${{ vars.RESOLVE_CAP_PARALLEL || '10' }}
    steps:
      - name: Reject fork PRs
        if: env.IS_FORK == 'true'
        run: |
          gh pr edit "$PR" -R "$REPO" --remove-label 'automation:resolve' \
            --add-label 'automation:integrate-needs-human'
          echo "::error::Fork PR - refusing to run with secrets."
          exit 1

      - name: Label-once guard
        run: |
          gh pr edit "$PR" -R "$REPO" --remove-label 'automation:resolve' \
            --add-label 'automation:resolve-running'

      - name: Parse candidate model from PR title
        id: parse
        run: |
          set -euo pipefail
          if [[ "$PR_TITLE" =~ ^integrate:[[:space:]]+([^[:space:]]+)[[:space:]]*$ ]]; then
            NAME="${BASH_REMATCH[1]}"
          else
            gh pr edit "$PR" -R "$REPO" --remove-label 'automation:resolve-running' \
              --add-label 'automation:integrate-needs-human'
            echo "::error::PR title does not match 'integrate: <slug>'."; exit 1
          fi
          { echo "provider=openrouter"; echo "name=$NAME"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          lfs: true

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --dev --locked

      - name: Create .env (candidate model runs on the pipeline key)
        env:
          ARENA_KEY: ${{ secrets.ARENA_AUTOMATION_OPENROUTER_API_KEY }}
        run: printf '%s\n' "OPENROUTER_API_KEY=$ARENA_KEY" > .env

      - name: Resolve candidate model_id slug
        id: slug
        env:
          TF_PROVIDER: ${{ steps.parse.outputs.provider }}
          TF_NAME: ${{ steps.parse.outputs.name }}
        run: |
          set -euo pipefail
          MODEL_ID="$(uv run python -c 'import os; from tolokaforge.core.output.artifacts import model_id_slug; print(model_id_slug(os.environ["TF_PROVIDER"], os.environ["TF_NAME"]))')"
          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"

      - name: Download the observe artifact
        run: |
          gh run download -R "$REPO" -n "integration-observation-pr${PR}" -D observation
          test -f observation/findings.json || { echo "::error::no findings.json"; exit 1; }
          mkdir -p observation/resolve

      - name: Configure git identity
        run: |
          git config user.name "tolokaforge-automation[bot]"
          git config user.email "automation@users.noreply.github.com"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve fix-loop (deterministic; short Opus agent per iteration)
        id: loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.ARENA_AUTOMATION_OPENROUTER_API_KEY }}
          TF_PROVIDER: ${{ steps.parse.outputs.provider }}
          TF_NAME: ${{ steps.parse.outputs.name }}
          MODEL_ID: ${{ steps.slug.outputs.model_id }}
        run: |
          set -uo pipefail
          P=scripts/integration/prompts
          fill () {  # $1 = prompt file, $2 = iteration (or empty)
            sed \
              -e "s|{{OBS_DIR}}|observation|g" -e "s|{{PROVIDER}}|${TF_PROVIDER}|g" \
              -e "s|{{NAME}}|${TF_NAME}|g" -e "s|{{MODEL_ID}}|${MODEL_ID}|g" \
              -e "s|{{PR}}|${PR}|g" -e "s|{{MAX_ITER}}|${MAX_ITER}|g" -e "s|{{ITER}}|${2:-1}|g" \
              -e "s|{{MODEL}}|${TF_NAME}|g" -e "s|{{ENGINE_VERSION}}|${GITHUB_SHA}|g" \
              -e "s|{{BASE_DIR}}|observation|g" -e "s|{{DOMAINS_WITH_COUNTS}}|see findings.json|g" \
              -e "s|{{TOTAL_TRIALS}}|see findings.json|g" -e "s|{{ANCHORS}}|none|g" \
              -e "s|{{INFRA_THRESHOLD}}|0.05|g" -e "s|{{GO_BOUNDARY}}|observe mode|g" "$1"
          }
          CONVERGED=no
          for i in $(seq 1 "$MAX_ITER"); do
            echo "::group::Resolve iteration $i"
            rm -f observation/resolve/overlay.yaml observation/resolve/decision.json
            { fill "$P/_shared_context.md"; echo; echo '---'; echo; fill "$P/resolve_agent.md" "$i"; } > /tmp/compose_$i.md
            # `|| true`: an agent that exhausts --max-turns (or errors) exits non-zero, and
            # this step runs under `bash -e`; without the guard that non-zero would abort the
            # WHOLE resolve instead of degrading to the no-overlay path below. A stuck iteration
            # must fall through to the next one (and ultimately to needs-human), not hard-fail.
            claude -p "$(cat /tmp/compose_$i.md)" --model "$AGENT_MODEL" \
              --allowedTools "Bash,Read,Edit,Write" --dangerously-skip-permissions \
              --max-turns "${RESOLVE_MAX_TURNS}" --verbose || true
            if [ ! -f observation/resolve/overlay.yaml ] || [ ! -f observation/resolve/decision.json ]; then
              echo "::warning::iteration $i produced no overlay/decision (agent stalled or hit max-turns)"
              echo "::endgroup::"; continue
            fi
            # Reprobe ONLY the agent's fix-targets (single-line python-c, no indentation
            # to break). All-ceiling decisions name none -> nothing to prove, skip reprobe.
            TARGETS="$(uv run python -c "import json,sys; print(','.join(json.load(open(sys.argv[1])).get('fix_targets',[])))" observation/resolve/decision.json 2>/dev/null || echo '')"
            if [ -z "$TARGETS" ]; then
              echo "iteration $i: decision named no fix-targets (all-ceiling) -> NO_TARGETS"
              VERDICT=NO_TARGETS
            else
              # Workflow runs the reprobe (agent never does). Only the fix-targets, K reps
              # each, as a flat (probe x rep) pool at RESOLVE_CAP_PARALLEL width. Fast.
              uv run python scripts/integration/reprobe.py \
                --baseline observation/findings.json --overlay observation/resolve/overlay.yaml \
                --provider "$TF_PROVIDER" --name "$TF_NAME" \
                --out "observation/resolve/reprobe_$i" --skip-wire \
                --targets "$TARGETS" \
                --capability-k "${RESOLVE_CAPABILITY_K}" --cap-parallel "${RESOLVE_CAP_PARALLEL}" || true
              cp "observation/resolve/reprobe_$i/findings.json" observation/resolve/last_reprobe.json 2>/dev/null || true
              # Are all fix-targets green under the overlay? (helper script, not inline
              # python, so YAML indentation cannot break it.)
              VERDICT="$(uv run python scripts/integration/resolve_greencheck.py observation/resolve/decision.json observation/resolve/last_reprobe.json 2>/dev/null || echo PARSE_FAIL)"
            fi
            echo "iteration $i verdict: $VERDICT"
            echo "::endgroup::"
            # Converge when every fix-target is green, OR the agent proved there is nothing
            # to fix (all failures are genuine ceilings -> finalize writes them as unsupported).
            if [ "$VERDICT" = "CONVERGED" ] || [ "$VERDICT" = "NO_TARGETS" ]; then CONVERGED=yes; break; fi
          done
          echo "converged=$CONVERGED" >> "$GITHUB_OUTPUT"

      - name: Finalize integration (fold preset + cert, commit, report)
        id: finalize
        if: steps.loop.outputs.converged == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_PROVIDER: ${{ steps.parse.outputs.provider }}
          TF_NAME: ${{ steps.parse.outputs.name }}
          MODEL_ID: ${{ steps.slug.outputs.model_id }}
        run: |
          set -euo pipefail
          P=scripts/integration/prompts
          fill () {
            sed -e "s|{{OBS_DIR}}|observation|g" -e "s|{{PROVIDER}}|${TF_PROVIDER}|g" \
              -e "s|{{NAME}}|${TF_NAME}|g" -e "s|{{MODEL_ID}}|${MODEL_ID}|g" -e "s|{{PR}}|${PR}|g" "$1"
          }
          fill "$P/resolve_finalize.md" > /tmp/finalize.md
          # `|| true`: if the agent hits --max-turns it exits non-zero; do not abort before the
          # deterministic commit check below, which decides success by whether files changed
          # (the agent may have written them before running out of turns).
          claude -p "$(cat /tmp/finalize.md)" --model "$AGENT_MODEL" \
            --allowedTools "Bash,Read,Edit,Write" --dangerously-skip-permissions \
            --max-turns "${RESOLVE_MAX_TURNS}" --verbose || true
          # Deterministic commit + report (the agent only wrote files). Stage the WHOLE engine
          # LLM package, not a fixed file list: a code-CREATE can write a new adapter class in ANY
          # module (reasoning_codec / schema_sanitizer / prompt_policy / content_policy /
          # cache_policy), and a narrow list silently drops the new file while committing its
          # wiring -> a build-breaking dangling import (qwen round-2: QwenReasoningCodec imported
          # in presets.py/__init__.py but its class never committed). Plus the cert + preset.
          git add tolokaforge/core/llm tolokaforge/core/data/model_presets.yaml \
            tests/integration/llm/registry.py 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::error::finalize produced no file changes"; exit 1
          fi
          # Verify EXACTLY the staged tree (what we are about to commit), not the workspace: the
          # reprobe validated the workspace, but only a subset is committed. `stash --keep-index`
          # drops everything not staged so the worktree == the future commit; a missing class or
          # dangling import is then caught HERE (exit 1 -> needs-human via the finalize guard),
          # never labeled integrate-done.
          git stash push --keep-index --include-untracked -m resolve-verify >/dev/null 2>&1 || true
          IMPORT_OK=yes
          uv run python -c "import tolokaforge.core.llm" || IMPORT_OK=no
          git stash pop >/dev/null 2>&1 || true
          if [ "$IMPORT_OK" != "yes" ]; then
            echo "::error::staged integration fails to import tolokaforge.core.llm (missing class / dangling import) - refusing to commit a broken build"
            exit 1
          fi
          git commit -m "integrate: ${TF_NAME} via auto-resolve (preset + cert)" \
            -m "Auto-resolve landed the proven policy. See the PR comment for the reprobe evidence and known_unsupported ceilings. Do not merge if this is a disposable test branch."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          [ -f observation/resolve/pr_comment.md ] && gh pr comment "$PR" -R "$REPO" --body-file observation/resolve/pr_comment.md || true
          [ -f observation/resolve/pr_body.md ] && gh pr edit "$PR" -R "$REPO" --body-file observation/resolve/pr_body.md || true
          gh pr edit "$PR" -R "$REPO" --remove-label 'automation:resolve-running' \
            --add-label 'automation:integrate-done' || true

      - name: Flag needs-human (did not converge / no integration)
        # Fires when the loop never converged, OR it converged but finalize failed (agent hit
        # max-turns / wrote nothing / push failed). The latter would otherwise leave the PR
        # stuck in resolve-running with no terminal label.
        if: always() && (steps.loop.outputs.converged != 'yes' || steps.finalize.outcome == 'failure')
        run: |
          gh pr edit "$PR" -R "$REPO" --remove-label 'automation:resolve-running' \
            --add-label 'automation:integrate-needs-human' || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "$PR" -R "$REPO" --body \
            "Resolve did not converge within ${MAX_ITER} iterations, or converged but finalize failed (agent hit max-turns, wrote no changes, or the push failed). Marked \`automation:integrate-needs-human\`. Latest overlay + reprobe are in the run artifacts. Run: ${RUN_URL}"
