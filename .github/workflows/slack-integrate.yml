name: Slack-triggered integration poller

# Turns a Slack request ("@delivery-tech-bot integrate Grok 4.5 and Hy3") into integration
# runs, with NO new app and NO PAT - only the github-actions[bot] GITHUB_TOKEN. A bot token
# cannot be reached from outside GitHub, so the initiative comes from INSIDE: this workflow
# POLLS the channel (the existing bot token, read-only history), resolves each model phrase
# DETERMINISTICALLY (automation.model_resolver - no LLM guessing) against the OpenRouter catalog
# and, for a phrase OpenRouter cannot match, the deployment's gateway catalog, and:
#   * clearly-identified model  -> opens a draft integration PR + dispatches integrate-model.yml
#   * ambiguous / unknown model -> replies in-thread asking for an exact slug (no run started)
#
# It dispatches integrate-model.yml via `gh workflow run` (workflow_dispatch) because a label
# or PR added with GITHUB_TOKEN would NOT trigger a second workflow (the Actions recursion
# guard); workflow_dispatch + repository_dispatch are the only two exceptions, so the whole
# chain stays on github-actions[bot].
#
# Dedup is state-free: a request whose thread already has a bot reply is skipped, and a slug is
# only queued AFTER its reply posts - so re-polling never double-acts and no watermark is stored.
#
# NOTE ON TRIGGERS: GitHub only runs `schedule` and accepts `workflow_dispatch` for a workflow
# once this file is on the DEFAULT branch (a brand-new workflow on a feature branch is not yet
# registered), so the scheduled poll + manual dispatch activate after this lands on main. Before
# then the flow is validated by the unit tests + a local resolver dry-run, and, for one live run,
# by TEMPORARILY adding a `push:` trigger on the feature branch (removed before merge).

on:
  schedule:
    # Poll cadence == trigger latency. Tiered: busy weekday hours poll often, quiet hours rarely.
    # Times track HUNGARY LOCAL (CEST = UTC+2); GitHub cron is UTC-only, so shift each hour range
    # by -1 for winter-exact (CET) timing. Ranges are disjoint, so no minute double-fires.
    - cron: "*/10 6-17 * * 1-5" # weekday daytime, local ~08:00-20:00 -> every 10 min
    - cron: "*/30 0-5 * * 1-5" # weekday early morning, local ~02:00-08:00 -> every 30 min
    - cron: "*/30 18-23 * * 1-5" # weekday evening/night, local ~20:00-02:00 -> every 30 min
    - cron: "*/30 * * * 0,6" # all weekend (Sat/Sun) -> every 30 min
  workflow_dispatch: {}

# Optional workspace restyling: a JSON map from icon ROLE to the emoji the
# workspace uploaded, e.g. {"observe_started":":tf-observe-started:"}. Keyed on
# the role, so icons that share a default today stay separately settable. Unset
# means every message keeps its default. Declared workflow-level so it reaches
# every notifier step without each one repeating it.
env:
  ARENA_AUTOMATION_SLACK_ICON_OVERRIDE: ${{ vars.ARENA_AUTOMATION_SLACK_ICON_OVERRIDE }}

permissions:
  contents: write # push the seed branch
  pull-requests: write # open the draft integration PR (the poller adds no labels)
  actions: write # gh workflow run integrate-model.yml (workflow_dispatch)

concurrency:
  # Single-flight: never let two polls overlap (the state-free dedup assumes one poller at a
  # time; this closes the within-interval race). A queued poll waits for the running one.
  group: slack-integrate-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BASE_REF: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
      # Slack (all optional; an absent token/channel makes the poll a logged no-op).
      SLACK_BOT_TOKEN: ${{ secrets.ARENA_AUTOMATION_SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ vars.ARENA_AUTOMATION_SLACK_CHANNEL }}
      # Optional comma-separated Slack user-id allowlist. Empty => anyone in the channel may
      # trigger (channel membership is the authz gate; GitHub only ever sees github-actions[bot]).
      ALLOWED_USERS: ${{ vars.ARENA_AUTOMATION_SLACK_ALLOWED_USERS }}
      # LLM gateway, both optional. Present => the poller reports whether each resolved model
      # is ALSO reachable there, and honours an explicit "via litellm" in the request. Absent
      # => availability is "unknown" and every request integrates over OpenRouter as before.
      LLM_PROXY_BASE_URL: ${{ secrets.ARENA_AUTOMATION_LLM_PROXY_BASE_URL }}
      LLM_PROXY_API_KEY: ${{ secrets.ARENA_AUTOMATION_LLM_PROXY_API_KEY }}
      # Headers are deliberately NOT passed here yet. This job reaches the gateway
      # through ``automation.gateway_catalog``, which reads the two names above from
      # ``os.environ`` directly and by design (see its comment: routing through
      # ``DotEnvProvider`` would let a developer's local ``.env`` answer a real poll).
      # So it would ignore LLM_PROXY_HEADERS, and passing it would be dead config.
      #
      # The fix is not to teach that module about one more variable: the gateway
      # contract already has a model (``ProxyConfig``), and this module reimplements
      # two thirds of it, which is why it drifts. It should consume a ``ProxyConfig``
      # built from an env-only ``SecretManager``. Tracked separately, because it needs
      # an injectable manager on ``resolve_proxy_config``.
      #
      # Consequence until then: on a gateway that admits callers by a shared-secret
      # header, this poll cannot read the catalog, so every model reports as absent
      # from the gateway for a transport reason rather than a catalogue one.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need origin/<base> to branch the seed commit from

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install "$(cat .python-version)"
      - run: uv sync --dev --locked

      - name: Poll the channel and resolve requests
        # Reads history, resolves each @bot integrate request, posts one threaded reply per
        # request, and writes plan.json = [{slug, requester, message_ts, route, gateway}] for the
        # resolved models. `route` is PER MODEL: the requested route (default openrouter), except
        # a model that exists only on the gateway, which can run nowhere else.
        run: |
          uv run automation slack-poll \
            --channel "$SLACK_CHANNEL" \
            --allowed-users "$ALLOWED_USERS" \
            --window-hours 48 \
            --out plan.json
          echo "plan.json:"; cat plan.json

      - name: Open a draft PR + dispatch the engine per resolved model
        run: |
          set -uo pipefail
          COUNT="$(jq 'length' plan.json 2>/dev/null || echo 0)"
          echo "plan has ${COUNT} model(s) to integrate"
          if [ "${COUNT}" = "0" ]; then echo "nothing to integrate"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bootstrap one model: open a draft PR on an empty seed commit (a PR needs >=1 commit
          # ahead of base, not a file diff, so no artifact is committed; the request metadata
          # lives in the commit message + PR body) then dispatch the engine on it. Any failure
          # logs a warning and returns non-zero so the caller continues to the next model.
          bootstrap () {
            SLUG="$1"; REQUESTER="$2"; TS="$3"
            BOOT_PR_URL=""
            # EXACT open-PR check (jq string equality, not the fuzzy `--search in:title`): the
            # fuzzy form would let "integrate: x-ai/grok-4.5" match an open "integrate: x-ai/grok-4"
            # (skip) or miss on `/`.`-tokenization (duplicate). SLUG is catalog-resolved and
            # charset-guarded upstream, so splicing it into the jq program is safe.
            EXISTING_URL="$(gh pr list -R "$REPO" --state open --json title,url \
              --jq ".[] | select(.title == \"integrate: ${SLUG}\") | .url" 2>/dev/null | head -1)"
            if [ -n "$EXISTING_URL" ]; then
              echo "open integration PR already exists for '$SLUG' -> skip (${EXISTING_URL})"
              # Not silent: the poll-step reply just confirmed this model to the requester, so a
              # bare skip leaves them waiting on a run that will never start (the reply is the
              # dedup marker - re-requesting cannot revive an orphaned PR either, it lands here
              # again). Point at the existing PR and at the label, which is the designed
              # re-trigger when the earlier dispatch died after PR creation.
              uv run automation slack post-thread --channel "$SLACK_CHANNEL" --thread-ts "$TS" \
                --icon pr_exists --text "An integration PR is already open for ${SLUG}: <${EXISTING_URL}|its status lives there>. I am not starting a second run. If that PR shows no activity (no automation label, no run), a maintainer can re-trigger it by adding the automation:integrate-model label to it." || true
              return 0
            fi
            SAFE="$(printf '%s' "$SLUG" | tr '/ ' '--' | tr -cd 'A-Za-z0-9._-')"
            BRANCH="automation/slack-integrate/${SAFE}-${RUN_ID}"
            git checkout -B "$BRANCH" "origin/${BASE_REF}" || return 1
            git commit -q --allow-empty \
              -m "chore(automation): seed Slack-requested integration of ${SLUG}" \
              -m "requested_by: ${REQUESTER}" -m "slack_message_ts: ${TS}" -m "source: slack" || return 1
            git push -q -u origin "$BRANCH" || return 1
            PR_URL="$(gh pr create -R "$REPO" --draft --base "$BASE_REF" --head "$BRANCH" \
              --title "integrate: ${SLUG}" \
              --body "Auto-opened from a Slack request by <@${REQUESTER}> (message ts ${TS}). The poller resolved the model deterministically (OpenRouter catalog first, then the LLM gateway's); this draft PR is the human review gate. The integration engine runs via workflow_dispatch on this PR." )" || return 1
            # From here the PR exists: remember it so the failure reply below can say "start it
            # via the label" instead of the re-request advice, which the exact-title skip above
            # would turn into a silent dead end.
            BOOT_PR_URL="$PR_URL"
            PR_NUM="$(printf '%s' "$PR_URL" | grep -oE '[0-9]+$')"
            [ -n "$PR_NUM" ] || { echo "could not parse PR number from '$PR_URL'"; return 1; }
            echo "opened PR #${PR_NUM} for ${SLUG} (${PR_URL})"
            gh workflow run integrate-model.yml -R "$REPO" --ref "$BASE_REF" \
              -f pr="$PR_NUM" -f head_ref="$BRANCH" -f model="$SLUG" -f source=slack \
              -f route="$ROUTE" || return 1
            echo "dispatched integrate-model.yml for PR #${PR_NUM} (${SLUG})"
            # Confirm in the requester's own thread, WITH the PR link (the poll-step reply was
            # posted before the PR existed; the engine's progress thread is a separate root).
            uv run automation slack post-thread --channel "$SLACK_CHANNEL" --thread-ts "$TS" \
              --icon pr_opened --text "Opened <${PR_URL}|PR #${PR_NUM}> for ${SLUG} - the integration run has started." || true
          }

          mapfile -t ROWS < <(jq -c '.[]' plan.json)
          FAIL=0
          for row in "${ROWS[@]}"; do
            SLUG="$(printf '%s' "$row" | jq -r '.slug')"
            REQUESTER="$(printf '%s' "$row" | jq -r '.requester')"
            TS="$(printf '%s' "$row" | jq -r '.message_ts')"
            # Default in the reader too, so a plan written by an older poller still dispatches.
            ROUTE="$(printf '%s' "$row" | jq -r '.route // "openrouter"')"
            case "$ROUTE" in openrouter|litellm) ;; *) ROUTE=openrouter ;; esac
            git checkout -q "$BASE_REF" 2>/dev/null || git checkout -q -B "$BASE_REF" "origin/${BASE_REF}"
            if ! bootstrap "$SLUG" "$REQUESTER" "$TS"; then
              echo "::warning title=Integration bootstrap failed::could not start integration for ${SLUG} (see log); continuing"
              # Not silent: the poll-step reply already said this model was starting, so tell the
              # requester in-thread that it did NOT - and tell them the recovery that actually
              # works. Re-requesting only helps while NO PR exists; once the PR was opened (the
              # dispatch died after `gh pr create`), a re-request hits the exact-title skip, so
              # the label on that PR is the re-trigger.
              if [ -n "${BOOT_PR_URL:-}" ]; then
                uv run automation slack post-thread --channel "$SLACK_CHANNEL" --thread-ts "$TS" \
                  --icon dispatch_failed --text "I opened <${BOOT_PR_URL}|the integration PR> for ${SLUG} but could not start the engine on it (the dispatch failed). Re-requesting here will NOT restart it - a maintainer can start it by adding the automation:integrate-model label to that PR." || true
              else
                uv run automation slack post-thread --channel "$SLACK_CHANNEL" --thread-ts "$TS" \
                  --icon dispatch_failed --text "I could not start the integration for ${SLUG} (a transient error before the PR existed). Please re-request it by tagging me with that model again." || true
              fi
              FAIL=1
            fi
          done
          exit "$FAIL"
