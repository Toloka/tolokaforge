name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'tolokaforge/**'
      - 'tolokaforge_models/**'
      - 'tolokaforge_coding_harnesses/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
      - '.pre-commit-config.yaml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'tolokaforge/**'
      - 'tolokaforge_models/**'
      - 'tolokaforge_coding_harnesses/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
      - '.pre-commit-config.yaml'
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  # ============================================================================
  # Lint job - Fast feedback on code quality
  # ============================================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        # Pinned (not "latest") so CI resolves the lockfile with the SAME uv that
        # generated it. With `uv sync --locked`, a "latest" uv that ever changes
        # lock resolution/format would fail CI repo-wide on its release day, for
        # nobody's change. Bump this deliberately alongside a relock. Must stay
        # within [tool.uv] required-version in pyproject.toml.
        version: "0.9.5"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python (pinned in .python-version)
      run: uv python install "$(cat .python-version)"


    - name: Install dependencies
      run: uv sync --dev --locked

    - name: Run pre-commit checks
      run: uv run pre-commit run --all-files --show-diff-on-failure

  # ============================================================================
  # Wheel-install gate — the ONE thing every other job is blind to
  # ============================================================================
  # Every other job `uv sync`s a source checkout, so `builder.repo_root()` is the
  # repo and the runner image's build context always resolves. Consumers install
  # the engine as a wheel, where `repo_root()` is `site-packages` — and that path
  # shipped broken TWICE (v0.14.0 and v0.14.1): the runner context resolved to
  # non-existent repo-root paths and every Docker-runtime run died in
  # `build_images()` before a single trial. This job installs the built wheel into
  # a clean venv and drives the real production entry point. No Docker needed —
  # assembling the context is where the bug lives.
  wheel-install-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.9.5"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python (pinned in .python-version)
      run: uv python install "$(cat .python-version)"

    - name: Build engine + sibling wheels (models, coding-harnesses)
      run: |
        uv build --wheel --package tolokaforge
        uv build --wheel --package tolokaforge-models
        uv build --wheel --package tolokaforge-coding-harnesses

    - name: Install the engine wheel into a clean venv (no source tree on the path)
      # Use --find-links so uv resolves `tolokaforge-models` against the
      # local dist/ directory rather than fetching from PyPI. Post-milestone
      # merge + first models-v1.0.0 publish, `uv pip install tolokaforge`
      # alone will resolve `tolokaforge-models` transitively from PyPI —
      # but during the milestone-integration branch we ship both from
      # the workspace.
      run: |
        uv venv /tmp/wheelenv
        VIRTUAL_ENV=/tmp/wheelenv uv pip install \
          --find-links dist/ \
          dist/tolokaforge-*.whl

    - name: Runner build context must assemble from the installed wheel
      # cd / so the source checkout cannot be picked up via CWD.
      run: |
        cd /
        /tmp/wheelenv/bin/python - <<'PY'
        from pathlib import Path
        from tolokaforge.docker.builder import assemble_build_context, repo_root
        from tolokaforge.docker.stacks.core import core_stack

        root = repo_root()
        assert not (root / "pyproject.toml").is_file(), (
            f"expected a wheel install, but {root} looks like a source checkout"
        )

        svc = core_stack().services["runner"]
        build_dir = assemble_build_context(root, svc.dockerfile, svc.context_files)
        required = [
            "pyproject.toml", "README.md", "LICENSE",
            ".python-version", "scripts/hatch", "tolokaforge",
        ]
        missing = [n for n in required if not (build_dir / n).exists()]
        assert not missing, f"assembled runner context is missing {missing}"
        print("runner build context assembles from a wheel install:", sorted(required))
        PY

  # ============================================================================
  # PR smoke tests - fast required gate
  # ============================================================================
  test-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint  # Only run tests if linting passes
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ github.token }}
        lfs: true
        fetch-depth: 0


    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        # Pinned (not "latest") so CI resolves the lockfile with the SAME uv that
        # generated it. With `uv sync --locked`, a "latest" uv that ever changes
        # lock resolution/format would fail CI repo-wide on its release day, for
        # nobody's change. Bump this deliberately alongside a relock. Must stay
        # within [tool.uv] required-version in pyproject.toml.
        version: "0.9.5"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python (pinned in .python-version)
      run: uv python install "$(cat .python-version)"


    - name: Install dependencies
      run: |
        uv sync --dev --locked

    - name: Install Playwright browsers
      run: |
        uv run python -m playwright install chromium

    - name: Create .env file
      run: |
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_TESTING_TOKEN }}" > .env

    - name: Run unit + canonical tests with coverage
      run: |
        uv run pytest -m "unit or canonical" -v --tb=short \
          --cov --cov-report=term-missing

    - name: Run tool tests
      run: |
        for tool_dir in tools/*/; do
          if [ -d "${tool_dir}tests" ]; then
            echo "=== Testing ${tool_dir} ==="
            (cd "${tool_dir}" && uv run pytest tests/ -v --tb=short -p no:cacheprovider) || exit 1
          fi
        done

    - name: Validate public example suites
      run: |
        uv run tolokaforge validate --tasks "examples/native/*/dataset/**/task.yaml"
        uv run tolokaforge validate --tasks "tests/data/tasks/wire_probes/dataset/**/task.yaml"


    - name: Docker task-pack mount smoke
      run: |
        scripts/tests/task_pack_docker_smoke.sh

    # TODO: Re-enable once in-process runtime or Docker-less orchestrator is available.
    # The smoke script requires `tolokaforge run` which now needs a Docker runtime.
    # - name: Run public examples end-to-end (mock smoke)
    #   run: |
    #     scripts/tests/run_public_examples_smoke.sh
    #
    # - name: Summarize public examples
    #   run: |
    #     uv run python scripts/tests/summarize_public_examples.py --min-pass-rate 0.0 --min-completion-rate 1.0
    #
    # - name: Upload public example summary artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: public-example-summary-pr
    #     path: |
    #       output/public_examples_summary.json
    #       output/public_examples_summary.md

  # ============================================================================
  # Full test suite - push + nightly confidence
  # ============================================================================
  test-full:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [lint]
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ github.token }}
        lfs: true
        fetch-depth: 0


    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        # Pinned (not "latest") so CI resolves the lockfile with the SAME uv that
        # generated it. With `uv sync --locked`, a "latest" uv that ever changes
        # lock resolution/format would fail CI repo-wide on its release day, for
        # nobody's change. Bump this deliberately alongside a relock. Must stay
        # within [tool.uv] required-version in pyproject.toml.
        version: "0.9.5"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python (pinned in .python-version)
      run: uv python install "$(cat .python-version)"


    - name: Install dependencies
      run: |
        uv sync --dev --locked

    - name: Install Playwright browsers
      run: |
        uv run python -m playwright install chromium

    - name: Create .env file
      run: |
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_TESTING_TOKEN }}" > .env

    - name: Validate public example suites
      run: |
        uv run tolokaforge validate --tasks "examples/native/*/dataset/**/task.yaml"
        uv run tolokaforge validate --tasks "tests/data/tasks/wire_probes/dataset/**/task.yaml"


    - name: Docker task-pack mount smoke
      run: |
        scripts/tests/task_pack_docker_smoke.sh

    # TODO: Re-enable once in-process runtime or Docker-less orchestrator is available.
    # - name: Run public examples end-to-end (mock smoke)
    #   run: |
    #     scripts/tests/run_public_examples_smoke.sh
    #
    # - name: Summarize public examples
    #   run: |
    #     uv run python scripts/tests/summarize_public_examples.py --min-pass-rate 0.0 --min-completion-rate 1.0

    - name: Run unit + canonical tests with coverage
      run: |
        uv run pytest -m "unit or canonical" -v --tb=short \
          --cov --cov-report=term-missing

    - name: Run tool tests
      run: |
        for tool_dir in tools/*/; do
          if [ -d "${tool_dir}tests" ]; then
            echo "=== Testing ${tool_dir} ==="
            (cd "${tool_dir}" && uv run pytest tests/ -v --tb=short -p no:cacheprovider) || exit 1
          fi
        done

    - name: Build Docker images for integration tests
      if: github.event_name == 'schedule' || github.event_name == 'push'
      id: docker-build-full
      run: |
        uv run tolokaforge docker build --core

    - name: Run integration tests
      if: (github.event_name == 'schedule' || github.event_name == 'push') && steps.docker-build-full.outcome == 'success'
      run: |
        uv run pytest tests/integration/ --pyargs tolokaforge.testing.certify.suite -v --tb=short -n auto

    - name: Generate coverage XML for Codecov
      if: github.event_name == 'schedule'
      run: |
        uv run coverage xml

    - name: Upload coverage to Codecov
      if: github.event_name == 'schedule'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  # ============================================================================
  # Label-triggered gate - full suite + coverage (add 'ready-to-merge' label)
  # ============================================================================
  test-gate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    needs: [lint]
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ github.token }}
        lfs: true
        fetch-depth: 0


    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        # Pinned (not "latest") so CI resolves the lockfile with the SAME uv that
        # generated it. With `uv sync --locked`, a "latest" uv that ever changes
        # lock resolution/format would fail CI repo-wide on its release day, for
        # nobody's change. Bump this deliberately alongside a relock. Must stay
        # within [tool.uv] required-version in pyproject.toml.
        version: "0.9.5"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python (pinned in .python-version)
      run: uv python install "$(cat .python-version)"


    - name: Install dependencies
      run: |
        uv sync --dev --locked

    - name: Install Playwright browsers
      run: |
        uv run python -m playwright install chromium

    - name: Create .env file
      run: |
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_TESTING_TOKEN }}" > .env

    - name: Validate public example suites
      run: |
        uv run tolokaforge validate --tasks "examples/native/*/dataset/**/task.yaml"
        uv run tolokaforge validate --tasks "tests/data/tasks/wire_probes/dataset/**/task.yaml"


    - name: Docker task-pack mount smoke
      run: |
        scripts/tests/task_pack_docker_smoke.sh

    - name: Run unit + canonical tests with coverage
      run: |
        uv run pytest -m "unit or canonical" -v --tb=short \
          --cov --cov-report=xml --cov-report=term-missing

    - name: Build Docker images for integration tests
      id: docker-build
      run: |
        uv run tolokaforge docker build --core

    - name: Run integration tests
      if: steps.docker-build.outcome == 'success'
      run: |
        uv run pytest tests/integration/ --pyargs tolokaforge.testing.certify.suite -v --tb=short -n auto

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: merge-gate
        name: codecov-merge-gate
      continue-on-error: true
