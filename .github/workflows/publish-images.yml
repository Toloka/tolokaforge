name: Publish images to Docker Hub

on:
  push:
    tags:
      - "image-v*"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the first-party image set. The matrix below
# carries per-image metadata (Dockerfile path, whether the image bundles
# the wheel) and must stay in sync with this list, but every bash loop that
# only needs the names reads from here — kept in one place so adding a
# fifth image is one env edit + one matrix row, not six sites.
env:
  FIRST_PARTY_IMAGES: "runner db-service rag-service mock-web grader"

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Fail loud before anything builds if the tag disagrees with the code it
      # claims to package. rc tags (image-v0.12.0-rc.1) carry an image-only
      # suffix that pyproject never encodes, so the base version is compared.
      - name: Assert tag version matches pyproject version
        if: github.event_name != 'workflow_dispatch'
        run: |
          version="${GITHUB_REF_NAME#image-v}"
          base_version="${version%%-rc.*}"
          pyproject_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$base_version" != "$pyproject_version" ]; then
            echo "::error::image tag image-v${version} (base ${base_version}) does not match pyproject version ${pyproject_version}"
            exit 1
          fi
          echo "tag ${version} agrees with pyproject ${pyproject_version}"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - name: Build wheel
        run: uv build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: tolokaforge-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.image }}
    needs: build-wheel
    runs-on: ubuntu-latest
    # rc tags publish under pre-stable, stable tags under release. A tag that
    # resolves to the wrong tier fails OIDC claim resolution and blocks the push,
    # which is safer than an rc leaking onto the moving tags. A workflow_dispatch
    # build binds no environment (empty string) so its dry-run is not gated by a
    # tag-typed deployment policy. The push/tag branch is the `&&` operand and the
    # empty string is the final `||` fallback: an empty string is falsy in an
    # expression, so `workflow_dispatch && '' || …` would wrongly fall through to
    # the tag branch and route the dry-run to `release` — reordering keeps `''` as
    # the value actually returned for a workflow_dispatch.
    environment: ${{ github.event_name != 'workflow_dispatch' && (contains(github.ref_name, '-rc.') && 'pre-stable' || 'release') || '' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: runner
            dockerfile: tolokaforge/docker/dockerfiles/runner.Dockerfile
            needs_wheel: true
          - image: rag-service
            dockerfile: tolokaforge/docker/dockerfiles/rag.Dockerfile
            needs_wheel: true
          - image: db-service
            dockerfile: tolokaforge/docker/dockerfiles/db_service.Dockerfile
            needs_wheel: false
          - image: mock-web
            dockerfile: tolokaforge/docker/dockerfiles/mock_web.Dockerfile
            needs_wheel: false
          - image: grader
            dockerfile: tolokaforge/docker/dockerfiles/grader.Dockerfile
            needs_wheel: true
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and Python pin
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#image-v}" >> "$GITHUB_OUTPUT"
          echo "python_version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: tolokaforge-dist
          path: dist/

      - name: Stage wheel into build context
        if: matrix.needs_wheel
        run: |
          shopt -s nullglob
          wheels=(dist/tolokaforge-*.whl)
          wheel="${wheels[0]}"
          if [ -z "$wheel" ]; then
            echo "::error::no tolokaforge wheel found in dist/"
            exit 1
          fi
          cp "$wheel" "./$(basename "$wheel")"
          echo "WHEEL_FILENAME=$(basename "$wheel")" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # A repo-scoped Docker Hub OIDC token cannot pull library/python, so the
      # python base layers must be fetched before `docker login`. This build runs
      # unauthenticated: it pulls the base anonymously and warms the buildx cache.
      # The later authenticated push reuses these cached layers (pull: false) and
      # contacts Docker Hub only to push the tolokasoft1 repo. On a
      # workflow_dispatch dry-run this is the whole validation (no login, no push).
      - name: Build image (anonymous base pull, pre-login)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: false
          push: false
          build-args: |
            PYTHON_VERSION=${{ steps.meta.outputs.python_version }}
            ${{ matrix.needs_wheel && format('WHEEL_FILENAME={0}', env.WHEEL_FILENAME) || '' }}

      - name: Mint Docker Hub OIDC token
        id: docker_oidc
        if: github.event_name != 'workflow_dispatch'
        uses: docker/oidc-action@v1
        with:
          connection_id: "06a2983d-e4d1-473e-8dab-f1d6ead9bc8f"

      - name: Docker Hub login
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: tolokasoft1
          password: ${{ steps.docker_oidc.outputs.token }}

      # Pushes only the immutable :{version} tag. The moving tags (:latest, :X.Y)
      # are owned by move-tags, which runs only after every image and the smoke
      # gate are green.
      - name: Push immutable tag
        id: push
        if: github.event_name != 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: true
          pull: false
          push: true
          tags: tolokasoft1/tolokaforge-${{ matrix.image }}:${{ steps.meta.outputs.version }}
          build-args: |
            PYTHON_VERSION=${{ steps.meta.outputs.python_version }}
            ${{ matrix.needs_wheel && format('WHEEL_FILENAME={0}', env.WHEEL_FILENAME) || '' }}

  smoke:
    name: rc-smoke against published images
    needs: publish
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - name: Install dependencies
        run: uv sync --dev --locked

      # The keyless image-level rc-smoke module referenced here ships alongside
      # this workflow (tests/integration/deploy/test_published_images_rc_smoke.py)
      # and runs only post-merge on a tag. It pulls the four freshly-pushed
      # :{version} images anonymously (they are public) and asserts entrypoint +
      # healthcheck + documented exec surface. Keyless: the runner run-trial check
      # accepts a well-formed `error` wire line as a pass, so this gate costs zero
      # tokens and needs no provider key. A red smoke blocks move-tags, so :latest
      # is never moved onto a broken image.
      - name: Run keyless rc-smoke
        run: |
          version="${GITHUB_REF_NAME#image-v}"
          TOLOKAFORGE_SMOKE_IMAGE_TAG="$version" \
            uv run pytest tests/integration/deploy/test_published_images_rc_smoke.py \
            -v --tb=short -m "integration and requires_docker"

  auto-promote-rc-to-stable:
    name: Auto-promote rc → stable (retag digest + move :latest + release notes)
    needs: smoke
    # Only fires on the automated rc-push path. A workflow_dispatch dry-run has
    # no images to promote (see the publish job's `push: false`) and skips.
    # A manual stable `image-vX.Y.Z` push takes the move-tags branch below
    # untouched — auto-promote and move-tags are mutually exclusive.
    if: github.event_name == 'push' && contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    # Bound the blast radius of a hung Docker Hub call — the default 6h would
    # tie up the runner and hold the concurrency slot for the tag. move-tags
    # below is analogous and could use the same cap; kept scoped to this PR.
    timeout-minutes: 20
    # Same OIDC scoping as move-tags — the promote step uses the `release`
    # deployment scope, minting a Docker Hub push token distinct from the
    # `pre-stable` token that pushed the rc images. An rc build that fell into
    # this branch through some ref-name accident would fail OIDC claim
    # resolution and block the push, matching the safety property the publish
    # job's `environment:` expression enforces for the initial rc push.
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Resolve version tags
        id: meta
        run: |
          rc_version="${GITHUB_REF_NAME#image-v}"       # e.g. 0.14.2-rc.1
          version="${rc_version%%-rc.*}"                # e.g. 0.14.2
          major_minor="${version%.*}"                   # e.g. 0.14
          {
            echo "rc_version=$rc_version"
            echo "version=$version"
            echo "major_minor=$major_minor"
          } >> "$GITHUB_OUTPUT"

      - name: Mint Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection_id: "06a2983d-e4d1-473e-8dab-f1d6ead9bc8f"

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: tolokasoft1
          password: ${{ steps.docker_oidc.outputs.token }}

      # Same-digest retag from :X.Y.Z-rc.N onto :X.Y.Z. No rebuild — the
      # image bytes are already public and rc-smoke has already validated
      # them. Idempotent: re-running re-points the immutable :X.Y.Z tag
      # onto the same digest, so a mid-loop failure is safe to rerun.
      - name: Retag rc → stable (idempotent digest copy)
        env:
          RC_VERSION: ${{ steps.meta.outputs.rc_version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for image in $FIRST_PARTY_IMAGES; do
            repo="tolokasoft1/tolokaforge-${image}"
            docker buildx imagetools create -t "${repo}:${VERSION}" "${repo}:${RC_VERSION}"
          done

      # Duplicated from the move-tags job below — kept in-place so the
      # auto-promote job is self-contained and its DAG stays linear off
      # `smoke`. A shared job would need a needs-graph across two `if:`
      # branches that complicates the graph for no readability win.
      - name: Move :latest and :major.minor onto the stable digest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MAJOR_MINOR: ${{ steps.meta.outputs.major_minor }}
        run: |
          for image in $FIRST_PARTY_IMAGES; do
            repo="tolokasoft1/tolokaforge-${image}"
            docker buildx imagetools create -t "${repo}:latest" "${repo}:${VERSION}"
            docker buildx imagetools create -t "${repo}:${MAJOR_MINOR}" "${repo}:${VERSION}"
          done

      # Attach the GitHub Release to the rc tag that triggered this run — not
      # to a new `image-vX.Y.Z` git tag. Creating a stable git tag here would
      # fire publish-images.yml on that tag and duplicate the entire build,
      # smoke, and move-tags sequence for no additional value. The rc tag is
      # the auditable pointer to the digest that was promoted; the Release
      # title names the stable version so `gh release list` reads correctly.
      # Fail loud on a Docker Hub hiccup — GH-Actions `bash` default is
      # `set -eo pipefail`, but a failing `$(imagetools inspect …)` command
      # substitution is NOT propagated to errexit unless `inherit_errexit`
      # is on. Without this shopt, a transient 500 would leave `digest=""`
      # and the step would silently publish a garbled digest row.
      - name: Collect image digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          {
            echo "## Published images (auto-promoted from ${REF_NAME})"
            echo ""
            echo "| Image | Tag | Digest |"
            echo "|---|---|---|"
            for image in $FIRST_PARTY_IMAGES; do
              repo="tolokasoft1/tolokaforge-${image}"
              digest="$(docker buildx imagetools inspect "${repo}:${VERSION}" --format '{{.Manifest.Digest}}')"
              echo "| \`${repo}\` | ${VERSION} | \`${digest}\` |"
            done
          } | tee release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # The Release title carries the rc suffix so that a hotfix flow which
      # auto-promotes rc.1 and then rc.2 for the same X.Y.Z produces two
      # visibly distinct Releases in `gh release list`. Without the suffix
      # both entries would read `Docker images vX.Y.Z` and consumers would
      # have to open each body to tell which is the current stable.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Docker images v${{ steps.meta.outputs.version }} (from ${{ steps.meta.outputs.rc_version }})
          body_path: release-notes.md
          # Do NOT append_body — the auto-promote job is idempotent for the
          # image tags, and the release body must be idempotent too. A retry
          # (rerun-failed-jobs, transient CI hiccup) with `append_body: true`
          # would pile duplicate digest tables into the same Release. False
          # (the default) replaces the body, so retries land on identical
          # content whether they're the first run or the tenth.
          append_body: false
          generate_release_notes: true

  move-tags:
    name: Move :latest and :X.Y
    needs: smoke
    # Stable tags only — rc tags carry no moving tags.
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    # move-tags mints its own OIDC token, so it must declare environment: release
    # and id-token: write itself — without the environment the OIDC claim will not
    # resolve to a push-capable token and the first stable tag would fail here.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Resolve moving tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#image-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Mint Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection_id: "06a2983d-e4d1-473e-8dab-f1d6ead9bc8f"

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: tolokasoft1
          password: ${{ steps.docker_oidc.outputs.token }}

      # Re-running this job IS the recovery path for a mid-job failure: every
      # `imagetools create` re-points a moving tag at the already-published,
      # immutable :{version} digest, so each op is idempotent regardless of how
      # far a prior run progressed — there is no intra-job ordering dependency.
      - name: Move :latest and :major.minor onto the immutable digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MAJOR_MINOR: ${{ steps.meta.outputs.major_minor }}
        run: |
          for image in $FIRST_PARTY_IMAGES; do
            repo="tolokasoft1/tolokaforge-${image}"
            docker buildx imagetools create -t "${repo}:latest" "${repo}:${VERSION}"
            docker buildx imagetools create -t "${repo}:${MAJOR_MINOR}" "${repo}:${VERSION}"
          done

  release-notes:
    name: Release notes
    needs: move-tags
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect image digests
        run: |
          version="${GITHUB_REF_NAME#image-v}"
          {
            echo "## Published images"
            echo ""
            echo "| Image | Tag | Digest |"
            echo "|---|---|---|"
            for image in $FIRST_PARTY_IMAGES; do
              repo="tolokasoft1/tolokaforge-${image}"
              digest="$(docker buildx imagetools inspect "${repo}:${version}" --format '{{.Manifest.Digest}}')"
              echo "| \`${repo}\` | ${version} | \`${digest}\` |"
            done
          } | tee release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          append_body: true
          generate_release_notes: true
