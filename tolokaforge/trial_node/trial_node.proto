// Trial Node Protocol
// Control plane <-> trial node: the node owns one whole trial.
// See docs/TRIAL_NODE_SERVICE.md and ADR-0060 for the design record.
//
// The control plane ships one serialized TrialNodeInputs to a leased node; the
// node runs the trial (conductor, agent loop and substrate all node-side) and
// replies with the graded TrialResult. The service revs on its own cadence,
// independent of runner.proto and grader.proto: NODE_PROTOCOL_VERSION in
// tolokaforge/trial_node/protocol.py is the compatibility gate.
//
// RunTrial is a single unary call that lasts as long as the trial. The channel
// carries keepalive pings so a dead node surfaces as UNAVAILABLE rather than a
// silent hang; there is no streaming progress and no mid-trial cancellation.

syntax = "proto3";

package tolokaforge.trial_node;

option go_package = "tolokaforge/trial_node";

service TrialNodeService {
  // Run one trial to a graded result.
  rpc RunTrial(RunTrialRequest) returns (RunTrialResponse);

  // Report readiness, protocol version and message-size bound.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message RunTrialRequest {
  // TrialNodeInputs.model_dump_json(). Carries no secret bytes: model configs
  // hold ${secret:NAME} references resolved from the node's own secret payload.
  string trial_node_inputs_json = 1;

  // The caller's NODE_PROTOCOL_VERSION. The node refuses a caller older than
  // its own version before doing any work.
  int32 client_protocol_version = 2;
}

message RunTrialResponse {
  bool success = 1;

  // TrialResult.model_dump_json(); set when success.
  string trial_result_json = 2;

  // Set when !success. One of ProvisionError, SecretPreflight, TaskPackDrift,
  // NotImplemented, VersionSkew, NodeBusy, InvalidConfig, Internal; see
  // NodeErrorType for the source of truth.
  string error_type = 3;
  string stage = 4;
  string reason = 5;

  int32 node_protocol_version = 6;
  int32 node_max_message_mb = 7;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  // ready | busy
  string status = 1;
  int32 node_protocol_version = 2;
  int32 node_max_message_mb = 3;
  bool trial_in_flight = 4;
}
