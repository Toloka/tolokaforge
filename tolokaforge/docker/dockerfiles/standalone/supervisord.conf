; supervisord config for the all-in-one tolokaforge image.
;
; supervisord runs as pid 1 (root) so the entrypoint can add the loopback host
; aliases to /etc/hosts; every service program drops to the non-root `runner`
; user via `user=`. Child processes inherit supervisord's environment (the
; container env passed with `docker run -e …`, including LLM provider keys and
; TOLOKAFORGE_SECRETS_JSON), so credentials reach the runner without being
; baked into the image.
;
; Startup order is by priority: the three env services (priority 10) start
; before the runner (priority 20). The runner's DB client retries, and rag/
; mock-web are only hit lazily by tasks, so strict health-gating is not
; required here — the container HEALTHCHECK gates readiness for `--wait`.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/tolokaforge/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:db-service]
command=/opt/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8000 --app-dir /srv/db
user=runner
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:rag-service]
command=/opt/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8001 --app-dir /srv/rag
user=runner
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; HF_HOME / HF_HUB_OFFLINE / EMBEDDING_MODEL / CORPUS_PATH are set as container
; ENV in the Dockerfile runtime stage (EMBEDDING_MODEL sourced from the build
; arg so a custom bake is honoured) and inherited here via supervisord — not
; re-pinned, so this program can never diverge from the baked model.
environment=PYTHONUNBUFFERED="1"

[program:mock-web]
command=/opt/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8080 --app-dir /srv/web
user=runner
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:runner]
command=/opt/venv/bin/python -m tolokaforge.runner
user=runner
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",DB_SERVICE_URL="http://localhost:8000",RAG_SERVICE_URL="http://localhost:8001"
