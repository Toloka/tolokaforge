; Opt-in TypeSense program for the all-in-one image (TypeSense flavor).
;
; Dropped into /etc/supervisor/conf.d/ only when the image is built with
; --build-arg INSTALL_TYPESENSE=true, and picked up via the base config's
; [include]. Runs the co-located TypeSense server on 8108 as the non-root
; runner user, writing to /env/typesense.
;
; TYPESENSE_API_KEY must be set in the container env; the entrypoint defaults it
; (and exports TYPESENSE_HOST/PORT for the runner) before supervisord starts, so
; the %(ENV_TYPESENSE_API_KEY)s expansion below always resolves. The host
; orchestrator must use the SAME key (typesense.mode: remote in the run config).

[program:typesense]
command=/usr/local/bin/typesense-server --data-dir=/env/typesense --api-key=%(ENV_TYPESENSE_API_KEY)s --listen-port=8108 --enable-cors
user=runner
priority=5
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
