// Runner Service Protocol
// Host ↔ Runner communication for Tolokaforge distributed architecture
// See docs/GRPC_PROTOCOL.md for full specification

syntax = "proto3";

package tolokaforge.runner;

option go_package = "tolokaforge/runner";

// =============================================================================
// Runner Service - Main Host ↔ Runner communication
// =============================================================================

service RunnerService {
  // Register a new trial with a typed TrialSpec payload.
  // Host sends TrialSpec JSON; Runner reads spec.task to initialise the
  // environment and uses spec.<other fields> for per-trial execution context.
  rpc RegisterTrial(RegisterTrialRequest) returns (RegisterTrialResponse);

  // Execute a tool call from the LLM
  // Host forwards tool call, Runner executes and returns output
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);

  // Grade the completed trial
  // Host sends trajectory, Runner computes grade via golden path comparison
  rpc GradeTrial(GradeTrialRequest) returns (GradeTrialResponse);

  // Get current state snapshot - for debugging
  rpc GetState(GetStateRequest) returns (GetStateResponse);

  // Reset trial state to initial - for retries
  rpc ResetTrial(ResetTrialRequest) returns (ResetTrialResponse);

  // Forget a trial's registration entirely - for retry-after-transient-failure paths
  // Idempotent: succeeds when the trial is not registered.
  // Distinct from ResetTrial: ResetTrial keeps the registration and resets state;
  // CleanupTrial removes the registration so the same trial_id can be re-registered.
  rpc CleanupTrial(CleanupTrialRequest) returns (CleanupTrialResponse);

  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// =============================================================================
// RegisterTrial - Initialise trial with a TrialSpec payload
// =============================================================================

message RegisterTrialRequest {
  // Unique identifier for this trial instance.
  // Format: "{task_id}:{trial_index}" e.g. "airline_task_001:0".
  // Redundant with TrialSpec.trial_id; kept as a top-level field so trial
  // routing/lookups don't need to parse the JSON payload.
  string trial_id = 1;

  // Full TrialSpec as JSON string. See tolokaforge/core/trial.py for the
  // Pydantic model and docs/adr/0003-trial-spec-and-trial-result.md
  // for the rationale. The TrialSpec embeds a TaskDescription at spec.task
  // plus the per-trial execution context (run_id, attempt_id, model configs,
  // env endpoints, runtime context).
  string trial_spec_json = 2;

  // Optional: Override timeout for tool execution (seconds).
  // Redundant with TrialSpec.default_tool_timeout_s; kept at the proto level
  // so the runner doesn't have to parse the spec to apply the default before
  // tool reconstruction.
  double default_tool_timeout_s = 3;

  // Wire-protocol version the calling engine speaks. See
  // tolokaforge/runner/protocol.py for the current value and what it carries.
  // RegisterTrial fails when it is below the version the runner requires, so
  // an engine/image skew aborts the trial before any tokens are spent.
  int32 engine_protocol_version = 4;
}

message RegisterTrialResponse {
  // Whether registration succeeded
  bool success = 1;

  // Error message if registration failed
  string error = 2;

  // Tool schemas in OpenAI function calling format
  // These are returned to Host for LLM tool configuration
  // Format: [{"type": "function", "function": {"name": "...", "description": "...", "parameters": {...}}}]
  repeated ToolSchema tool_schemas = 3;

  // Number of agent tools registered
  int32 num_agent_tools = 4;

  // Number of user tools registered (for dual-control scenarios)
  int32 num_user_tools = 5;
}

// Tool schema in OpenAI function calling format
message ToolSchema {
  string name = 1;
  string description = 2;
  // JSON Schema for parameters
  string parameters_json = 3;
  // Tool category: "read", "write", "compute"
  string category = 4;
  // Timeout override for this specific tool
  double timeout_s = 5;
}

// =============================================================================
// ExecuteTool - Execute a single tool call
// =============================================================================

message ExecuteToolRequest {
  // Trial identifier (must match a registered trial)
  string trial_id = 1;

  // Tool name to execute
  string tool_name = 2;

  // Tool arguments as JSON string
  // Must conform to the tool's parameter schema
  string arguments_json = 3;

  // Timeout for this execution (seconds)
  // If 0, uses default from RegisterTrial or tool schema
  double timeout_seconds = 4;

  // Which environment is making the call
  // "agent" for assistant tools, "user" for user-side tools
  string executor = 5;

  // The provider's tool-call id (ToolCall.id) — the key that joins this call
  // to the tool-result message it produced. Required: the runner rejects an
  // empty value, because two calls to the same tool with identical arguments
  // are otherwise indistinguishable in the recorded history.
  string call_id = 6;
}

message ExecuteToolResponse {
  // Execution status
  ExecutionStatus status = 1;

  // Tool output string (what the LLM sees)
  // For success: the tool's return value as string
  // For error: empty (see error_message)
  // For timeout: empty (see error_message)
  string output = 2;

  // Error message if status != SUCCESS
  string error_message = 3;

  // Execution metrics
  ToolMetrics metrics = 4;
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_SUCCESS = 1;
  EXECUTION_STATUS_ERROR = 2;
  EXECUTION_STATUS_TIMEOUT = 3;
  EXECUTION_STATUS_TOOL_NOT_FOUND = 4;
  EXECUTION_STATUS_INVALID_ARGUMENTS = 5;
  EXECUTION_STATUS_TRIAL_NOT_FOUND = 6;
}

message ToolMetrics {
  // Execution latency in seconds
  double latency_seconds = 1;

  // Exit code (for bash-like tools)
  int32 exit_code = 2;

  // Number of state mutations caused by this tool (optional, low priority)
  // Requires Runner to track via DB Service - may be 0 if not implemented
  int32 state_mutations = 3;
}

// =============================================================================
// GradeTrial - Compute grade for completed trial
// =============================================================================

message GradeTrialRequest {
  // Trial identifier
  string trial_id = 1;

  // The trial's full interleaved message trace, encoded by
  // tolokaforge.core.grading.transcript_wire.encode_transcript_wire: a JSON array
  // of {role, content} objects in execution order, covering every role — a tool
  // result crosses as role "tool" carrying its tool_call_id.
  // An assistant or user turn that called tools also carries
  // tool_calls: [{"id", "function": {"name", "arguments"}}], where "id" is the
  // provider's tool-call id and "arguments" is a JSON-encoded string. That id is
  // the only key joining a call to its result — parallel calls to one tool with
  // identical arguments are otherwise indistinguishable — and
  // decode_transcript_wire rejects a payload whose tool_calls carry none.
  // The leading "system" message is the agent's policy, lifted out by
  // split_leading_system_message rather than replayed as a conversational turn.
  // Needed for transcript_rules and llm_judge grading; for hash-only grading
  // (TlkMcpCore, Tau) it can be omitted — the Runner has its own tool-call record.
  string llm_messages_json = 2;

  // Optional: Skip golden path execution if expected hash is pre-computed
  // If provided, Runner compares trial state hash directly
  string precomputed_expected_hash = 3;

  // Which grading components to compute
  // If empty, computes all configured in TaskDescription.grading
  repeated string grading_components = 4;  // "state_checks", "transcript_rules"

  // How the trial ended, as a tolokaforge.core.models.TerminationReason value
  // ("agent_done", "user_stop", "max_turns", ...); empty when the engine
  // reported none. Grading input, never author-matchable: it tells a deliberate
  // finish apart from an exhausted turn budget. A value outside the enum fails
  // the RPC rather than parsing to "none", which would mislabel trial health.
  string termination_reason = 5;
}

message GradeTrialResponse {
  // Whether grading succeeded
  bool success = 1;

  // Error message if grading failed
  string error = 2;

  // The computed grade
  Grade grade = 3;
}

message Grade {
  // Binary pass/fail based on pass_threshold
  bool binary_pass = 1;

  // Numeric score 0.0 - 1.0
  double score = 2;

  // Individual component scores
  GradeComponents components = 3;

  // Human-readable reasons for the grade
  // Format: "State: hash mismatch | Transcript: 2 required actions missing"
  string reasons = 4;

  // State diff if hash comparison failed
  // JSON object with: added, removed, modified, diff_lines
  string state_diff_json = 5;

  // Detailed custom check results if applicable
  repeated CustomCheckResult custom_checks = 6;

  // Per-criterion rubric-judge breakdown (empty unless an LLM judge ran).
  // Each entry records met / score / justification for one rubric Criterion.
  repeated CriterionResult criterion_results = 7;

  // Status of the rubric judge for this grade. JUDGE_STATUS_UNSPECIFIED when
  // no judge was configured. JUDGE_STATUS_ERRORED means the judge malfunctioned
  // (e.g. retry exhaustion / wall-time budget exceeded): the rubric component is
  // incomplete and MUST NOT be read as a 0.0 score (fail loud, not silent zero).
  JudgeStatus judge_status = 8;

  // Judge accounting + audit transcript. Unset when no judge ran. Carries the
  // judge's OWN token usage / cost (the judge runs its own LLM in the Runner)
  // and the judge's message transcript, so a reviewer can audit WHY a criterion
  // failed and account for grading cost. Populated for both COMPLETED and
  // ERRORED runs (an errored judge still burned tokens worth recording).
  JudgeReport judge_report = 9;

  // Per-constraint trace-check verdicts (empty unless the pack declared
  // trace_checks and the timeline carried events). Small and scannable, so the
  // host writes it inline in grade.yaml rather than to a sidecar.
  repeated TraceConstraintResult trace_checks = 10;
}

// The rubric judge's own accounting + audit transcript (see docs/RUBRIC_GRADING_DESIGN.md
// § "Record the judge's own token usage/cost" and the reproducibility open
// question — the transcript is the audit channel for a non-deterministic judge).
message JudgeReport {
  // Number of LLM calls the judge made.
  int32 calls = 1;
  // Judge prompt (input) tokens.
  int32 prompt_tokens = 2;
  // Judge completion (output) tokens.
  int32 completion_tokens = 3;
  // Judge reasoning / thinking tokens (providers with thinking).
  int32 reasoning_tokens = 4;
  // Judge LLM cost in USD (the judge's own spend, separate from the agent's).
  double cost_usd = 5;
  // Number of read-only tool calls the judge made (DB reads, search_kb, …).
  int32 tool_calls = 6;
  // The judge's full message transcript as a JSON string (list of role /
  // content / tool_calls dicts). Audit/reproducibility channel — the judge
  // tool-call ordering is non-deterministic even at temperature 0, so the
  // recorded transcript is the source of truth for "what did the judge see /
  // do". Empty string when no transcript was captured.
  string transcript_json = 7;
  // Number of submit_report attempts rejected for a verdict/justification marker
  // mismatch on this trial (distinct from generic schema rejections). 0 when the
  // judge's verdicts all matched their justifications.
  int32 consistency_rejections = 8;
  // Whether the judge was constructed to withhold knowledge-search tools
  // (grading.llm_judge.customization.disable_knowledge_search). The authoritative
  // replay signal: true means config withheld KB, regardless of whether the
  // agent had any KB tool this trial.
  bool knowledge_search_disabled = 9;
  // KB-tagged tools the judge was actually offered this trial (e.g. search_kb, a
  // search_policy passthrough). Audit detail.
  repeated string kb_tools_offered = 10;
  // KB-tagged tools the agent had this trial that the judge withheld by config.
  // Empty when nothing was gated (flag off, or agent had no KB). Audit detail.
  repeated string kb_tools_withheld = 11;
  // The initial -> final DB state-delta string the judge was handed as its
  // primary outcome view (the agent's own edits; see _build_judge_state_diff).
  // Empty string when no diff was built (non-DB task, or a DB read hiccup
  // degraded to no diff). Offline replay rebuilds the judge's opening message
  // from this exact string.
  string state_diff_text = 12;
  // Non-KB read-only tools the judge was offered this trial: get_db_state /
  // query_db (a DB reader was supplied) and read_file (a workspace existed). The
  // KB surface lives in kb_tools_offered / kb_tools_withheld. Offline replay
  // declares which live backends to shim from this list.
  repeated string read_tools_offered = 13;
  // Whether the judge ran with a custom system-prompt body
  // (grading.llm_judge.customization.system_prompt). The harness always appends
  // the marker contract regardless. The full custom text is recorded in
  // task.yaml.grading_config, not here — this is the honest bool.
  bool custom_system_prompt = 14;
  // Whether the harness embedded the agent's policy / system prompt in the
  // judge's opening-message evidence
  // (grading.llm_judge.customization.include_agent_system_prompt). Explicit
  // presence (optional): the semantic default is true (include), which fights
  // proto3's false wire default, so the host must distinguish "field absent
  // (legacy sender)" from "present and false" to avoid recording a false
  // "gated out" for a run that included the policy.
  optional bool include_agent_system_prompt = 15;
}

// Outcome of running the rubric judge. Keeps a judge malfunction distinct from a
// genuine low score so a broken grader is never recorded as 0.0.
enum JudgeStatus {
  JUDGE_STATUS_UNSPECIFIED = 0;  // No judge configured / not run
  JUDGE_STATUS_COMPLETED = 1;    // Judge produced per-criterion results
  JUDGE_STATUS_ERRORED = 2;      // Judge failed; component incomplete, no score
}

// One rubric criterion's judged outcome.
message CriterionResult {
  // Criterion id (matches Criterion.id in the rubric config)
  string id = 1;
  // Binary verdict (for graded criteria: cleared the author's bar)
  bool met = 2;
  // 0/1 for binary criteria, 0-1 for graded criteria
  double score = 3;
  // Judge's natural-language justification for this criterion
  string justification = 4;
}

message GradeComponents {
  // State checks score (hash comparison, JSONPath assertions, DB probes)
  // -1.0 means not evaluated
  double state_checks = 1;

  // Transcript rules score (required actions, communicate info, max turns)
  double transcript_rules = 2;

  // LLM judge (rubric) score, computed by the Runner on the shared loop.
  // -1.0 means not evaluated; see Grade.judge_status for errored runs (which
  // do NOT report a 0.0 score). Earlier protocol revisions left the judge to
  // the host — the Runner now owns it (see docs/RUBRIC_GRADING_DESIGN.md).
  double llm_judge = 3;

  // Custom Python checks score
  double custom_checks = 4;

  // Trace checks score (temporal constraints over the trial's event timeline).
  // Explicit presence (optional) rather than the -1.0 sentinel the four fields
  // above use: proto3 scalars have no presence, so a runner image predating
  // this field would decode as 0.0 and the host would record a scored zero
  // where the truth is "this runner cannot evaluate trace checks". The
  // RegisterTrial version gate does not cover this direction — a new engine
  // registers happily against an older runner. Absent means not evaluated;
  // present -1.0 also means not evaluated (a runner that has the field but
  // scored nothing).
  optional double trace_checks = 5;
}

message TraceConstraintResult {
  // Constraint id, unique within the pack's trace_checks block
  string id = 1;
  // Which of the ten constraint kinds this result is for
  string kind = 2;
  bool passed = 3;
  // The author's weight on this constraint, as it entered the component fold
  double weight = 4;
  // Empty on a pass; names the unmatched anchor, the failed condition, or the
  // evidence the trial does not carry
  string message = 5;
  // Timeline positions the constraint's matchers selected — an event is looked
  // up by position against trajectory.yaml
  repeated int32 matched_positions = 6;
}

message CustomCheckResult {
  string check_name = 1;
  // "passed", "failed", "skipped", "error"
  string status = 2;
  double score = 3;
  string message = 4;
  // Additional details as JSON
  string details_json = 5;
}

// =============================================================================
// GetState - Debug endpoint to inspect current state
// =============================================================================

message GetStateRequest {
  // Trial identifier
  string trial_id = 1;

  // Whether to include unstable fields in response
  bool include_unstable = 2;

  // Specific tables to return (empty = all)
  repeated string tables = 3;
}

message GetStateResponse {
  // Whether request succeeded
  bool success = 1;

  // Error message if failed
  string error = 2;

  // Current state as JSON
  // Structure: {"table_name": [records...], ...}
  string state_json = 3;

  // Stable state hash (excluding unstable fields)
  string stable_hash = 4;

  // Full state hash (including unstable fields)
  string full_hash = 5;
}

// =============================================================================
// ResetTrial - Reset state to initial for retries
// =============================================================================

message ResetTrialRequest {
  // Trial identifier
  string trial_id = 1;

  // Whether to re-execute initialization_actions
  bool execute_init_actions = 2;
}

message ResetTrialResponse {
  // Whether reset succeeded
  bool success = 1;

  // Error message if failed
  string error = 2;

  // State hash after reset
  string state_hash = 3;
}

// =============================================================================
// CleanupTrial - Forget a trial's registration
// =============================================================================

message CleanupTrialRequest {
  // Trial identifier
  string trial_id = 1;
}

message CleanupTrialResponse {
  // Whether cleanup succeeded. Idempotent: true when trial was already absent.
  bool success = 1;

  // Error message if cleanup failed
  string error = 2;
}

// =============================================================================
// HealthCheck - Service health status
// =============================================================================

message HealthCheckRequest {}

message HealthCheckResponse {
  // Service status: "healthy", "degraded", "unhealthy"
  string status = 1;

  // Service version
  string version = 2;

  // Number of active trials
  int32 num_active_trials = 3;

  // DB Service connectivity
  bool db_service_connected = 4;

  // Available tool adapters
  repeated string available_adapters = 5;
}
