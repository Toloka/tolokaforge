combine:
  method: "weighted"
  weights:
    custom_checks: 1.0
  pass_threshold: 0.8

# No state_checks block — counter_reached_target() in checks.py owns the
# "counter >= 5" assertion (the engine has no gte operator; an `equals: 5` would
# tighten the original "at least 5" semantic), so there is no state source to declare.
custom_checks:
  enabled: true
  file: "checks.py"
  interface_version: "1.0"
  timeout_seconds: 10
  weight: 1.0
  fail_on_error: true
  relative_imports: []

transcript_rules: null
llm_judge: null