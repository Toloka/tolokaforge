combine:
  method: "weighted"
  weights:
    state_checks: 0.3
    custom_checks: 0.7
  pass_threshold: 0.8

state_checks:
  # No jsonpaths — counter_reached_target() in checks.py owns the "counter >= 5"
  # assertion (the engine has no gte operator; an `equals: 5` here would tighten
  # the original "at least 5" semantic).
  jsonpaths: []

custom_checks:
  enabled: true
  file: "checks.py"
  interface_version: "1.0"
  timeout_seconds: 10
  weight: 1.0
  fail_on_error: true
  relative_imports: []

transcript_rules: null
llm_judge: null