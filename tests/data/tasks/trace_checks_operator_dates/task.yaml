name: "Substrate differential: the date comparison operators"
category: test
description: |
  Substrate-parity fixture for the four `date_*` operators. Both trials book a
  flight and differ only in the departure date the booking carries, so the
  chronological comparison is the one fact a verdict can turn on. Not runnable
  end to end — the trials are authored in `trial.yaml` and replayed.

