task_id: "cascade_capa_remediation"
name: "Samples probe: CAPA remediation (both union branches + lot-consume + ATP cascade)"
description: >
  Non-scoring wire-shape probe derived from the manufacturing quality-remediation
  flow (policy stripped). A cooperative llm user-sim drives a long cascade one
  step at a time: read an order entity (get_entity_info), open a corrective
  action against a lot (create_capa, target=lot branch), then a SECOND corrective
  action against the order (create_capa, target=order branch) — exercising BOTH
  arms of the discriminated union back-to-back in one trial — mark two lots
  consumed (modify_lot, the consumed enum value), and finally recompute the SKU's
  inventory counters (modify_inventory, the ATP fan-in). Targets discriminated-
  union mis-shape across both branches, oneOf/$ref dialect handling, enum
  membership on lot status, id-threading from the entity read into every later
  call, and the long call-ordering / lifecycle dimension.
domain: ../../_shared/domain.yaml
max_turns: 20

initial_user_message: >
  Hi - I'm doing a quality remediation on order ORD-58 and I want to work through
  it one step at a time. Can we start by pulling up the order ORD-58 so I can
  confirm what we're working with?

initial_state: {}

tools:
  agent:
    enabled:
      - get_entity_info
      - create_capa
      - modify_lot
      - modify_inventory

user_simulator:
  mode: llm
  persona: cooperative
  backstory: >
    You are a quality engineer remediating order ORD-58 after a failed batch
    inspection. You want the assistant to work through this one step at a time,
    waiting for it to confirm each before you ask for the next:
    (1) first, look up the order ORD-58 so you can confirm it;
    (2) open a corrective action against lot LOT-77, with the reason "contaminated
        material found during batch inspection";
    (3) now open a separate corrective action against the order itself, order
        ORD-58, with the reason "two lots quarantined, batch yield below
        threshold";
    (4) the two affected lots are being scrapped, so mark them consumed: lot
        LOT-77 now has 0 remaining and is consumed, and lot LOT-78 now has 0
        remaining and is consumed;
    (5) finally recompute the inventory for part SKU-NOVA after the scrap: in
        stock 240, reserved 0, available to promise 240.
    Give the assistant only the values above in plain words; never describe how to
    format anything and never spell out any structure. Once all five steps are
    confirmed, thank the assistant and end. Keep replies short.

metadata:
  expected_failure_modes:
    - discriminated_union
    - gemini_schema_oneof_ref
    - dict_flatten
    - stringified_dict
    - enum_membership
    - lifecycle_threading
    - fan_in
  tags:
    - smoke
    - wire-probe
    - non-scoring
    - multi-turn
    - manufacturing-derived
    - cascade

grading: "grading.yaml"
