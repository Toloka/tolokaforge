combine:
  method: weighted
  weights:
    trace_checks: 1.0
  pass_threshold: 0.8

# Each trial below passes exactly one of these two constraints, so an unweighted
# fold scores both of them 1/2. Only reading the weights tells them apart: 3/4
# for the trial that verified identity, 1/4 for the one that only logged a note.
trace_checks:
  constraints:
    - id: identity_was_verified
      description: "the agent verified who it was talking to before disclosing anything"
      weight: 3.0
      require:
        present:
          match:
            kind: tool_call
            tool: { equals: verify_identity }
    - id: the_call_was_logged
      description: "the agent left a note on the account"
      weight: 1.0
      require:
        present:
          match:
            kind: tool_call
            tool: { equals: log_contact_note }
