combine:
  method: weighted
  weights:
    state_checks: 1.0
  pass_threshold: 0.8

state_checks:
  hash:
    enabled: true
    expect_initial_state: true
    weight: 0.25
  jsonpaths:
    - path: "$.db.orders[0].status"
      equals: shipped
      description: order O1 reached shipped
    - path: "$.db.orders[0].carrier"
      equals: fastship
      description: order O1 went out with FastShip
