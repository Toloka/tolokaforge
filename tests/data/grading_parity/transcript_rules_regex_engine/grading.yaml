combine:
  method: weighted
  weights:
    transcript_rules: 1.0
  pass_threshold: 0.8

# The two trials differ only in whether the agent reads back the card's last digit,
# an Arabic-Indic four. The linear default reads \d as ASCII only and passes both
# trials, so a build ignoring the declared engine scores them identically; the
# backtracking engine reads the Arabic-Indic four as \d, which is the one reading
# telling them apart.
transcript_rules:
  regex_engine: backtracking
  disallow_regex:
    - 'card ending \d'
