combine:
  method: weighted
  weights:
    transcript_rules: 1.0
  pass_threshold: 0.8

# The two trials differ only in which digit the agent reads back: an Arabic-Indic
# four or an ASCII 4. The backtracking engine reads both as \d and fails both
# trials, so a build ignoring the declared engine scores them identically; the
# linear engine reads \d as ASCII only, which is the one reading telling them apart.
transcript_rules:
  regex_engine: linear
  disallow_regex:
    - 'card ending \d'
