tools:
  agent:
    enabled:
    - http_request
    - write_file
    http_request:
      allowed_hosts:
      - app-service:8000
  user:
    enabled: []
policies:
  guidance:
  - Reach the API with the `http_request` tool against `http://app-service:8000` —
    GET the reason-code catalog to find the contamination code before opening the
    action; do not guess it.
  - Open the corrective action by POSTing to the lot's corrective-actions endpoint;
    it must reference lot 7 and the contamination reason code.
  - Open exactly one corrective action for the lot. If the POST returns a success
    response, do not send it again — read the response to confirm, then move on to
    writing the completion report.
