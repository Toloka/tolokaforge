task_id: lot_ops_01
trial_index: 4
category: multi_service
description: A shop-floor operator reports a contamination issue on a production lot.
  The agent must look the lot up over the manufacturing REST API, open a corrective-action
  record with the right reason code, and write an operator-facing completion report.
