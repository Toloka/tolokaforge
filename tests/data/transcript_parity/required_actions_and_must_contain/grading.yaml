combine:
  method: weighted
  weights:
    transcript_rules: 1.0
  pass_threshold: 0.8

transcript_rules:
  must_contain:
    - "Ticket closed"
  required_actions:
    - action_id: issue_the_refund
      requestor: assistant
      name: issue_refund
      arguments:
        order_id: O-001
      compare_args:
        - order_id
