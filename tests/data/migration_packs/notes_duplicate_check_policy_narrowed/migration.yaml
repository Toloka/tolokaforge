migrations:
  - criterion: checked_duplicates_first
    mode: narrowed
    by: [the_notes_were_listed_before_the_note_was_added]
    was:
      kind: binary
      required: true
      weight: 1.0
      description: >
        Before calling add_note, the assistant called list_notes to check for duplicates AND
        warned the user that a similar note ("Team stand-up", "Daily stand-up at 9:30 in the
        Maple room.") already exists. If the assistant called add_note without first checking
        for duplicates, or did not surface the existing near-duplicate, this criterion is NOT
        met.
    residual:
      kind: text
      reason: >
        The judge still reads whether the assistant warned the user about the near-duplicate,
        which no trace constraint can check from the tool record alone.
    combine_weights: { llm_judge: 0.5, trace_checks: 0.5 }
    evidence:
      corpus: tests/data/migration_corpora/notes_duplicate_check
      observations: 17
      kappa: 1.0
