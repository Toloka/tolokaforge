entry_id: small_rubrics_case_04
rubric:
  criteria:
    - id: intent_clarified
      description: 'Assistant clarified ambiguous intent before acting.'
      kind: binary
      weight: 1.0
    - id: escalation_appropriate
      description: 'Escalation happened at the right point.'
      kind: binary
      weight: 1.0
    - id: sla_within
      description: 'Response landed within the SLA window.'
      kind: graded
      weight: 1.0
agent_system_prompt: 'You are a customer-service assistant. (small_rubrics_case_04)'
transcript:
  - role: user
    content: 'Hi, I need help with order 42 — I never got the refund. (small_rubrics_case_04)'
  - role: assistant
    content: 'Confirmed — the refund of $19.99 is processed. Anything else?'
state_diff: null
disable_knowledge_search: false
custom_system_prompt: null
include_agent_system_prompt: true
judge_scripts:
  single_shot_rubric:
    - - name: submit_report
        arguments:
            reasons: 'overall summary — fixture-authored deterministic verdict'
            intent_clarified: true
            intent_clarified_justification: "because intent_clarified\nVERDICT: MET"
            escalation_appropriate: true
            escalation_appropriate_justification: "because escalation_appropriate\nVERDICT: MET"
            sla_within: 0.9
            sla_within_justification: "because sla_within\nSCORE: 0.9"
  agentic_rubric:
    - - name: draft_report
        arguments:
            reasons: 'draft summary — agentic (pre-critique)'
            intent_clarified: true
            intent_clarified_justification: "because intent_clarified\nVERDICT: MET"
            escalation_appropriate: true
            escalation_appropriate_justification: "because escalation_appropriate\nVERDICT: MET"
            sla_within: 0.9
            sla_within_justification: "because sla_within\nSCORE: 0.9"
    - - name: submit_report
        arguments:
            reasons: 'overall summary — agentic (post-critique)'
            intent_clarified: true
            intent_clarified_justification: "because intent_clarified\nVERDICT: MET"
            escalation_appropriate: true
            escalation_appropriate_justification: "because escalation_appropriate\nVERDICT: MET"
            sla_within: 0.9
            sla_within_justification: "because sla_within\nSCORE: 0.9"
judge_scripts_per_chunk:
  chunked_rubric:
    - - - name: submit_report
          arguments:
              reasons: 'overall summary — chunked'
              intent_clarified: true
              intent_clarified_justification: "because intent_clarified\nVERDICT: MET"
              escalation_appropriate: true
              escalation_appropriate_justification: "because escalation_appropriate\nVERDICT: MET"
              sla_within: 0.9
              sla_within_justification: "because sla_within\nSCORE: 0.9"
