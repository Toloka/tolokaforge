  - id: identity_verified
    description: Assistant verified the customer identity before acting.
    kind: binary
    weight: 1.0
  - id: stock_updated
    description: Stock levels were adjusted in the ledger.
    kind: binary
    weight: 1.0
  - id: order_shipped
    description: Order marked as shipped in the system.
    kind: binary
    weight: 1.0
  - id: cancellation_confirmed
    description: Cancellation was confirmed to the customer.
    kind: binary
    weight: 1.0
  - id: question_answered
    description: Customer question was answered directly.
    kind: graded
    weight: 1.0
  - id: intent_clarified
    description: Assistant clarified ambiguous intent before acting.
    kind: binary
    weight: 1.0
  - id: escalation_appropriate
    description: Escalation happened at the right point.
    kind: binary
    weight: 1.0
  - id: sla_within
    description: Response landed within the SLA window.
    kind: graded
    weight: 1.0
  - id: greeting_present
    description: Response opened with a greeting.
    kind: binary
    weight: 1.0
