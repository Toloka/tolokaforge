entry_id: large_rubrics_case_03
rubric:
  criteria:
    - id: escalation_appropriate
      description: 'Escalation happened at the right point.'
      kind: binary
      weight: 1.0
    - id: sla_within
      description: 'Response landed within the SLA window.'
      kind: graded
      weight: 1.0
    - id: greeting_present
      description: 'Response opened with a greeting.'
      kind: binary
      weight: 1.0
    - id: field_validated
      description: 'Input fields were validated.'
      kind: binary
      weight: 1.0
    - id: no_pii_leaked
      description: 'No PII appeared in the response.'
      kind: binary
      weight: 1.0
    - id: tool_called_once
      description: 'The relevant tool was called exactly once.'
      kind: binary
      weight: 1.0
    - id: summary_provided
      description: 'A concise summary was provided to the customer.'
      kind: graded
      weight: 1.0
    - id: channel_appropriate
      description: 'Answer used the channel-appropriate wording.'
      kind: binary
      weight: 1.0
    - id: outcome_communicated
      description: 'Final outcome was communicated in plain terms.'
      kind: graded
      weight: 1.0
    - id: refund_done
      description: 'Refund was issued to the customer.'
      kind: binary
      weight: 1.0
    - id: tone
      description: 'Assistant remained polite and professional.'
      kind: graded
      weight: 1.0
agent_system_prompt: 'You are a customer-service assistant. (large_rubrics_case_03)'
transcript:
  - role: user
    content: 'Hi, I need help with order 42 — I never got the refund. (large_rubrics_case_03)'
  - role: assistant
    content: 'Confirmed — the refund of $19.99 is processed. Anything else?'
state_diff: null
disable_knowledge_search: false
custom_system_prompt: null
include_agent_system_prompt: true
judge_scripts:
  single_shot_rubric:
    - - name: submit_report
        arguments:
            reasons: 'overall summary — fixture-authored deterministic verdict'
            escalation_appropriate: false
            escalation_appropriate_justification: "because escalation_appropriate\nVERDICT: NOT MET"
            sla_within: 0.2
            sla_within_justification: "because sla_within\nSCORE: 0.2"
            greeting_present: false
            greeting_present_justification: "because greeting_present\nVERDICT: NOT MET"
            field_validated: false
            field_validated_justification: "because field_validated\nVERDICT: NOT MET"
            no_pii_leaked: false
            no_pii_leaked_justification: "because no_pii_leaked\nVERDICT: NOT MET"
            tool_called_once: false
            tool_called_once_justification: "because tool_called_once\nVERDICT: NOT MET"
            summary_provided: 0.2
            summary_provided_justification: "because summary_provided\nSCORE: 0.2"
            channel_appropriate: false
            channel_appropriate_justification: "because channel_appropriate\nVERDICT: NOT MET"
            outcome_communicated: 0.2
            outcome_communicated_justification: "because outcome_communicated\nSCORE: 0.2"
            refund_done: false
            refund_done_justification: "because refund_done\nVERDICT: NOT MET"
            tone: 0.2
            tone_justification: "because tone\nSCORE: 0.2"
