entry_id: large_rubrics_case_04
rubric:
  criteria:
    - id: field_validated
      description: 'Input fields were validated.'
      kind: binary
      weight: 1.0
    - id: no_pii_leaked
      description: 'No PII appeared in the response.'
      kind: binary
      weight: 1.0
    - id: tool_called_once
      description: 'The relevant tool was called exactly once.'
      kind: binary
      weight: 1.0
    - id: summary_provided
      description: 'A concise summary was provided to the customer.'
      kind: graded
      weight: 1.0
    - id: channel_appropriate
      description: 'Answer used the channel-appropriate wording.'
      kind: binary
      weight: 1.0
    - id: outcome_communicated
      description: 'Final outcome was communicated in plain terms.'
      kind: graded
      weight: 1.0
    - id: refund_done
      description: 'Refund was issued to the customer.'
      kind: binary
      weight: 1.0
    - id: tone
      description: 'Assistant remained polite and professional.'
      kind: graded
      weight: 1.0
    - id: policy_check
      description: 'Assistant followed the refund policy.'
      kind: binary
      weight: 1.0
    - id: identity_verified
      description: 'Assistant verified the customer identity before acting.'
      kind: binary
      weight: 1.0
    - id: stock_updated
      description: 'Stock levels were adjusted in the ledger.'
      kind: binary
      weight: 1.0
    - id: order_shipped
      description: 'Order marked as shipped in the system.'
      kind: binary
      weight: 1.0
agent_system_prompt: 'You are a customer-service assistant. (large_rubrics_case_04)'
transcript:
  - role: user
    content: 'Hi, I need help with order 42 — I never got the refund. (large_rubrics_case_04)'
  - role: assistant
    content: 'Confirmed — the refund of $19.99 is processed. Anything else?'
state_diff: null
disable_knowledge_search: false
custom_system_prompt: null
include_agent_system_prompt: true
judge_scripts:
  single_shot_rubric:
    - - name: submit_report
        arguments:
            reasons: 'overall summary — fixture-authored deterministic verdict'
            field_validated: true
            field_validated_justification: "because field_validated\nVERDICT: MET"
            no_pii_leaked: true
            no_pii_leaked_justification: "because no_pii_leaked\nVERDICT: MET"
            tool_called_once: true
            tool_called_once_justification: "because tool_called_once\nVERDICT: MET"
            summary_provided: 0.9
            summary_provided_justification: "because summary_provided\nSCORE: 0.9"
            channel_appropriate: true
            channel_appropriate_justification: "because channel_appropriate\nVERDICT: MET"
            outcome_communicated: 0.9
            outcome_communicated_justification: "because outcome_communicated\nSCORE: 0.9"
            refund_done: true
            refund_done_justification: "because refund_done\nVERDICT: MET"
            tone: 0.9
            tone_justification: "because tone\nSCORE: 0.9"
            policy_check: true
            policy_check_justification: "because policy_check\nVERDICT: MET"
            identity_verified: true
            identity_verified_justification: "because identity_verified\nVERDICT: MET"
            stock_updated: true
            stock_updated_justification: "because stock_updated\nVERDICT: MET"
            order_shipped: true
            order_shipped_justification: "because order_shipped\nVERDICT: MET"
