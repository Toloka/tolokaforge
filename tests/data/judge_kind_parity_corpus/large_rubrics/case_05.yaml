entry_id: large_rubrics_case_05
rubric:
  criteria:
    - id: summary_provided
      description: 'A concise summary was provided to the customer.'
      kind: graded
      weight: 1.0
    - id: channel_appropriate
      description: 'Answer used the channel-appropriate wording.'
      kind: binary
      weight: 1.0
    - id: outcome_communicated
      description: 'Final outcome was communicated in plain terms.'
      kind: graded
      weight: 1.0
    - id: refund_done
      description: 'Refund was issued to the customer.'
      kind: binary
      weight: 1.0
    - id: tone
      description: 'Assistant remained polite and professional.'
      kind: graded
      weight: 1.0
    - id: policy_check
      description: 'Assistant followed the refund policy.'
      kind: binary
      weight: 1.0
    - id: identity_verified
      description: 'Assistant verified the customer identity before acting.'
      kind: binary
      weight: 1.0
    - id: stock_updated
      description: 'Stock levels were adjusted in the ledger.'
      kind: binary
      weight: 1.0
    - id: order_shipped
      description: 'Order marked as shipped in the system.'
      kind: binary
      weight: 1.0
    - id: cancellation_confirmed
      description: 'Cancellation was confirmed to the customer.'
      kind: binary
      weight: 1.0
    - id: question_answered
      description: 'Customer question was answered directly.'
      kind: graded
      weight: 1.0
    - id: intent_clarified
      description: 'Assistant clarified ambiguous intent before acting.'
      kind: binary
      weight: 1.0
    - id: escalation_appropriate
      description: 'Escalation happened at the right point.'
      kind: binary
      weight: 1.0
agent_system_prompt: 'You are a customer-service assistant. (large_rubrics_case_05)'
transcript:
  - role: user
    content: 'Hi, I need help with order 42 — I never got the refund. (large_rubrics_case_05)'
  - role: assistant
    content: 'Confirmed — the refund of $19.99 is processed. Anything else?'
