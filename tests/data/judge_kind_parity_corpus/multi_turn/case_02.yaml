entry_id: multi_turn_case_02
rubric:
  criteria:
    - id: escalation_appropriate
      description: 'Escalation happened at the right point.'
      kind: binary
      weight: 1.0
    - id: sla_within
      description: 'Response landed within the SLA window.'
      kind: graded
      weight: 1.0
    - id: greeting_present
      description: 'Response opened with a greeting.'
      kind: binary
      weight: 1.0
    - id: refund_done
      description: 'Refund was issued to the customer.'
      kind: binary
      weight: 1.0
agent_system_prompt: 'You are a customer-service assistant. (multi_turn_case_02)'
transcript:
  - role: user
    content: 'I want to cancel my subscription. (multi_turn_case_02)'
  - role: assistant
    content: 'I can help. Which subscription — the Basic or the Pro plan?'
  - role: user
    content: 'The Pro plan.'
  - role: assistant
    content: 'Understood. Cancelling the Pro plan effective end of billing cycle.'
  - role: user
    content: 'Perfect, thank you.'
state_diff: null
disable_knowledge_search: false
custom_system_prompt: null
include_agent_system_prompt: true
judge_scripts:
  single_shot_rubric:
    - - name: submit_report
        arguments:
            reasons: 'overall summary — fixture-authored deterministic verdict'
            escalation_appropriate: true
            escalation_appropriate_justification: "because escalation_appropriate\nVERDICT: MET"
            sla_within: 0.9
            sla_within_justification: "because sla_within\nSCORE: 0.9"
            greeting_present: true
            greeting_present_justification: "because greeting_present\nVERDICT: MET"
            refund_done: true
            refund_done_justification: "because refund_done\nVERDICT: MET"
judge_scripts_per_chunk:
  chunked_rubric:
    - - - name: submit_report
          arguments:
              reasons: 'overall summary — chunked'
              escalation_appropriate: true
              escalation_appropriate_justification: "because escalation_appropriate\nVERDICT: MET"
              sla_within: 0.9
              sla_within_justification: "because sla_within\nSCORE: 0.9"
              greeting_present: true
              greeting_present_justification: "because greeting_present\nVERDICT: MET"
              refund_done: true
              refund_done_justification: "because refund_done\nVERDICT: MET"
