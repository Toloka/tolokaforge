weights:
  state_checks: 1.0
  transcript_rules: 1.0
  trace_checks: 1.0
  llm_judge: 1.0
  custom_checks: 1.0
state_checks:
  hash_enabled: true
  expect_initial_state: true
  hash_weight: 0.5
  jsonpath_checks:
    - path: "$.db.orders[0].status"
      equals: shipped
      description: order O1 is shipped
transcript_rules:
  must_contain:
    - "Refund issued"
trace_checks:
  constraints:
    - id: every_report_written_was_read_first
      description: "the agent reads a report before it overwrites it, within the opening turns"
      within:
        first_turn: 0
        last_turn: 3
      bind:
        match:
          kind: tool_call
          tool: { equals: write_file }
        values:
          written: { field: args.path }
      require:
        before:
          left:
            quantifier: any
            match:
              kind: tool_call
              tool: { equals: read_file }
              args: { path: { equals_binding: written } }
          right:
            quantifier: any
            match:
              kind: tool_call
              tool: { equals: write_file }
              args: { path: { equals_binding: written } }
llm_judge:
  rubric:
    criteria:
      - id: ok
        description: Task completed
        kind: binary
        weight: 1.0
custom_checks:
  enabled: true
  file: checks.py
