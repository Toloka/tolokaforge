services:
  default:
    image: nginx:alpine
    ports:
      - "50051"
    depends_on:
      db-service:
        condition: service_healthy

  db-service:
    image: nginx:alpine
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:80/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
