[project]
name = "copilot"
version = "0.1.0"
description = "Intervention Copilot — reference LLM and Human participants for tolokaforge's Trial Session gate."
requires-python = ">=3.10"
dependencies = [
    "tolokaforge",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
copilot-demo = "copilot.demo.attach_recorded:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests requiring no external services",
]
