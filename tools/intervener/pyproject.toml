[project]
name = "intervener"
version = "0.1.0"
description = "Reference LLM and Human participants (interveners) for tolokaforge's Trial Session gate."
requires-python = ">=3.10"
dependencies = [
    "tolokaforge",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
intervener-demo = "intervener.demo.attach_recorded:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intervener"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests requiring no external services",
]
