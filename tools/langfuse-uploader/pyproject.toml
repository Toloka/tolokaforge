[project]
name = "langfuse-uploader"
version = "0.1.0"
description = "Upload tolokaforge trial bundles into Langfuse as traces"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "typer>=0.12.5,<0.13",
    "click>=8.0.0,<8.2.0",
    "rich>=13.0.0",
]

[project.scripts]
langfuse-uploader = "langfuse_uploader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
