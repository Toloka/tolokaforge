[project]
name = "automation"
version = "0.1.0"
description = "Arena model automation: observe a candidate model's tool-calling quirks, resolve a policy + certificate, and finalize the integration PR."
requires-python = ">=3.10"
dependencies = [
    "tolokaforge",
    "typer>=0.12.5,<0.13",
    "click>=8.0.0,<8.2.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
automation = "automation.cli:app"

[project.optional-dependencies]
# The transcript projection, the outbound sentinel and the OTLP writer live in the
# tolokaforge-langfuse wheel; `automation langfuse-upload` is the only command that needs
# them, and it imports them inside its functions so the rest of the tool loads without it.
otel = [
    "tolokaforge-langfuse>=0.1.0,<1.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the package including the prompt templates under src/automation/prompts/.
packages = ["src/automation"]
