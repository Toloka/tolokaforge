[project]
name = "dev-mcp"
version = "0.1.0"
description = "Dev MCP server for AI agent interaction with the tolokaforge repository"
requires-python = ">=3.10"
dependencies = [
    # Upper-bounded on the major: server.py imports ``mcp.server.fastmcp``,
    # which does not exist in 2.x — FastMCP moved.
    "mcp>=1.0,<2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
dev-mcp = "dev_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
