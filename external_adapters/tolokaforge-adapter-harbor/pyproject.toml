[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tolokaforge-adapter-harbor"
version = "0.1.0"
description = "Harbor (Terminal-Bench 2.0) adapter plugin for tolokaforge"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "tolokaforge",
    "tolokaforge-coding-harnesses",
    "tolokaforge-adapter-terminal-bench",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
]

[project.entry-points."tolokaforge.adapters"]
harbor = "tolokaforge_adapter_harbor.adapter:HarborAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/tolokaforge_adapter_harbor"]
