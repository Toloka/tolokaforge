[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tolokaforge"
version = "0.5.0"
description = "Tolokaforge - LLM Tool-Use Benchmarking Harness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Renaud de la Gueronniere"},
    {name = "Tolokaforge Contributors"},
]
maintainers = [
    {name = "Renaud de la Gueronniere"},
]
keywords = ["llm", "benchmark", "tool-use", "agents", "evaluation", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core LLM integration
    "litellm>=1.83.14,<2.0.0",
    # Data validation and schemas
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "jsonschema>=4.20.0",
    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
    # JSON processing
    "jsonpath-ng>=1.6.0",
    # HTTP client
    "httpx>=0.25.0",
    # Utilities
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.0",
    "docstring_parser>=0.16",
    "deepdiff>=6.0.0",
    "toml>=0.10.0",
    "addict>=2.4.0",
    "odata-query>=0.10.0",
    "starlette>=0.52.1",
    "sqlalchemy>=2.0.48",
    "typesense>=2.0.0",
    "structlog>=24.0.0",
    # Docker runtime — the only supported runtime for `tolokaforge run`.
    # Previously optional, promoted to core because every `tolokaforge run`
    # invocation requires these (there is no in-process runtime).
    "docker>=7.0.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    # MCP server support — needed by any task that declares an mcp_server.py.
    # Previously optional, promoted to core because the recommended task
    # authoring pattern (FastMCP server subprocess) requires it.
    "mcp>=0.1.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
    "pillow>=12.1.0",
]
server = [
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
]
rag = [
    "rank-bm25>=0.2.2",
]
office = [
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.21",
]
terminal_bench = [
    "tolokaforge-adapter-terminal-bench",
]
adapters = [
    "tolokaforge[terminal_bench]",
]
all = [
    "tolokaforge[browser,server,rag,office,adapters]",
]

[project.urls]
Homepage = "https://github.com/Toloka/tolokaforge"
Repository = "https://github.com/Toloka/tolokaforge"
Documentation = "https://github.com/Toloka/tolokaforge/tree/main/docs"
Issues = "https://github.com/Toloka/tolokaforge/issues"

[project.scripts]
tolokaforge = "tolokaforge.cli.main:cli"

[tool.hatch.build]
exclude = [
    "tasks/**",
    "scratchpad/**",
    "demos/**",
    "external_adapters/**",
]

[tool.hatch.build.targets.wheel]
packages = ["tolokaforge"]

[tool.hatch.build.targets.sdist]

[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = '''
(
  contrib
  | tests/data/projects
  | external_adapters
  | examples/terminal_bench
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "**/node_modules",
    "**/__pycache__", 
    "contrib",
    "tests/data/projects", 
    "external_adapters",
    "examples/terminal_bench",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "E402",  # module-import-not-at-top (needed for some init files)
    "B904",  # raise-without-from-inside-except (too noisy, often intentional)
    "B905",  # zip-without-explicit-strict (strict param not always needed)
    "B008",  # function-call-in-default-argument (standard pattern for Typer/FastAPI)
    "SIM101",  # duplicate-isinstance-call (sometimes clearer to be explicit)
    "SIM102",  # collapsible-if (sometimes less readable when collapsed)
    "SIM103",  # needless-bool (sometimes clearer to be explicit)
    "SIM105",  # suppressible-exception (contextlib.suppress not always clearer)
    "SIM108",  # if-else-block-instead-of-if-exp (ternary not always clearer)
    "SIM116",  # if-else-block-instead-of-dict-lookup (not always applicable)
    "SIM117",  # multiple-with-statements (sometimes more readable separated)
    "UP007",  # non-pep604-annotation-union (Union[] style for recursive types)
]
fixable = ["ALL"]

[tool.ruff.lint.isort]

[tool.ruff.format]
# Use double quotes for strings (matches black default)
quote-style = "double"
# Indent with spaces (matches black default)
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["tests/data/projects/*/tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    # testcontainers internal — uses deprecated decorator; no fix on our side
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers.core.waiting_utils",
    # litellm uses Pydantic V1 APIs internally; our code uses V2
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    # Dependencies use datetime.utcnow(); 0 occurrences in our code
    "ignore:datetime\\.datetime\\.utcnow:DeprecationWarning",
    # pytest-asyncio internal; our code fixed in #57, suppression for deps only
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (with services)",
    "slow: marks tests as slow (> 5 seconds)",
    "requires_api: marks tests requiring API keys",
    "requires_docker: marks tests requiring Docker",
    "requires_browser: marks tests requiring Playwright/Chromium browser",
    "docker: marks tests that require Docker daemon (real container tests)",
    "requires_postgres: marks tests requiring a reachable Postgres instance",
    "grading: marks tests related to grading system",
    "security: marks tests for security validation",
    "performance: marks tests for performance benchmarking",
    "llm: marks tests that call real LLM providers",
    "canonical: marks canonization snapshot tests",
]

[tool.coverage.run]
source = ["tolokaforge"]
omit = [
    "tolokaforge/*/tests/*",
    "*/test_*",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*/__main__.py",
    # gRPC service implementations (require running infrastructure)
    "tolokaforge/runner/service.py",
    # HTTP clients and tool factory (require running services / gRPC)
    "tolokaforge/runner/db_client.py",
    "tolokaforge/runner/db_proxy.py",
    "tolokaforge/runner/rag_client.py",
    "tolokaforge/runner/tool_factory.py",
    # Docker runtime clients
    "tolokaforge/core/docker_runtime.py",
    "tolokaforge/core/docker_adapter.py",
    # Docker SDK wrappers (require Docker daemon)
    "tolokaforge/docker/builder.py",
    "tolokaforge/docker/container.py",
    "tolokaforge/docker/image.py",
    "tolokaforge/docker/network.py",
    "tolokaforge/docker/logging.py",
    "tolokaforge/docker/wait_for_services.py",
    "tolokaforge/docker/stacks/*",
    # Docker runtime health/registry (require running containers)
    "tolokaforge/docker/health.py",
    "tolokaforge/docker/registry.py",
    # FastAPI app entry points (require service context)
    "tolokaforge/env/json_db_service/app.py",
    "tolokaforge/env/mock_web_service/app.py",
    "tolokaforge/env/rag_service/app.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# =============================================================================
# Release tooling (commitizen) — drives the `Release (cz bump)` workflow.
# `cz bump` reads/writes the single version literal in [project] version,
# regenerates CHANGELOG.md from Conventional Commits, commits, and tags vX.Y.Z.
# See CONTRIBUTING.md ("Cutting a Release").
# =============================================================================

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"          # read/write [project] version in place — single source of truth
tag_format = "v$version"             # matches the v* triggers in publish/release-gate workflows
update_changelog_on_bump = true
changelog_incremental = true         # only prepend new sections; never rewrite hand-written history
major_version_zero = true            # project is pre-1.0/unstable: breaking changes bump the minor
                                     # (0.2.x -> 0.3.0) and stay in 0.x until we deliberately cut 1.0.0
bump_message = "chore(release): bump version to $new_version"
annotated_tag = true

# Keep uv.lock's own `tolokaforge` package version in step with [project] version.
# cz bump rewrites [project] version but does NOT relock; without this the lockfile
# would pin the previous version every release. pre_bump_hooks run after the version
# is written and before cz's commit, so we relock and stage uv.lock — cz then folds
# it into the same release commit. (cz only auto-stages its own version files, so the
# explicit `git add` is required.)
pre_bump_hooks = [
    "uv lock",
    "git add -- uv.lock",
]

# =============================================================================
# Development Dependencies (PEP 735)
# =============================================================================

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-docker>=2.0.0",
    "testcontainers>=3.7.0",
    "psutil>=5.9.0",
    "black==26.3.1",
    "ruff==0.14.4",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "playwright>=1.40.0",
    "pillow>=12.1.0",
    "docker>=7.0.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "rank-bm25>=0.2.2",
    "mcp>=0.1.0",
    "build>=1.0.0",
    "commitizen>=4.0.0",
    "psycopg[binary]>=3.2.0",
    "tolokaforge-adapter-terminal-bench",
    "dev-mcp",
]

# =============================================================================
# UV Configuration
# =============================================================================
# uv is the recommended package manager for this project
# See: https://docs.astral.sh/uv/

[tool.uv]
# Keep everyone (CI + every laptop) on a compatible uv so the committed uv.lock is
# reproducible. uv refuses to run outside this range and tells the dev to align,
# which prevents "I relocked and now CI's `uv sync --locked` rejects my lock"
# surprises. A narrow range (not one exact version) avoids forcing a reinstall on
# every uv patch; the CI pin in .github/workflows/ci.yml lives inside this range.
required-version = ">=0.9.5,<0.10"

[tool.uv.workspace]
members = [
    "tools/dev-mcp",
    "tools/pricing-updater",
    "tools/rubric-calibrator",
    "external_adapters/tolokaforge-adapter-terminal-bench",
]

[tool.uv.sources]
dev-mcp = { workspace = true }
rubric-calibrator = { workspace = true }
tolokaforge = { workspace = true }
tolokaforge-adapter-terminal-bench = { workspace = true }

# PyPI as primary index for cross-platform compatibility
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
