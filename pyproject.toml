[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tolokaforge"
version = "0.21.2"
description = "Tolokaforge - LLM Tool-Use Benchmarking Harness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Renaud de la Gueronniere"},
    {name = "Tolokaforge Contributors"},
]
maintainers = [
    {name = "Renaud de la Gueronniere"},
]
keywords = ["llm", "benchmark", "tool-use", "agents", "evaluation", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Model data + per-model policy subclasses (see ADR-0030). Ships the
    # bundled ``pricing.json``, ``model_presets.yaml``, ``providers.yaml``,
    # the ``ModelCertificate`` registry, and the per-model policy subclasses
    # the engine reaches through its entry-point registry at
    # :mod:`tolokaforge.core.model_data`.
    "tolokaforge-models>=1.0.0,<2.0.0",
    # Coding-harness registry, spec models and adapter-support mixin (see
    # ADR-0039). Imported unconditionally by :mod:`tolokaforge.adapters.native`
    # and :mod:`tolokaforge.adapters.native_harness_synthesis`, so a headless
    # ``pip install tolokaforge`` needs the sibling wheel on ``sys.path`` too.
    "tolokaforge-coding-harnesses>=0.1.0,<1.0.0",
    # Core LLM integration
    "litellm>=1.83.14,!=1.92.0,<2.0.0",
    # Data validation and schemas
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "jsonschema>=4.20.0",
    # PEP 440 specifier parsing — used by ``tolokaforge.core.model_data`` to
    # validate ``minimum_engine_version`` on the resolved models fingerprint.
    # Kept as a direct dep so a downstream prune of ``black`` / ``build`` cannot
    # quietly remove ``packaging`` from the resolved set.
    "packaging>=24.0",
    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    # CLI — plain-text argument parsing. Rich and other terminal-UI deps
    # live in [project.optional-dependencies].dx so headless-server
    # installs don't pull them in.
    # NB: capped at <8.2 while click-repl 0.3.0 (the latest) references
    # `ctx.protected_args` as a settable property. Click 8.2 removed that
    # setter, so click-repl blows up at REPL entry. Lift the cap when a
    # click-repl release (or a maintained fork) restores compatibility.
    "click>=8.1.0,<8.2",
    # JSON processing
    "jsonpath-ng>=1.6.0",
    # HTTP client
    "httpx>=0.25.0",
    # Utilities
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.0",
    "docstring_parser>=0.16",
    "deepdiff>=6.0.0",
    "toml>=0.10.0",
    "addict>=2.4.0",
    "starlette>=0.52.1",
    "typesense>=2.0.0",
    "structlog>=24.0.0",
    # Docker runtime — the only supported runtime for `tolokaforge run`.
    # Previously optional, promoted to core because every `tolokaforge run`
    # invocation requires these (there is no in-process runtime).
    "docker>=7.0.0",
    # ``tolokaforge/runner/runner_pb2_grpc.py`` was generated by
    # ``grpcio-tools==1.83.0``; at import time the generated module compares
    # the installed ``grpc.__version__`` against its ``GRPC_GENERATED_VERSION``
    # constant and raises ``RuntimeError`` if the runtime is older. The floor
    # must therefore track the grpcio-tools version used to regenerate the
    # stubs — bump both together when regenerating.
    "grpcio>=1.83.0",
    "grpcio-health-checking>=1.83.0",
    # The generated ``tolokaforge/runner/runner_pb2.py`` module declares a
    # ``ValidateProtobufRuntimeVersion(_runtime_version.Domain.PUBLIC, 7, 35, 1, …)``
    # call at import time (see the ``python -m grpc_tools.protoc`` output that
    # produced it), so any Python protobuf runtime older than 7.35.1 raises
    # ``TypeError: Descriptors cannot be created directly`` (or the analogous
    # runtime-version check) the moment the runner tries to import its wire
    # types. The grpcio floor above does not on its own force protobuf onto
    # the 7.x line — PyPI's resolver otherwise picks ``protobuf==6.x`` — so
    # pin the floor explicitly here. Same constraint the wheel-subset
    # ``[project.scripts] tolokaforge run-trial`` entry needs, and the reason
    # the runner Docker image never trips this today (it installs off a
    # locked wheel set, not a fresh PyPI resolve).
    "protobuf>=7.35.1",
    # Per-trial runtime backend uses testcontainers to materialise one
    # docker-compose project per trial. Imported at module level by
    # tolokaforge.core.per_trial_runtime, so it must ship with the wheel.
    "testcontainers>=4.14.2,<5",
    # MCP server support — needed by any task that declares an mcp_server.py,
    # which the recommended task authoring pattern (FastMCP server subprocess)
    # does.
    # Upper-bounded on the major: ``mcp.server.fastmcp``, the one module
    # ``core/tools_interface.py`` imports, does not exist in 2.x. The runner
    # image installs the wheel with pip and resolves this range itself rather
    # than reading uv.lock, so an unbounded range there resolves a version whose
    # every tool call fails inside the container while the host venv is fine.
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
# Terminal front-end (see ADR-0019). Users install with
# `pip install 'tolokaforge[dx]'`. Library-only installs
# (`pip install tolokaforge`) omit these — the `tolokaforge` console
# script's shim (`tolokaforge._entry:main`) prints an install hint if
# invoked without the extras present.
dx = [
    "rich>=13.0.0",
    "click-repl>=0.3.0",
    "prompt-toolkit>=3.0.51",
]
browser = [
    "playwright>=1.40.0",
    "pillow>=12.1.0",
]
server = [
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
]
# SSOT for the runner image's dependency surface. The runner's own harness
# imports come from [project.dependencies]; these are the domain-tool runtime
# deps that tool code extracted from tool_artifacts needs at grade time.
runner = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "python-jose>=3.3.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "sqlalchemy>=2.0.48",
    "odata-query>=0.10.0",
]
rag = [
    "rank-bm25>=0.2.2",
]
office = [
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.21",
]
terminal_bench = [
    "tolokaforge-adapter-terminal-bench",
]
adapters = [
    "tolokaforge[terminal_bench]",
]
all = [
    "tolokaforge[dx,browser,server,rag,office,adapters,runner]",
]

[project.urls]
Homepage = "https://github.com/Toloka/tolokaforge"
Repository = "https://github.com/Toloka/tolokaforge"
Documentation = "https://github.com/Toloka/tolokaforge/tree/main/docs"
Issues = "https://github.com/Toloka/tolokaforge/issues"

[project.scripts]
tolokaforge = "tolokaforge._entry:main"

[project.entry-points."tolokaforge.runtime_backends"]
shared = "tolokaforge.core.shared_stack_runtime:shared_runtime_backend_factory"
per_trial = "tolokaforge.core.per_trial_runtime:per_trial_runtime_backend_factory"
in_memory = "tolokaforge.core.runtime:in_memory_runtime_backend_factory"

[project.entry-points."tolokaforge.trial_graders"]
runner_rpc = "tolokaforge.core.trial_grader:runner_rpc_trial_grader_factory"
# Second impl proves the plug-in seam accepts fundamentally different grader
# shapes (not just runner-RPC-with-different-transport). Ships with an unwired
# default judge dispatch — see JudgeBackedTrialGrader docstring and ADR-0038.
judge_only = "tolokaforge.core.trial_grader:judge_backed_trial_grader_factory"
# Third impl — dials the standalone tolokaforge.grader service (ADR-0038 P2).
# Same call shape as runner_rpc, but bound to the grader service's address
# instead of the runner's; enables independent deploy and independent scale.
grader_rpc = "tolokaforge.core.trial_grader:grader_rpc_trial_grader_factory"
# Fourth impl — queue-backed transport (ADR-0038 P3). Orchestrator worker
# publishes a grade job and blocks on a Future; a pool of grader workers
# consumes from the queue in parallel. Ships with an in-memory reference
# broker; Redis Streams / RabbitMQ / SQS backends plug behind the same
# GradeBroker Protocol as follow-ups.
queue = "tolokaforge.core.trial_grader:queue_trial_grader_factory"

[project.entry-points."tolokaforge.conductors"]
in_process = "tolokaforge.core.conductor:in_process_conductor_factory"
in_memory = "tolokaforge.core.conductor:in_memory_conductor_factory"

[project.entry-points."tolokaforge.service_readiness_probes"]
grpc = "tolokaforge.core.service_readiness:grpc_readiness_probe_factory"
http = "tolokaforge.core.service_readiness:http_readiness_probe_factory"
tcp = "tolokaforge.core.service_readiness:tcp_readiness_probe_factory"

[project.entry-points."tolokaforge.turn_policies"]
agent_only = "tolokaforge.core.actors.turn_policy:_agent_only_policy_factory"
conversational = "tolokaforge.core.actors.turn_policy:_conversational_policy_factory"

# ADR-0040 § "The single design abstraction" — GradingSubstrate implementations
# resolvable by name. Two implementations ship today (``in_process`` +
# ``live_callback``); ``trajectory_storage`` / ``snapshot`` / ``shared_mount``
# are reserved future substrates and register themselves when they ship (no
# framework change needed then).
[project.entry-points."tolokaforge.grading_substrates"]
in_process = "tolokaforge.core.grading.substrate:InProcessGradingSubstrate"
live_callback = "tolokaforge.core.grading.substrate_live:LiveRunnerCallbackGradingSubstrate"

# Custom-check executor Protocol (``tolokaforge/core/grading/check_runner.py``).
# ``check_runner`` is the production default (in-process ThreadPoolExecutor);
# ``in_memory`` is the deterministic fixture the canonical tests reach.
[project.entry-points."tolokaforge.custom_check_executors"]
check_runner = "tolokaforge.core.grading.check_runner:_check_runner_factory"
in_memory = "tolokaforge.core.grading.check_runner:_in_memory_check_executor_factory"

# Judge model provider Protocol
# (``tolokaforge/core/grading/judge_model_provider.py``). ``litellm`` matches
# the underlying transport; a downstream ``openai_direct`` or ``vertex_ai``
# provider registers alongside without a framework PR.
[project.entry-points."tolokaforge.judge_model_providers"]
litellm = "tolokaforge.core.grading.default_judge_model_provider:_litellm_judge_model_provider_factory"

# Rubric evaluator Protocol
# (``tolokaforge/core/grading/rubric_evaluator.py``). ``llm_judge`` is the
# reference impl wrapping :class:`LLMJudge`; a downstream package registers
# an alternative evaluator (e.g. a deterministic ruleset over the transcript)
# alongside without a framework PR.
[project.entry-points."tolokaforge.rubric_evaluators"]
llm_judge = "tolokaforge.core.grading.default_rubric_evaluator:_llm_judge_rubric_evaluator_factory"

# Transcript-rule matcher Protocol
# (``tolokaforge/core/grading/transcript_rule_matcher.py``). ``default`` is
# the reference impl wrapping :func:`evaluate_transcript_rules`; a downstream
# package registers an alternative matcher (e.g. a stricter policy over the
# same rule vocabulary) alongside without a framework PR.
[project.entry-points."tolokaforge.transcript_rule_matchers"]
default = "tolokaforge.core.grading.default_transcript_rule_matcher:_default_transcript_rule_matcher_factory"

# State-check backend Protocol
# (``tolokaforge/core/grading/state_check_backend.py``). ``jsonpath`` scores
# jsonpath assertions against the substrate's STABLE DB view + filesystem;
# ``db_probes`` opens task-declared postgres connections and applies each
# probe's ``expect`` block. Hash grading is deliberately NOT registered
# here — its snapshot-and-replay semantics need write access to the trial's
# DB, so hash grading stays runner-integrated on
# ``RunnerServiceImpl._execute_hash_grading`` (see the seam module docstring
# and ``docs/GRADER_SERVICE.md`` § "Sub-component plug-in seams").
[project.entry-points."tolokaforge.state_check_backends"]
jsonpath = "tolokaforge.core.grading.default_state_check_backends:_jsonpath_state_check_backend_factory"
db_probes = "tolokaforge.core.grading.default_state_check_backends:_db_probes_state_check_backend_factory"

# Trace-check operator seam
# (``tolokaforge/core/grading/trace_check_operator.py``). Per-operator
# granularity: every operator a ``ValuePredicate`` may declare is one
# entry-point. A downstream package registering ``equals_semver`` alongside
# these defaults extends the trace-check vocabulary without a framework
# PR. The two binding operators are identified by the ``_binding`` suffix
# on the registered name (see ADR-0040); no marker
# attribute, no parallel registry.
[project.entry-points."tolokaforge.trace_check_operators"]
equals = "tolokaforge.core.grading.trace_check_operator:equals"
equals_ci = "tolokaforge.core.grading.trace_check_operator:equals_ci"
contains = "tolokaforge.core.grading.trace_check_operator:contains_op"
contains_ci = "tolokaforge.core.grading.trace_check_operator:contains_ci"
not_contains = "tolokaforge.core.grading.trace_check_operator:not_contains_op"
not_equals = "tolokaforge.core.grading.trace_check_operator:not_equals"
regex = "tolokaforge.core.grading.trace_check_operator:regex_matches"
not_regex = "tolokaforge.core.grading.trace_check_operator:not_regex_matches"
is_null = "tolokaforge.core.grading.trace_check_operator:is_null_stub"
omitted = "tolokaforge.core.grading.trace_check_operator:omitted_stub"
gt = "tolokaforge.core.grading.trace_check_operator:gt"
gte = "tolokaforge.core.grading.trace_check_operator:gte"
lt = "tolokaforge.core.grading.trace_check_operator:lt"
lte = "tolokaforge.core.grading.trace_check_operator:lte"
in_ = "tolokaforge.core.grading.trace_check_operator:in_op"
not_in = "tolokaforge.core.grading.trace_check_operator:not_in_op"
len_gt = "tolokaforge.core.grading.trace_check_operator:len_gt"
len_gte = "tolokaforge.core.grading.trace_check_operator:len_gte"
exists = "tolokaforge.core.grading.trace_check_operator:exists"
equals_binding = "tolokaforge.core.grading.trace_check_operator:equals_binding"
contains_binding = "tolokaforge.core.grading.trace_check_operator:contains_binding"

[tool.hatch.build]
exclude = [
    "tasks/**",
    "scratchpad/**",
    "demos/**",
    "external_adapters/**",
]

[tool.hatch.build.targets.wheel]
packages = ["tolokaforge"]

# Ship `.python-version` inside the built wheel as
# ``tolokaforge/_python_version.txt``. The repo-root dotfile is the
# single source of truth (dev, CI, docker-build all read it) — this
# force-include copies it into the wheel so runtime code that reads the
# pinned version (``tolokaforge.docker.builder._pinned_python_version``)
# still finds it when installed as a wheel, where the repo-root file is
# absent from ``site-packages``.
[tool.hatch.build.targets.wheel.force-include]
".python-version" = "tolokaforge/_python_version.txt"
# Runner-image build inputs. The runner Dockerfile builds the subset wheel
# in-container with ``hatchling build --target custom`` (ADR-0025), so its
# build context needs this pyproject, the metadata files pyproject
# references, and the custom builder script. On a wheel install the repo
# root is ``site-packages`` and none of these are there, which broke every
# Docker-runtime run on 0.14.0. Ship packaged copies so
# ``builder._runner_definition()`` can assemble the same context from an
# installed package. Same source-of-truth shape as the ``.python-version``
# copy above: repo-root file authoritative, packaged copy is its artifact.
# ``.python-version`` is NOT repeated here: the entry above already ships it
# as ``tolokaforge/_python_version.txt`` (one force-include key per source),
# and ``_runner_definition()`` re-lands that copy in the context under its
# original dotfile name via a (source, destination) context entry.
"pyproject.toml" = "tolokaforge/_subset_build/pyproject.toml"
"README.md" = "tolokaforge/_subset_build/README.md"
"LICENSE" = "tolokaforge/_subset_build/LICENSE"
"scripts/hatch" = "tolokaforge/_subset_build/scripts/hatch"
# The runner Dockerfile also builds the tolokaforge-models wheel in-container
# (Milestone 29, ADR-0030) from a workspace-sibling source tree. Force-include
# the models project's `pyproject.toml` + `src/` layout so the wheel-install
# path assembles the same build context the source-checkout path has. Without
# these entries `_runner_definition()` cannot map the `tolokaforge_models/`
# context entry to a packaged copy and `COPY tolokaforge_models/` fails.
"tolokaforge_models/pyproject.toml" = "tolokaforge/_subset_build/tolokaforge_models/pyproject.toml"
"tolokaforge_models/src" = "tolokaforge/_subset_build/tolokaforge_models/src"

[tool.hatch.build.targets.sdist]

# =============================================================================
# Runner-subset wheel — Docker-only build artifact, NEVER published to PyPI.
# =============================================================================
#
# ``hatch build --target custom`` (equivalently
# ``uv run hatch build --target custom``) produces
# ``dist/tolokaforge_runner_subset-<version>-py3-none-any.whl`` — a slimmed
# variant of the base wheel that contains only the Python files the runner
# container's runtime graph reaches. The runner Docker image installs this
# wheel; pip cannot pull it from PyPI. See
# ``docs/adr/0025-runner-wheel-split.md``.
#
# ``tolokaforge/core/_runner_subset.py`` is the single source of truth for
# the partition. The ``only-include`` / ``exclude`` lists below mirror its
# three tuples verbatim; the canonical drift-lock test in
# ``tests/canonical/test_runner_subset_partition.py`` fails CI if the two
# ever disagree.
#
# The base wheel — ``[tool.hatch.build.targets.wheel]`` above — and its
# PyPI-facing metadata are unchanged.
[tool.hatch.build.targets.custom]
path = "scripts/hatch/hatch_runner_subset_builder.py"
only-include = [
    # RUNNER_SUBSET_PACKAGES — whole subpackages in the subset.
    "tolokaforge/runner",
    "tolokaforge/secrets",
    "tolokaforge/tools",
    "tolokaforge/core/actors",
    "tolokaforge/core/models",
    "tolokaforge/core/llm",
    "tolokaforge/core/grading",
    # RUNNER_SUBSET_LOOSE_FILES — shared-spine files outside a whole package.
    "tolokaforge/__init__.py",
    "tolokaforge/core/__init__.py",
    "tolokaforge/core/_runner_subset.py",
    "tolokaforge/core/deprecations.py",
    "tolokaforge/core/hash.py",
    "tolokaforge/core/logging.py",
    "tolokaforge/core/loop.py",
    "tolokaforge/core/model_data.py",
    "tolokaforge/core/netpolicy_constants.py",
    "tolokaforge/core/plugin_registry.py",
    "tolokaforge/core/pricing.py",
    "tolokaforge/core/redaction.py",
    "tolokaforge/core/run_display_events.py",
    "tolokaforge/core/tool_call_ids.py",
    "tolokaforge/core/trial.py",
]
exclude = [
    # RUNNER_SUBSET_EXCLUDED_FILES — orchestrator-only files inside an
    # otherwise-included subpackage.
    "tolokaforge/core/actors/turn_policy.py",
    "tolokaforge/core/grading/agreement.py",
    "tolokaforge/core/grading/combine.py",
    "tolokaforge/core/grading/config_validation.py",
    "tolokaforge/core/grading/corpus_curation.py",
    "tolokaforge/core/grading/migration_declaration.py",
    "tolokaforge/core/grading/replay.py",
    "tolokaforge/core/grading/replay_layout.py",
    "tolokaforge/core/grading/rubric_migration.py",
    "tolokaforge/core/grading/state_checks.py",
    "tolokaforge/core/grading/substrate_client.py",
    "tolokaforge/core/grading/substrate_live.py",
    "tolokaforge/core/grading/trace_replay.py",
    "tolokaforge/core/grading/unknown_keys.py",
    "tolokaforge/core/llm/fallback_client.py",
]

# Force-include the repo-root ``.python-version`` dotfile into the subset
# wheel as ``tolokaforge/_python_version.txt`` — mirrors the base wheel's
# ``[tool.hatch.build.targets.wheel.force-include]`` block so the pinned
# Python version is discoverable via ``importlib.resources`` from either
# wheel variant.
[tool.hatch.build.targets.custom.force-include]
".python-version" = "tolokaforge/_python_version.txt"

[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = '''
(
  contrib
  | tests/data/projects
  | external_adapters
  | examples/terminal_bench
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "**/node_modules",
    "**/__pycache__", 
    "contrib",
    "tests/data/projects", 
    "external_adapters",
    "examples/terminal_bench",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "E402",  # module-import-not-at-top (needed for some init files)
    "B904",  # raise-without-from-inside-except (too noisy, often intentional)
    "B905",  # zip-without-explicit-strict (strict param not always needed)
    "B008",  # function-call-in-default-argument (standard pattern for Typer/FastAPI)
    "SIM101",  # duplicate-isinstance-call (sometimes clearer to be explicit)
    "SIM102",  # collapsible-if (sometimes less readable when collapsed)
    "SIM103",  # needless-bool (sometimes clearer to be explicit)
    "SIM105",  # suppressible-exception (contextlib.suppress not always clearer)
    "SIM108",  # if-else-block-instead-of-if-exp (ternary not always clearer)
    "SIM116",  # if-else-block-instead-of-dict-lookup (not always applicable)
    "SIM117",  # multiple-with-statements (sometimes more readable separated)
    "UP007",  # non-pep604-annotation-union (Union[] style for recursive types)
]
fixable = ["ALL"]

[tool.ruff.lint.isort]

[tool.ruff.format]
# Use double quotes for strings (matches black default)
quote-style = "double"
# Indent with spaces (matches black default)
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "tolokaforge_models/tests", "tolokaforge_coding_harnesses/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["tests/data/projects/*/tests", "tests/data/terminal_bench_tasks/*/tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    # testcontainers internal — uses deprecated decorator; no fix on our side
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers.core.waiting_utils",
    # litellm uses Pydantic V1 APIs internally; our code uses V2
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    # Dependencies use datetime.utcnow(); 0 occurrences in our code
    "ignore:datetime\\.datetime\\.utcnow:DeprecationWarning",
    # pytest-asyncio internal; our code fixed in #57, suppression for deps only
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (with services)",
    "slow: marks tests as slow (> 5 seconds)",
    "requires_api: marks tests requiring API keys",
    "requires_docker: marks tests requiring Docker",
    "requires_browser: marks tests requiring Playwright/Chromium browser",
    "docker: marks tests that require Docker daemon (real container tests)",
    "requires_postgres: marks tests requiring a reachable Postgres instance",
    "grading: marks tests related to grading system",
    "security: marks tests for security validation",
    "performance: marks tests for performance benchmarking",
    "llm: marks tests that call real LLM providers",
    "canonical: marks canonization snapshot tests",
]

[tool.coverage.run]
# Every package the workspace ships. `--cov` with no value reads this list, so a
# `--cov=<pkg>` on a command line would replace it with a narrower one.
source = ["tolokaforge", "tolokaforge_models", "tolokaforge_coding_harnesses"]
omit = [
    "tolokaforge/*/tests/*",
    "*/test_*",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*/__main__.py",
    # gRPC service implementations (require running infrastructure)
    "tolokaforge/runner/service.py",
    # HTTP clients and tool factory (require running services / gRPC)
    "tolokaforge/runner/db_client.py",
    "tolokaforge/runner/db_proxy.py",
    "tolokaforge/runner/rag_client.py",
    "tolokaforge/runner/tool_factory.py",
    # Docker runtime clients
    "tolokaforge/core/shared_stack_runtime.py",
    "tolokaforge/core/per_trial_runtime.py",
    "tolokaforge/core/docker_adapter.py",
    # Docker SDK wrappers (require Docker daemon)
    "tolokaforge/docker/builder.py",
    "tolokaforge/docker/container.py",
    "tolokaforge/docker/image.py",
    "tolokaforge/docker/network.py",
    "tolokaforge/docker/logging.py",
    "tolokaforge/docker/wait_for_services.py",
    "tolokaforge/docker/stacks/*",
    # Docker runtime health/registry (require running containers)
    "tolokaforge/docker/health.py",
    "tolokaforge/docker/registry.py",
    # FastAPI app entry points (require service context)
    "tolokaforge/env/json_db_service/app.py",
    "tolokaforge/env/mock_web_service/app.py",
    "tolokaforge/env/rag_service/app.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# =============================================================================
# Release tooling (commitizen) — drives the `Release (cz bump)` workflow.
# `cz bump` reads/writes the single version literal in [project] version,
# regenerates CHANGELOG.md from Conventional Commits, commits, and tags vX.Y.Z.
# See CONTRIBUTING.md ("Cutting a Release").
# =============================================================================

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"          # read/write [project] version in place — single source of truth
tag_format = "v$version"             # matches the v* triggers in publish/release-gate workflows
update_changelog_on_bump = true
changelog_incremental = true         # only prepend new sections; never rewrite hand-written history
major_version_zero = true            # project is pre-1.0/unstable: breaking changes bump the minor
                                     # (0.2.x -> 0.3.0) and stay in 0.x until we deliberately cut 1.0.0
bump_message = "chore(release): bump version to $new_version"
annotated_tag = true

# Keep uv.lock's own `tolokaforge` package version in step with [project] version.
# cz bump rewrites [project] version but does NOT relock; without this the lockfile
# would pin the previous version every release. pre_bump_hooks run after the version
# is written and before cz's commit, so we relock and stage uv.lock — cz then folds
# it into the same release commit. (cz only auto-stages its own version files, so the
# explicit `git add` is required.)
pre_bump_hooks = [
    "uv lock",
    "git add -- uv.lock",
]

# =============================================================================
# Development Dependencies (PEP 735)
# =============================================================================

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-docker>=2.0.0",
    "pytest-xdist>=3.5.0",
    "psutil>=5.9.0",
    "black==26.3.1",
    "ruff==0.14.4",
    # Import-boundary enforcement for the five plug-in seams (grader,
    # runtime backends, service-readiness probes, turn policies, external
    # harnesses). Contracts live in ``.importlinter``; a forbidden import
    # fails the lint stage in ~1–3 s rather than after a full pytest run.
    # See ADR-0038 § Design Drivers (import-linter, not just Protocol
    # discipline).
    "import-linter>=2.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "playwright>=1.40.0",
    "pillow>=12.1.0",
    "docker>=7.0.0",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "grpcio-health-checking>=1.83.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "rank-bm25>=0.2.2",
    "mcp>=1.0,<2",
    "build>=1.0.0",
    "commitizen>=4.0.0",
    # ``hatchling`` is our PEP 517 build backend (see ``[build-system].requires``);
    # the canonical subset-wheel tests drive it directly via
    # ``python -m hatchling build -t custom`` — pinning it in the dev group keeps
    # it in the ``uv sync --dev`` closure so those tests do not depend on the
    # ephemeral build-backend install being present.
    "hatchling>=1.31.0",
    "psycopg[binary]>=3.2.0",
    "tolokaforge-adapter-terminal-bench",
    "dev-mcp",
    "automation",
    # Terminal front-end deps live in [project.optional-dependencies].dx.
    # Dev tooling exercises the terminal front-end tests, so pull them in
    # here explicitly rather than relying on `[dx]` being installed.
    "rich>=13.0.0",
    "click-repl>=0.3.0",
    "prompt-toolkit>=3.0.51",
]

# =============================================================================
# UV Configuration
# =============================================================================
# uv is the recommended package manager for this project
# See: https://docs.astral.sh/uv/

[tool.uv]
# Keep everyone (CI + every laptop) on a compatible uv so the committed uv.lock is
# reproducible. uv refuses to run outside this range and tells the dev to align,
# which prevents "I relocked and now CI's `uv sync --locked` rejects my lock"
# surprises. A narrow range (not one exact version) avoids forcing a reinstall on
# every uv patch; the CI pin in .github/workflows/ci.yml lives inside this range.
required-version = ">=0.9.5,<0.10"

[tool.uv.workspace]
members = [
    "tolokaforge_models",
    "tolokaforge_coding_harnesses",
    "tools/automation",
    "tools/dev-mcp",
    "tools/pricing-updater",
    "tools/rubric-calibrator",
    "external_adapters/tolokaforge-adapter-terminal-bench",
]

[tool.uv.sources]
automation = { workspace = true }
dev-mcp = { workspace = true }
rubric-calibrator = { workspace = true }
tolokaforge = { workspace = true }
tolokaforge-adapter-terminal-bench = { workspace = true }
tolokaforge-coding-harnesses = { workspace = true }
tolokaforge-models = { workspace = true }

# PyPI as primary index for cross-platform compatibility
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
